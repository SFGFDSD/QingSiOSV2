  /* ---------- 公开：体检（fsck）与回收孤块 ---------- */
  async function fsck(o) { try { return await _fsck(o); } finally { mReattach(); } }   /* 体检以数据库为准重建索引，挂载节点事后挂回 */
  async function _fsck({ deep = false, repair = true, onProgress } = {}) {

      const t0 = performance.now();

      // 2. 半成品（复制 / 导入中断）
      for (const n of all) if (n.partial && N.has(n.id)) { rep.partial++; if (repair) await _purge(n.id); }
      // 3. 父节点丢失、环

        if (n.id === ROOT || n.id === TRASH) continue;

        i++; if (onProgress && i % 10 === 0) onProgress(i, files.length);

        for (const r of contentRefs(n)) if (r.blob) refd.add(r.blob);
        if (!n.blob) continue;
        let okSize = n.store === 'opfs' && opfs ? (await opfs.size(n.blob)) === n.size : n.store === 'idb' ? (await meta.getBlob(n.blob))?.size === n.size : false;
        if (!okSize) {

          if (m && m.size === n.size && n.store === 'opfs' && opfs) { if (repair) { await opfs.put(n.blob, m); } rep.healed++; continue; }
          if (n.store === 'opfs' && !opfs) { const m2 = m; if (m2 && m2.size === n.size) { if (repair) { const nn = { ...n, store: 'idb', mirror: false }; await meta.commit({ put: [nn] }); setNode(nn); } rep.healed++; continue; } }
          rep.missing++; rep.notes.push(`内容丢失：${pathOf(n.id)}`);

  /* ---------- 批量：内容块已落盘，镜像与节点按批一次提交 ---------- */
  const newBatch = () => ({ nodes: [], blobs: [], drop: [], fresh: [], bytes: 0 });
  async function flushBatch(bt) {
    if (!bt.nodes.length && !bt.blobs.length) return;
    try { await meta.putBlobs(bt.blobs); await meta.commit({ put: bt.nodes }); }
    catch (e) {

  /* ---------- 公开：批量写入（导入 / 上传用） ---------- */

  async function importItems(destId, items, { conflict = 'rename', onConflict, onProgress, wrap } = {}) {

          try {
            const parts = it.path.split('/').filter(Boolean); if (!parts.length) continue;
            if (it.dir) { await ensureDir(parts.join('/')); continue; }
            const name = parts.pop(); const dir = await ensureDir(parts.join('/'));

        }
        await flushBatch(bt);
        if (holder) { const fin = { ...N.get(holder.id) }; delete fin.partial; await meta.commit({ put: [fin] }); setNode(fin); res.roots = [fin.id]; }
      } finally { LS.remove('fs.journal'); }
      changed('import', res.roots, [destId]);
      return res;
    });
  }

  /* ---------- 挂载：本地文件夹（File System Access API） ----------

          seen.add(name);

            return;
          }

  }
  async function mEnsure(d) { if (d && isM(d.id) && d.id !== MROOT && !mSeen.has(d.id)) await mScanDir(d); }
  function mTouch(d) { if (d && isM(d.id) && d.id !== MROOT && !mScanP.has(d.id) && Date.now() - (mSeen.get(d.id) || 0) > 3000) mScanDir(d).catch(() => { }); }
  async function mScanDeep(n, budget = { left: 50000 }) {

  }
  async function mRead(n) {
    const h = MH.get(n.id); if (!h) throw new FSError('ENOENT', '本地文件已经不在了');

    try { const f = await h.getFile(); return f.slice(0, f.size, n.mime || mimeOf(n.name)); } catch (e) { throw mErr(e, n); }
  }
  async function mWrite(dir, name, data, { conflict = 'replace', mime } = {}) {

    if (ex && conflict === 'rename') { name = uniqueName(dir.id, name); ex = null; }

    try {
      const fh = ex && MH.get(ex.id) ? MH.get(ex.id) : await MH.get(dir.id).getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      try { await w.write(blob); await w.close(); } catch (e) { try { await w.abort(); } catch (e2) { } throw e; }
      const f = await fh.getFile(), now = Date.now();
      const node = ex ? { ...ex, size: f.size, mtime: f.lastModified || now } : { id: 'm:' + newId(), parent: dir.id, name, kind: 'file', mime: mimeOf(name), size: f.size, ctime: now, mtime: f.lastModified || now, mount: true };
      MH.set(node.id, fh); mSet(node);

  /** 建子文件夹；merge=true 时同名文件夹直接复用 */
  async function mMkdir(dir, name, merge = true) {

    if (ex && ex.kind === 'dir' && merge) return ex;
    if (ex) name = uniqueName(dir.id, name);
    try {
      const dh = await MH.get(dir.id).getDirectoryHandle(name, { create: true }), now = Date.now();
      const n = mSet({ id: 'm:' + newId(), parent: dir.id, name, kind: 'dir', ctime: now, mtime: now, mount: true });
      MH.set(n.id, dh); mSeen.set(n.id, now);

  }
  async function mUnlink(n) {

    try { await ph.removeEntry(n.name, { recursive: true }); } catch (e) { if (!(e && e.name === 'NotFoundError')) throw mErr(e, n); }

  }
  /** 把任意节点（库内或挂载）复制进挂载目录；文件夹同名则合并、文件同名则覆盖 */

    if (src.kind === 'dir') {
      if (isM(src.id)) await mEnsure(src);
      const nd = await mMkdir(dst, name, true);
      for (const cid of childIds(src.id)) { const c = N.get(cid); if (c && !c.partial) await mCopyIn(c, nd, c.name, acc); }
      return nd;
    }
    const r = await mWrite(dst, name, await getContent(src), { conflict: 'replace', mime: src.mime });

  }
  /** 挂载节点复制进库内（先整棵扫完，再走库内复制，一次性转正） */
  async function mCopyOut(src, destId, name, acc) {
    await mScanDeep(src);
    const c = await _copyNode(src, destId, name, true, acc);
    const fin = { ...N.get(c.id) }; delete fin.partial; await meta.commit({ put: [fin] }); setNode(fin);
    return fin;
  }
  async function mAskConflict(n, ex, destId, pol, perId, onConflict, st) {

  /** move / copy 里只要沾了挂载，就走这里：复制 →（移动时）删除源 */

  /** 挂载里的东西进拾遗：在库里留一份副本，再从磁盘删掉（太大的直接报 EBIG，交给界面问） */
  async function mToTrash(n) {

const Thumbs = (() => {

    // 节气环：春分在右（0°），按黄经逆时针
    JIEQI.forEach((name, i) => {
      const a = -(i * 15) * Math.PI / 180, x = C + Math.cos(a) * R1, y = C + Math.sin(a) * R1, cur = name === j.name;
      const season = SEASON_OF(i), col = { 春: 'var(--willow-deep)', 夏: 'var(--jade)', 秋: 'var(--rust)', 冬: 'var(--ink3)' }[season];

    });

    });

    const mins = now.getHours() * 60 + now.getMinutes(), ha = Math.PI / 2 + ((mins + 60) % 1440) / 1440 * Math.PI * 2 - Math.PI / 12;
    s += `<path d="M${C} ${C} Q${(C + Math.cos(ha - .12) * 30).toFixed(1)} ${(C + Math.sin(ha - .12) * 30).toFixed(1)} ${(C + Math.cos(ha) * (R3 - 2)).toFixed(1)} ${(C + Math.sin(ha) * (R3 - 2)).toFixed(1)} Q${(C + Math.cos(ha + .12) * 30).toFixed(1)} ${(C + Math.sin(ha + .12) * 30).toFixed(1)} ${C} ${C}Z" fill="var(--willow-deep)" opacity=".85"/>`;
    s += `<circle cx="${C}" cy="${C}" r="26" fill="var(--paper3)" stroke="var(--line)"/><text x="${C}" y="${C - 3}" text-anchor="middle" dominant-baseline="central" font-size="20" fill="var(--ink)" style="font-family:var(--font-kai)">${sc.name}</text><text x="${C}" y="${C + 15}" text-anchor="middle" font-size="7.5" fill="var(--ink3)" style="font-family:var(--font-kai)">${sc.note}</text>`;
    return s + '</svg>';
  }
  function render() {
    const d = new Date(), j = jieqi(d), sc = shichen(d), p = JIEQI_POEM[j.name] || ['', ''];
    el.innerHTML = `<div class="sl-date">${cnYear(d.getFullYear())}年 ${cnNum(d.getMonth() + 1)}月${cnNum(d.getDate())}日</div>
      <div class="sl-sub">星期${WEEK[d.getDay()]} · ${sc.label} · ${j.name}${j.days === 0 ? '交节' : '第' + cnNum(j.days + 1) + '日'} · 距${j.next}${cnNum(j.untilNext)}日</div>
      ${wheel()}<div class="sl-poem">${esc(p[0])}<small>—— ${esc(p[1])}</small></div>`;
  }
  let timer, anchor;
  function toggle(btn) {

  return { toggle, close };
})();

    if (roots.length) { for (const id of roots) await unmount(id, true); ids = ids.filter(id => !roots.includes(id)); if (!ids.length) return; }

    const local = ids.some(FS.isMount) ? '\n其中有本地磁盘上的文件，弃后磁盘上也随之而去。' : '';

/* ---------- 导入：选文件 / 拖入（含文件夹） / 解压 ---------- */
const Importer = (() => {
  async function entriesFromDT(dt) {
    const items = [], roots = [...(dt.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
    if (!roots.length) { for (const f of dt.files || []) items.push({ path: f.name, data: f, mtime: f.lastModified }); return items; }
    async function walk(entry, pre) {
      if (entry.isFile) { const f = await new Promise((res, rej) => entry.file(res, rej)); items.push({ path: pre + entry.name, data: f, mtime: f.lastModified }); }
      else if (entry.isDirectory) {

        do { batch = await new Promise((res, rej) => rd.readEntries(res, rej)); for (const e of batch) await walk(e, pre + entry.name + '/'); } while (batch.length);
      }

    for (const r of roots) await walk(r, '');
    return items;
  }
  /** 预检同名：只问一次（替换 / 跳过 / 取消） */
  async function run(destId, items, title = '放入') {
    if (!items.length) return;
    const base = FS.pathOf(destId).replace(/\/$/, '');
    const dup = items.filter(it => !it.dir && FS.exists(base + '/' + it.path));
    let conflict = 'replace';
    if (dup.length) {
      const r = await UI.choose({ title: '有同名文件', glyph: '同', html: `有 <b>${dup.length}</b> 个文件在目标位置已经存在：<div class="dlg-files">${dup.slice(0, 30).map(d => esc(d.path)).join('<br>')}${dup.length > 30 ? '<br>…' : ''}</div>`, options: [{ label: '作罢', value: 'cancel', cls: 'ghost' }, { label: '跳过这些', value: 'skip' }, { label: '替换目标文件', value: 'replace', cls: 'primary', primary: 1 }] });
      if (!r || r === 'cancel') return;
      conflict = r;
    }
    const files = items.filter(i => !i.dir), bytes = files.reduce((s, i) => s + (i.data.size || 0), 0);
    const jb = files.length > 3 || bytes > 8 << 20 ? UI.job(title + ' ' + files.length + ' 个文件') : null;
    try {
      const res = await FS.importItems(destId, items, { conflict, onProgress: (i, n, p) => jb && jb.set(i, n, p) });
      const msg = `已放入 ${res.ok} 个文件` + (res.skipped ? `，跳过 ${res.skipped} 个` : '') + (res.failed.length ? `，${res.failed.length} 个失败` : '');
      jb ? jb.done(msg, res.failed.length ? 'warn' : undefined) : UI.toast(msg, { type: res.failed.length ? 'warn' : 'info' });
      if (res.failed.length) console.warn('[导入失败]', res.failed);

      return res;

  }

    const files = await pickFiles({ multiple: true, dir }); if (!files || !files.length) return;
    return run(destId, [...files].map(f => ({ path: (dir && f.webkitRelativePath) || f.name, data: f, mtime: f.lastModified })));
  }
  async function unzip(node, destId = node.parent) {
    const jb = UI.job('解开 ' + node.name);
    try {
      const es = (await Archive.read(await FS.read(node), node.name)).entries;
      const folder = FS.uniqueName(destId, node.name.replace(/\.(tar\.gz|tgz|tar|zip|gz)$/i, '') || baseOf(node.name));
      const items = [{ path: folder, dir: true }];
      let i = 0;
      for (const e of es) {
        if (jb.cancelled) return jb.done('作罢 · 半途停下');
        if (e.name.startsWith('__MACOSX/') || /(^|\/)\.DS_Store$/.test(e.name)) continue;
        const clean = e.name.split('/').filter(p => p && p !== '.' && p !== '..').map(p => p.replace(/[\\:*?"<>|]/g, '_')).join('/'); if (!clean) continue;
        if (e.dir) items.push({ path: folder + '/' + clean, dir: true });

      jb.done();

    } catch (e) { jb.done(); UI.toast('未成 · 解不开：' + (e.message || e), { type: 'err' }); }

})();

/* ---------- 备份：全部文件 + 设置 → 一个 ZIP；从 ZIP 还原 ---------- */
const Backup = (() => {
  const MANIFEST = '.qingsi/manifest.json';
  async function zipNodes(ids, onProgress, isCancelled, { manifest } = {}) {
    const w = new ZIP.Writer(), all = [];
    for (const id of ids) {
      const n = FS.get(id); if (!n) continue;
      if (FS.isMount(id) && n.kind === 'dir') await FS.scanDeep(id);   /* 挂载文件夹先整棵读一遍 */
      const rootPath = FS.pathOf(n.parent === FS.ROOT ? FS.ROOT : n.parent).replace(/\/$/, '');
      for (const d of FS.descendants(id)) { const x = FS.get(d); if (x && !x.partial) all.push([x, FS.pathOf(d).slice(rootPath.length + 1)]); }
    }
    let i = 0;
    for (const [x, rel] of all) {
      if (isCancelled && isCancelled()) return null;
      if (x.kind === 'dir') await w.add(rel, null, { dir: true, mtime: x.mtime });
      else { try { await w.add(rel, await FS.read(x), { mtime: x.mtime }); } catch (e) { console.warn('[打包] 跳过', rel, e); } }
      onProgress && onProgress(++i, all.length, rel);
    }
    if (manifest) await w.add(MANIFEST, new Blob([JSON.stringify(manifest, null, 1)], { type: 'application/json' }));
    return w.finish();
  }
  async function exportAll({ withPrefs = true } = {}) {
    const top = FS.list(FS.ROOT).filter(n => !n.mount).map(n => n.id);   /* 挂载的本地文件夹不进备份 */
    const files = {}; for (const id of top) for (const d of FS.descendants(id)) { const x = FS.get(d); if (x && (x.star || x.kind === 'dir')) files[FS.pathOf(d)] = { star: !!x.star, mtime: x.mtime }; }
    const manifest = { app: '青丝 OS', version: 4, at: Date.now(), count: FS.count, prefs: withPrefs ? LS.get('prefs', {}) : null, deskOrder: null, files };
    const name = '青丝备份-' + fmtTime(Date.now()).replace(/[-: ]/g, '').slice(0, 12) + '.zip';
    const jb = UI.job('导出备份');
    try { const z = await zipNodes(top, (i, n, l) => jb.set(i, n, l), () => jb.cancelled, { manifest }); if (!z) return jb.done('作罢 · 半途停下'); jb.done(`备份已生成 · ${fmtSize(z.size)}`); downloadBlob(z, name); return z; }
    catch (e) { jb.done(); UI.toast('未成 · 导出时出错：' + (e.message || e), { type: 'err' }); }
  }
  async function importAll(file) {
    if (!file) { const fs = await pickFiles({ multiple: false, accept: '.zip,application/zip' }); file = fs && fs[0]; if (!file) return; }
    let es; try { es = await ZIP.read(file); } catch (e) { return UI.toast('未成 · 此囊读不出：' + e.message, { type: 'err' }); }
    const me = es.find(e => e.name === MANIFEST); let manifest = null;
    if (me) { try { manifest = JSON.parse(await (await me.blob()).text()); } catch (e) { } }
    const fileEs = es.filter(e => e.name !== MANIFEST && !e.name.startsWith('__MACOSX/'));
    const box = h('div', { style: { marginTop: '10px' } });
    const cbP = h('input.switch', { type: 'checkbox', checked: !!(manifest && manifest.prefs) }); if (!(manifest && manifest.prefs)) cbP.disabled = true;
    box.append(h('label.dlg-check', {}, cbP, h('span', { text: '同时还原设置（主题、壁纸、程序坞…）' })));
    const r = await UI.choose({
      title: '从备份还原', glyph: '卷', extra: box,
      html: manifest ? `这是 <b>${fmtTime(manifest.at)}</b> 的青丝备份，含 <b>${fileEs.filter(e => !e.dir).length}</b> 个文件。<br>还原会与现有文件合并，同名的怎么办？` : `这个压缩包含 <b>${fileEs.filter(e => !e.dir).length}</b> 个文件（不是青丝生成的备份，会按目录结构放进根目录）。<br>同名的怎么办？`,
      options: [{ label: '作罢', value: null, cls: 'ghost' }, { label: '跳过同名', value: 'skip' }, { label: '替换同名', value: 'replace', cls: 'primary', primary: 1 }]
    });
    if (!r) return;
    const jb = UI.job('读取备份');
    const items = []; let i = 0;
    for (const e of fileEs) {
      if (jb.cancelled) return jb.done('作罢 · 半途停下');
      const p = e.name.replace(/\/$/, ''); if (!p) continue;
      const meta = manifest && manifest.files && manifest.files['/' + p];
      if (e.dir) items.push({ path: p, dir: true });
      else items.push({ path: p, data: await e.blob(mimeOf(p)), mtime: e.mtime, star: meta && meta.star });
      jb.set(++i, fileEs.length, p);
    }
    jb.done();
    const jb2 = UI.job('还原文件');
    const res = await FS.importItems(FS.ROOT, items, { conflict: r, onProgress: (k, n, p) => jb2.set(k, n, p) }).catch(e => { UI.toast('未成 · ' + e.message, { type: 'err' }); return null; });
    jb2.done(res ? `已还原 ${res.ok} 个文件${res.skipped ? `，跳过 ${res.skipped} 个` : ''}${res.failed.length ? `，${res.failed.length} 个失败` : ''}` : null);
    if (cbP.checked && manifest && manifest.prefs) { LS.set('prefs', manifest.prefs); Prefs.load(); BUS.emit('pref', '*'); UI.toast('已复 · 设置归原'); }

})();

/* ================= 拖出浏览器：把文件直接拖到真实的桌面 / 资源管理器 =================
   旧卷就有的本事，第四卷补回并做全：
   · 鼠标按下的一瞬就开始备料（单个文件直接取内容块；多选或文件夹现打一个 zip），
     等到真的拖动时，同步把 DownloadURL（Chromium 把它落成真实文件）与 File 条目（给别的网页）交给系统；
   · 同一次拖动在青丝里照旧——拖进文件夹、侧栏、桌面、拾遗，行为与原先的指针拖动完全一致
     （两套手势共用同一个会话对象，不是两套逻辑）；
   · 触屏不走这条路：长按菜单与触屏拖动不受影响。 */
const DragOut = (() => {
  const TYPE = 'application/x-qingsi-ids', MAX_ZIP = 256 * 1048576, MAX_FILES = 4000;

  const sig = ids => ids.map(id => { const n = FS.get(id); return n ? `${id}@${n.mtime || 0}@${n.size || 0}` : id; }).join('|');
  const stamp = () => fmtTime(Date.now()).replace(/[-: ]/g, '').slice(0, 12);

      const one = ids.length === 1 ? FS.get(ids[0]) : null;

      ent.blob = z; ent.name = (one ? one.name : '青丝选集-' + stamp()) + '.zip'; ent.mime = 'application/zip';

      else { const n = FS.get(ids[0]), g = h('div.fm-ghost.dragimg', {}, Shell.fileSeal(n, 40), h('span', { text: ids.length > 1 ? `${n.name} 等 ${ids.length} 项` : n.name })); document.body.append(g); dt.setDragImage(g, 16, 16); setTimeout(() => g.remove(), 0); }

  }

const QuickLook = (() => {

/* 原则：一个字都不丢 —— 每次键入都写草稿（localStorage，大稿进 IndexedDB）；保存走 HybridFS 原子写；

      if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { flush(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { flush(); out.push('<hr>'); i++; continue; }
      if (/^&gt;\s?/.test(l)) { flush(); const buf = []; while (i < L.length && /^&gt;\s?/.test(L[i])) buf.push(L[i++].replace(/^&gt;\s?/, '')); out.push(`<blockquote>${render.inner(buf)}</blockquote>`); continue; }

          buf.push(`<li>${inline(t)}</li>`);
        }
        out.push(ord ? `<ol>${buf.join('')}</ol>` : `<ul>${buf.join('')}</ul>`); continue;
      }
      if (/^\|.*\|\s*$/.test(l) && i + 1 < L.length && /^\|[\s:|-]+\|\s*$/.test(L[i + 1])) {
        flush(); const row = s => s.trim().replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
        const hd = row(l); i += 2; const rows = [];
        while (i < L.length && /^\|.*\|\s*$/.test(L[i])) rows.push(row(L[i++]));
        out.push(`<table><thead><tr>${hd.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`); continue;
      }
      if (!l.trim()) { flush(); i++; continue; }
      para.push(l); i++;
    }
    flush();
    return out.join('\n');
  }
  render.inner = lines => render(lines.join('\n').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'"));
  return { render };
})();

/** 中文排版整理：半角标点转全角（仅在中文语境）、去行尾空白、段首缩进统一、合并多余空行 */
function tidyChinese(text, { indent = true } = {}) {
  const CJK = '[\\u3400-\\u9fff\\uf900-\\ufaff]';
  const map = { ',': '，', '.': '。', '?': '？', '!': '！', ':': '：', ';': '；', '(': '（', ')': '）' };
  let t = text.replace(/\r\n?/g, '\n').replace(/[ \t]+$/gm, '');
  t = t.replace(new RegExp(`(${CJK})([,.?!:;])(?=\\s|${CJK}|$)`, 'gm'), (_, a, p) => a + map[p]);
  t = t.replace(new RegExp(`(${CJK})\\(([^()\\n]*)\\)`, 'g'), (_, a, inner) => a + '（' + inner + '）');
  t = t.replace(/\.{3,}|。{3,}/g, '……').replace(/([，。？！：；])\s+(?=[\u3400-\u9fff])/g, '$1');
  t = t.replace(/"([^"\n]*[\u3400-\u9fff][^"\n]*)"/g, '“$1”');
  t = t.replace(/\n{3,}/g, '\n\n');
  if (indent) t = t.split('\n').map(l => (/^[\s　]*[\u3400-\u9fff“「（]/.test(l) && !/^\s*([#>|`-]|\d+\.)/.test(l)) ? '　　' + l.replace(/^[\s　]+/, '') : l).join('\n');
  return t;
}

  get dirty() { return this.ta.value !== this.saved; }
  isMd() { return this.node ? /^(md|markdown)$/.test(extOf(this.node.name)) : false; }

  async load(args) {

      if (!n || n.kind !== 'file') { this.setText(''); this.win.setTitle('墨砚'); UI.toast('无此笺 · ' + args.path, { type: 'warn' }); return; }
      if (!(await UI.bigOK(n, 12 << 20, '打开'))) { this.win.close(true); return; }

      let text = '';
      try { text = await FS.read(n, 'text'); } catch (e) { UI.toast('未成 · 读不出：' + e.message, { type: 'err' }); }
      this.ro = n.size > 0 && /\uFFFD/.test(text.slice(0, 4000)) && kindOf(n) !== 'text';
      this.setText(text);
      const d = await Drafts.get(n.id);
      if (d && d.text != null && d.text !== text) this.showDraftBanner(d);
      if (this.isMd() && Prefs.get('edMdPreview')) this.togglePreview(true);
    } else {
      this.setText(args && args.text || '');
      if (args && args.draft) { const d = await Drafts.get(args.draft); if (d) { this.draftKey = args.draft; this.ta.value = d.text; this.onInput(); } }

  setText(t) { this.ta.value = t; this.saved = t; this.win.setDirty(false); this.updCount(); this.updPos(); this.gutUpd(); this.mdUpd(); this.updSaved(); }

  showDraftBanner(d) {
    this.banner.replaceChildren(
      h('span.seal-chip', { text: '稿' }),
      h('span', { html: `有一份 <b>${fmtRel(d.at)}</b> 未保存的草稿，与文件内容不同。` }),
      h('span.spacer'),
      h('button.btn.sm.ghost', { text: '丢弃草稿', on: { click: () => { Drafts.remove(this.draftKey); this.banner.classList.add('hide'); } } }),
      h('button.btn.sm', { text: '对照', on: { click: () => this.diffDraft(d) } }),
      h('button.btn.sm.primary', { text: '恢复草稿', on: { click: () => { this.replaceAllText(d.text); this.banner.classList.add('hide'); UI.toast('草稿还魂 · 昔日笔墨已重现，记得藏好', { type: 'ok' }); } } }));
    this.banner.classList.remove('hide');
  }
  diffDraft(d) {
    const a = this.saved.split('\n'), b = d.text.split('\n'), rows = [];
    const n = Math.max(a.length, b.length); let shown = 0;
    for (let i = 0; i < n && shown < 400; i++) if (a[i] !== b[i]) { shown++; rows.push(`<div class="ed-dl"><i>${i + 1}</i>${a[i] != null ? `<del>${esc(a[i]) || '&nbsp;'}</del>` : ''}${b[i] != null ? `<ins>${esc(b[i]) || '&nbsp;'}</ins>` : ''}</div>`); }
    UI.alert({ title: '草稿与文件的差异', glyph: '对', html: `<div class="ed-diff">${rows.join('') || '（只有空白差异）'}</div><div class="muted" style="font-size:12px;margin-top:6px">红为文件中的，绿为草稿中的（逐行比较）</div>` });
  }

  updTitle() {
    const nm = this.node ? this.node.name : '无题';
    this.win.setTitle((this.dirty ? '● ' : '') + nm);
    this.win.setDirty(this.dirty);
  }
  updKind() { this.st.kind.textContent = this.node ? (this.isMd() ? 'Markdown' : (extOf(this.node.name) || '纯文本').toUpperCase()) : '未存'; this.bMd.classList.toggle('dim', !this.isMd() && !this.mdOn); this.bWeb.classList.toggle('hide', !(this.node && kindOf(this.node) === 'web')); }
  updCount() {
    const t = this.ta.value;
    const han = (t.match(/[\u3400-\u9fff\uf900-\ufaff]/g) || []).length, words = (t.match(/[A-Za-z0-9_'’-]+/g) || []).length;
    const lines = t ? t.split('\n').length : 1;
    this.st.cnt.textContent = `${han ? han + ' 字' : ''}${han && words ? ' · ' : ''}${words ? words + ' 词' : ''}${!han && !words ? '0 字' : ''} · ${lines} 行`;
  }
  updPos() {
    const t = this.ta.value, p = this.ta.selectionStart, e = this.ta.selectionEnd;
    const before = t.slice(0, p), ln = before.split('\n').length, col = p - before.lastIndexOf('\n');
    this.st.pos.textContent = `第 ${ln} 行 · 第 ${col} 列` + (e > p ? ` · 选 ${e - p} 字` : '');
  }
  updSaved() {
    if (this.ro) { this.st.save.textContent = '只读（非文本内容）'; return; }
    if (this.dirty) { this.st.save.textContent = Prefs.get('edAutosave') && (this.node || this.ta.value.trim()) ? '待自动保存…' : this.node ? '未保存' : '草稿已留 · 未落款'; this.st.save.className = 'ed-saved wait'; }
    else { this.st.save.textContent = this.node ? '已存 · ' + fmtRel(this.node.mtime) : '空白稿'; this.st.save.className = 'ed-saved'; }
  }

  onInput() {
    this.updTitle(); this.updCount(); this.updPos(); this.gutUpd(); if (this.mdOn) this.mdUpd(); this.updSaved();
    this.saveDraft();
    if (Prefs.get('edAutosave') && !this.ro && (this.node || this.ta.value.trim())) this.autosave();   // 无题稿也自动保存：先落款入 /文稿
    if (!this.find.classList.contains('hide')) this.findUpdate(true);
  }
  insert(text) {
    this.ta.focus();
    if (!document.execCommand('insertText', false, text)) { const s = this.ta.selectionStart; this.ta.setRangeText(text, s, this.ta.selectionEnd, 'end'); this.onInput(); }
  }
  replaceAllText(t) { this.ta.focus(); this.ta.select(); this.insert(t); if (this.ta.value !== t) { this.ta.value = t; this.onInput(); } }

  onKey(e) {
    const ta = this.ta;
    if (e.key === 'Tab' && !e.ctrlKey && !e.altKey) {
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd, v = ta.value;
      if (s !== en && v.slice(s, en).includes('\n')) {    // 多行缩进 / 反缩进
        const ls = v.lastIndexOf('\n', s - 1) + 1, block = v.slice(ls, en);
        const nb = e.shiftKey ? block.replace(/^( {1,2}|\t|　{1,2})/gm, '') : block.replace(/^/gm, '  ');
        ta.setSelectionRange(ls, en); this.insert(nb); ta.setSelectionRange(ls, ls + nb.length);
      } else if (!e.shiftKey) this.insert(Prefs.get('edFont') === 'mono' ? '  ' : '　　');
      return;
    }
    if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.isComposing) {   // 列表与缩进延续
      const s = ta.selectionStart, v = ta.value, ls = v.lastIndexOf('\n', s - 1) + 1, line = v.slice(ls, s);
      const m = line.match(/^(\s*)([-*+]|\d+[.)])(\s+)(\[[ xX]\]\s+)?/);
      if (m && this.isMd()) {
        e.preventDefault();
        if (line.trim() === m[0].trim()) { ta.setSelectionRange(ls, s); this.insert(''); return; }
        let mk = m[2]; if (/\d/.test(mk)) mk = (parseInt(mk) + 1) + mk.slice(-1);
        this.insert('\n' + m[1] + mk + m[3] + (m[4] ? '[ ] ' : '')); return;
      }
      const ind = line.match(/^[ \t]+/);
      if (ind && Prefs.get('edFont') === 'mono') { e.preventDefault(); this.insert('\n' + ind[0]); return; }
    }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'b' && this.isMd()) { e.preventDefault(); this.wrapSel('**'); }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'i' && this.isMd()) { e.preventDefault(); this.wrapSel('*'); }
    if (e.key === 'Escape' && !this.find.classList.contains('hide')) { this.closeFind(); }
  }
  wrapSel(m) { const s = this.ta.selectionStart, e = this.ta.selectionEnd, t = this.ta.value.slice(s, e); this.insert(m + t + m); if (!t) this.ta.setSelectionRange(s + m.length, s + m.length); }

  /* ---------- 保存 ---------- */
  async save(manual) {
    if (this.ro) { if (manual) UI.toast('只可观 · 非文字之物，墨砚只读打开', { type: 'warn' }); return; }
    if (!this.node) { if (manual) return this.saveAs(); return this.autoCreate(); }
    if (!this.dirty && !manual) return;
    if (this.saving) { this.again = true; return; }
    this.saving = true;
    const text = this.ta.value;
    try {
      const fresh = FS.get(this.node.id);
      if (!fresh || FS.inTrash(fresh.id)) {
        const c = await UI.choose({ title: '文件已不在原处', glyph: '失', html: `「${esc(this.node.name)}」已被弃去或移入${TN()}。`, options: [{ label: '作罢', value: null, cls: 'ghost' }, { label: '另存为…', value: 'as', cls: 'primary', primary: 1 }] });
        this.saving = false; if (c === 'as') return this.saveAs(); return;
      }
      const ver = manual || Date.now() - this.lastVer > 5 * 60 * 1000;
      this.node = await FS.update(this.node.id, text, { version: ver });
      if (ver) this.lastVer = Date.now();
      this.saved = text; this.updTitle(); this.updSaved();
      Drafts.remove(this.draftKey);
      if (manual) { this.flashSaved(); UI.toast('藏好 · ' + this.node.name, { type: 'ok', ms: 1400 }); }
      if (this.autoName) await this.followName();
    } catch (e) {
      UI.toast('未藏 · ' + e.message + '（草稿仍在，不会丢）', { type: 'err', ms: 6000 });
    } finally {
      this.saving = false;
      if (this.again) { this.again = false; if (this.dirty) this.save(false); }
    }
  }
  /** 由首行起名（与另存为的猜名同一规则） */
  guessName(ext = '.txt') {
    const first = this.ta.value.split('\n').find(l => l.trim()) || '';
    return (first.replace(/^[#\s　]+/, '').replace(/[\\/:*?"<>|\x00-\x1f]/g, '').slice(0, 16).trim() || '无题') + ext;
  }
  /** 无题稿自动落款：/文稿/<首行>.txt（重名加序号）。之后名字随首行走，直到你亲手改名或另存 */
  async autoCreate() {
    if (this.node || this.ro || this.saving || !this.ta.value.trim()) return;
    this.saving = true;
    const text = this.ta.value;
    try {
      const dir = FS.resolve('/文稿') || await FS.mkdir('/文稿');
      const n = await FS.create(dir.id, this.guessName(), text);
      const oldKey = this.draftKey;
      this.node = n; this.draftKey = n.id; this.lastVer = Date.now(); this.autoName = n.name;
      this.saved = text; Drafts.remove(oldKey); Recent.add(n.id);
      this.win.args = { path: FS.pathOf(n.id) }; WM.saveSession();
      this.updTitle(); this.updKind(); this.updSaved();
      UI.toast('已自动落款 · ' + FS.pathOf(n.id), { ms: 2600, action: { label: '改名', fn: () => { this.autoName = null; Files.renamePrompt(FS.get(n.id)); } } });
    } catch (e) { UI.toast('未藏 · ' + e.message + '（草稿仍在，不会丢）', { type: 'err', ms: 6000 }); }
    finally {
      this.saving = false;
      if (this.again) { this.again = false; if (this.dirty) this.save(false); }
      else if (this.node && this.dirty) this.autosave();
    }
  }
  /** 自动起的名字跟着首行变；你在别处改过名，就不再动它 */
  async followName() {
    const n = this.node && FS.get(this.node.id);
    if (!n || n.name !== this.autoName) { this.autoName = null; return; }
    const want = this.guessName(n.name.slice(n.name.lastIndexOf('.')) || '.txt');
    if (want === n.name || want.replace(/ \(\d+\)(?=\.[^.]+$)/, '') === n.name.replace(/ \(\d+\)(?=\.[^.]+$)/, '')) return;

/* ================= 丹青：水墨画室 ================= */
/* 每一笔都记录为可重放的操作（点列 + 相对时间 + 随机种子），撤销/重做精确无损；
   每 12 笔存一张检查点位图，撤销时从最近的检查点重放，几百笔也是瞬时。
   存为 .qsink（JSON：画纸、尺幅、笔迹、缩略图），可随时接着画；也可导出 PNG。 */

const DQ_PAPERS = {
  xuan:  { name: '生宣', base: '#f4eddc', fiber: 'rgba(120,100,70,', fa: 0.07 },
  shu:   { name: '熟宣', base: '#efe5cc', fiber: 'rgba(130,105,60,', fa: 0.05 },
  juan:  { name: '绢本', base: '#e6d8b8', fiber: 'rgba(110,85,50,', fa: 0.06, weave: true },
  sajin: { name: '洒金', base: '#f1e3c3', fiber: 'rgba(130,100,50,', fa: 0.05, gold: true },
  ciqing:{ name: '瓷青', base: '#26353a', fiber: 'rgba(200,220,230,', fa: 0.05, dark: true },
  su:    { name: '素笺', base: '#fbf9f3', fiber: 'rgba(120,110,90,', fa: 0.03 }
};
const DQ_EXTRA_INKS = {
  泥金: { color: '#c9a24a', load: 0.95, dry: 0.0009, alpha: 0.9, wet: 0.2, light: true },
  蛤粉: { color: '#f2eee4', load: 0.95, dry: 0.0009, alpha: 0.85, wet: 0.2, light: true }
};
const DQ_INK = name => Brush.INKS[name] || DQ_EXTRA_INKS[name];
const DQ_INK_ORDER = ['浓墨', '淡墨', '枯笔', '泼墨', '朱砂', '胭脂', '藤黄', '赭石', '石绿', '石青', '泥金', '蛤粉'];
const DQ_FORMATS = [['hengfu', '横幅', 1600, 1000], ['lizhou', '立轴', 900, 1600], ['doufang', '斗方', 1200, 1200], ['shoujuan', '手卷', 3000, 900], ['shanmian', '扇面', 1600, 900]];

function dqPaintPaper(c, W, H, pid, seed = 3) {
  const P = DQ_PAPERS[pid] || DQ_PAPERS.xuan, R = rng(seed);
  c.save(); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  c.fillStyle = P.base; c.fillRect(0, 0, W, H);
  // 纤维：短而弯的细丝
  const n = Math.round(W * H / 260);
  c.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const x = R() * W, y = R() * H, a = R() * Math.PI * 2, l = 4 + R() * 22, bend = (R() - 0.5) * 8;
    c.strokeStyle = P.fiber + (P.fa * (0.3 + R())) + ')'; c.lineWidth = 0.4 + R() * 0.7;
    c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + Math.cos(a) * l / 2 + bend, y + Math.sin(a) * l / 2 - bend, x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
  }
  // 云状浓淡（帘纹与纸浆不匀）
  for (let i = 0; i < 26; i++) {
    const x = R() * W, y = R() * H, r = 80 + R() * 260, g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, P.fiber + (P.fa * 0.5) + ')'); g.addColorStop(1, P.fiber + '0)');
    c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
  }
  if (!P.weave) { c.fillStyle = P.fiber + (P.fa * 0.35) + ')'; for (let y = 0; y < H; y += 26 + R() * 4) c.fillRect(0, y, W, 0.6); }
  if (P.weave) { c.globalAlpha = 0.07; c.strokeStyle = '#5a4630'; c.lineWidth = 0.5; c.beginPath(); for (let x = 0; x < W; x += 2.2) { c.moveTo(x, 0); c.lineTo(x, H); } for (let y = 0; y < H; y += 2.2) { c.moveTo(0, y); c.lineTo(W, y); } c.stroke(); c.globalAlpha = 1; }
  if (P.gold) for (let i = 0; i < W * H / 2400; i++) {
    const x = R() * W, y = R() * H, s = 1 + R() * R() * 7, k = 3 + Math.floor(R() * 3);
    c.fillStyle = `rgba(${200 + R() * 30 | 0},${160 + R() * 30 | 0},${70 + R() * 30 | 0},${0.45 + R() * 0.45})`;
    c.beginPath(); for (let j = 0; j < k; j++) { const a = j / k * Math.PI * 2 + R(); c.lineTo(x + Math.cos(a) * s * (0.5 + R()), y + Math.sin(a) * s * (0.5 + R())); } c.fill();
  }
  // 四边微微旧色
  const v = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.62);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, P.dark ? 'rgba(0,0,0,.28)' : 'rgba(120,90,40,.13)');
  c.fillStyle = v; c.fillRect(0, 0, W, H);
  c.restore();
}

/** 印章：朱文（红字）/白文（白字），边缘风化 */
function dqDrawSeal(c, { x, y, size, text, style = 'bai', seed = 1, color = '#b8382a' }) {
  const R = rng(seed), chars = [...text].slice(0, 4), s = size;
  const cv = document.createElement('canvas'); cv.width = cv.height = Math.ceil(s + 8); const g = cv.getContext('2d');
  const o = 4, font = getComputedStyle(document.body).getPropertyValue('--font-kai') || 'serif';
  g.fillStyle = color; g.strokeStyle = color;

  const rect = () => { g.beginPath(); g.roundRect(o, o, s, s, rr); };

/* ================= 仓廪：存储与体检 =================
   四仓（OPFS · IndexedDB · localStorage · Cookie）不再画器物，而是把真实数据画成小图：
   OPFS 是一块块真实的文件、IndexedDB 是每个仓里的记录、localStorage 是一个个键、Cookie 是屋檐上的一片片瓦。
   点进去就是那一仓的真实内容：文件可看可下，记录可翻可查，索引、元数据一览无余。 */
registerApp({
  id: 'canglin', name: '仓廪', glyph: '仓', color: '#7a5a32', desc: '四重存储、体检自愈、备份', kw: 'storage disk backup fsck 存储 备份 空间 体检 indexeddb opfs cookie localstorage', w: 900, h: 660, minW: 340, minH: 300, single: true,
  create(win, args) { return new Granary(win, args); }
});

const CL_KCOL = { text: 'var(--willow)', sheet: 'var(--jade)', web: 'var(--jade)', image: 'var(--gold)', audio: 'var(--plum)', video: 'var(--plum)', pdf: 'var(--accent)', zip: 'var(--ink2)', ink: 'var(--ink)', bin: 'var(--ink3)' };

const CL_CKDESC = { user_name: ['名', '称呼 · 开机问候时叫你的名字'], sess: ['会', '会话 · 区分“新开”与“刷新”，关掉浏览器即失效'], once_: ['记', '一次性标记 · 某件事已经做过（如初见引导）'] };

const Lens = {
  ckDesc(name) { const k = name.replace(/^qs4_/, ''); for (const p in CL_CKDESC) if (k === p || (p.endsWith('_') && k.startsWith(p))) return CL_CKDESC[p]; return null; },
  /** 内容块 id → 它属于谁（当前内容 / 旧稿 / 拾遗中） */
  owners() {
    const m = new Map(), seen = new Set();
    const ids = [...FS.descendants(FS.ROOT), ...(FS.descendants(FS.TRASH) || [])];
    for (const id of ids) {
      if (seen.has(id)) continue; seen.add(id);
      const n = FS.get(id); if (!n || n.kind === 'dir' || n.mount) continue;
      if (n.blob) m.set(n.blob, { n, role: FS.inTrash(n.id) ? 'trash' : 'cur' });
      for (const v of n.ver || []) if (v.blob && !m.has(v.blob)) m.set(v.blob, { n, role: 'ver', v });
    }
    return m;
  },
  ownerText(o) { if (!o) return '孤块 · 无主，体检时回收'; const p = FS.pathOf(o.n.id) || o.n.name; return o.role === 'ver' ? `旧稿 · ${o.n.name}` : o.role === 'trash' ? `${TN()}中 · ${o.n.name}` : p; },
  ourDir() { return 'qingsi4-' + SCOPE_TAG; },
  /** OPFS：扫一遍我们的仓（分片目录下的每个文件），另记根下其它条目 */
  async opfs(limit = 4000) {
    const out = { ok: false, reason: FS.info.opfsReason || '', files: [], root: [], total: 0, more: 0 };
    if (!(navigator.storage && navigator.storage.getDirectory)) { out.reason = out.reason || '此浏览器不支持 OPFS'; return out; }
    try {
      const root = await navigator.storage.getDirectory(), mine = this.ourDir();
      for await (const [name, hd] of root.entries()) out.root.push({ name, kind: hd.kind, mine: name === mine });
      const dir = out.root.some(e => e.mine) ? await root.getDirectoryHandle(mine) : null;
      if (dir) for await (const [shard, sh] of dir.entries()) {
        if (sh.kind !== 'directory') { if (sh.kind === 'file') { const f = await sh.getFile().catch(() => null); if (f) { out.files.push({ id: shard, shard: '', size: f.size, mtime: f.lastModified }); out.total += f.size; } } continue; }
        for await (const [id, fh] of sh.entries()) {
          if (fh.kind !== 'file') continue;
          if (out.files.length >= limit) { out.more++; continue; }
          const f = await fh.getFile().catch(() => null); if (!f) continue;   /* 正在写入/刚被回收的块：清点时已不在，跳过 */
          out.files.push({ id, shard, size: f.size, mtime: f.lastModified }); out.total += f.size;
        }
      }
      out.ok = true;
    } catch (e) { out.reason = e.message || String(e); }
    return out;
  },
  async opfsDir(path) {
    let d = await navigator.storage.getDirectory();
    for (const p of path) d = await d.getDirectoryHandle(p);
    const rows = [];
    for await (const [name, hd] of d.entries()) {
      if (hd.kind === 'file') { const f = await hd.getFile().catch(() => null); if (f) rows.push({ name, kind: 'file', size: f.size, mtime: f.lastModified, h: hd }); }
      else { let n = 0; try { for await (const _ of hd.keys()) { n++; if (n > 9999) break; } } catch { continue; } rows.push({ name, kind: 'dir', count: n, h: hd }); }
    }
    return rows.sort((a, b) => (a.kind === b.kind ? 0 : a.kind === 'dir' ? -1 : 1) || a.name.localeCompare(b.name));
  },
  /* IndexedDB：另开只读连接，翻记录、看索引。同站的每一个库都能看（不只青丝自己的） */
  _dbs: new Map(),
  own(name) { return !name || name === FS.info.dbName; },
  async db(name = FS.info.dbName) {
    if (this._dbs.has(name)) return this._dbs.get(name);
    const p = new Promise((res, rej) => {
      const r = indexedDB.open(name);
      // 只看不建：库若刚被删掉，open 会顺手建一个空库——在 upgradeneeded 里撤销，绝不留下垃圾
      r.onupgradeneeded = () => { try { r.transaction.abort(); } catch { } };
      r.onsuccess = () => { const d = r.result; d.onversionchange = () => { d.close(); this._dbs.delete(name); }; res(d); };
      r.onerror = () => { this._dbs.delete(name); rej(r.error && r.error.name === 'AbortError' ? new Error('这个库已经不在了') : r.error); };
      r.onblocked = () => { this._dbs.delete(name); rej(new Error('数据库被占用')); };

  },
  closeDb(name) {
    for (const [k, p] of [...this._dbs]) if (!name || k === name) { p.then(d => d.close(), () => { }); this._dbs.delete(k); }
  },
  /** 同站所有数据库：青丝自己的一份 + 其余（含别的入口留下的另一份青丝） */
  async dbList() {
    const me = FS.info.dbName;
    if (!indexedDB.databases) return { ok: false, mine: me, others: [], reason: '这个浏览器不肯列出数据库（indexedDB.databases 不可用）' };
    let all = []; try { all = await indexedDB.databases(); } catch (e) { return { ok: false, mine: me, others: [], reason: e.message }; }
    const others = all.filter(d => d && d.name && d.name !== me).map(d => ({ name: d.name, version: d.version, qs: /^qingsi/.test(d.name) })).sort((a, b) => a.name.localeCompare(b.name));
    return { ok: true, mine: me, others };
  },
  async idbMeta(name = FS.info.dbName) {

/* ================= 表阁：CSV / TSV 表格 =================

   只画看得见的行（十万行也不卡）；表头吸顶、行号、列宽可拖、点表头排序（认数字）、筛选；
   双击单元格可改，保存时保留原来的分隔符、换行符与 BOM。 */

    if (m.index > i) out.push(document.createTextNode(src.slice(i, m.index)));

}

async function boot() {
  Ink.pickBase(); Sync.init(); Theme.init(); Tex.apply(); BUS.on('theme', () => Tex.apply());
  const { cv, winLayer } = Shell.init();
  UI.initTips(); WM.init(winLayer);
  try { await FS.init({ seed: seedFiles }); }
  catch (e) {
    console.error(e);
    document.body.append(h('div', { style: { position: 'fixed', inset: '30% 10% auto', zIndex: 9999, padding: '20px', background: 'var(--paper3)', border: '1px solid var(--accent)', borderRadius: '10px' } }, h('b', { text: '文件系统启动失败' }), h('div', { text: e.message || String(e) })));
  }
  cleanTemp(); Ink.start();
  Wallpaper.init(cv);
  Shell.start(); Lock.init(); setFavicon();
  // 全局快捷键
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'k') { e.preventDefault(); Launcher.isOpen ? Launcher.close() : Launcher.open(); }
    else if (e.altKey && !e.ctrlKey && e.key.toLowerCase() === 'l') { e.preventDefault(); Lock.lock(); }
    else if (e.altKey && e.code === 'Space') { e.preventDefault(); Launcher.open(); }
  });
  // 首次交互时请求持久化（不在启动时弹窗打扰）
  addEventListener('pointerdown', () => { if (!FS.info.persisted) FS.requestPersist().then(() => Shell.refreshCores()); }, { once: true, capture: true });
  // 阻止浏览器把拖进来的文件直接打开
  addEventListener('dragover', e => e.preventDefault()); addEventListener('drop', e => e.preventDefault());
  addEventListener('unhandledrejection', e => { const r = e.reason; if (r && r.name === 'FSError') { UI.toast(r.message, { type: 'err' }); e.preventDefault(); } });
  await WM.restoreSession();
  if (!Prefs.get('welcomed') && !Cookie.hasOnce('welcomed')) await welcome();
  else if (!Prefs.get('welcomed')) Prefs.set('welcomed', true);
  document.documentElement.classList.add('ready');
  DragOut.init(); window.__qsReady = true;
  // 数据库打不开时只能暂存在内存里：明明白白说一声，别让人写了半天一刷新全散
  if (FS.info.meta !== 'IndexedDB') UI.toast('暂存 · 书库此番未能开启，所写只在内存，关页即散；请随手导出', { type: 'err', ms: 15000, action: { label: '入仓廪', fn: () => WM.open('canglin') } });
  /* 关页前：各处的草稿立刻落盘；若还有写入没完成（导入、保存大文件），提醒一声别急着关 */
  const flushAll = () => { try { BUS.emit('flush'); } catch { } };
  addEventListener('pagehide', flushAll);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAll(); });
  addEventListener('beforeunload', e => { flushAll(); if (FS.busy) { e.preventDefault(); e.returnValue = ''; } });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
</body>
</html>
