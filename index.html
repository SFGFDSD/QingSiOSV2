/* ================= 墨砚：文本 / Markdown 编辑器 ================= */
/* 原则：一个字都不丢 —— 每次键入都写草稿（localStorage，大稿进 IndexedDB）；保存走 HybridFS 原子写；
   自动保存只在停笔后进行，且每 5 分钟才留一个历史版本，避免把版本挤满。 */

/** 极简而安全的 Markdown 渲染（先整体转义，再做有限的标记） */
const MD = (() => {
  const inline = s => s
    .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, a, u) => /^(https?:|data:image\/)/.test(u) ? `<img alt="${a}" src="${u}">` : `<span class="md-img">[图：${a}]</span>`)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => /^(https?:|mailto:|#)/.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : t)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/__([^_]+)__/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
    .replace(/~~([^~]+)~~/g, '<s>$1</s>').replace(/==([^=]+)==/g, '<mark>$1</mark>');
  function render(src) {
    const L = esc(src).replace(/\r\n?/g, '\n').split('\n'), out = [];
    let i = 0;
    const para = [];
    const flush = () => { if (para.length) { out.push(`<p>${inline(para.join('<br>'))}</p>`); para.length = 0; } };
    while (i < L.length) {
      const l = L[i];
      if (/^```/.test(l)) { flush(); const buf = []; i++; while (i < L.length && !/^```/.test(L[i])) buf.push(L[i++]); i++; out.push(`<pre><code>${buf.join('\n')}</code></pre>`); continue; }
      let m;
      if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { flush(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { flush(); out.push('<hr>'); i++; continue; }
      if (/^&gt;\s?/.test(l)) { flush(); const buf = []; while (i < L.length && /^&gt;\s?/.test(L[i])) buf.push(L[i++].replace(/^&gt;\s?/, '')); out.push(`<blockquote>${render.inner(buf)}</blockquote>`); continue; }
      if (/^\s*([-*+]|\d+[.)])\s+/.test(l)) {
        flush(); const ord = /^\s*\d/.test(l), buf = [];
        while (i < L.length && /^\s*([-*+]|\d+[.)])\s+/.test(L[i])) {
          let t = L[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, '');
          const tk = t.match(/^\[([ xX])\]\s+/); if (tk) t = `<input type="checkbox" disabled ${tk[1] !== ' ' ? 'checked' : ''}> ` + t.slice(tk[0].length);
          buf.push(`<li>${inline(t)}</li>`);
        }
        out.push(ord ? `<ol>${buf.join('')}</ol>` : `<ul>${buf.join('')}</ul>`); continue;
      }
      if (/^\|.*\|\s*$/.test(l) && i + 1 < L.length && /^\|[\s:|-]+\|\s*$/.test(L[i + 1])) {
        flush(); const row = s => s.trim().replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
        const hd = row(l); i += 2; const rows = [];
        while (i < L.length && /^\|.*\|\s*$/.test(L[i])) rows.push(row(L[i++]));
        out.push(`<table><thead><tr>${hd.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`); continue;
      }
      if (!l.trim()) { flush(); i++; continue; }
      para.push(l); i++;
    }
    flush();
    return out.join('\n');
  }
  render.inner = lines => render(lines.join('\n').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'"));
  return { render };
})();

/** 中文排版整理：半角标点转全角（仅在中文语境）、去行尾空白、段首缩进统一、合并多余空行 */
function tidyChinese(text, { indent = true } = {}) {
  const CJK = '[\\u3400-\\u9fff\\uf900-\\ufaff]';
  const map = { ',': '，', '.': '。', '?': '？', '!': '！', ':': '：', ';': '；', '(': '（', ')': '）' };
  let t = text.replace(/\r\n?/g, '\n').replace(/[ \t]+$/gm, '');
  t = t.replace(new RegExp(`(${CJK})([,.?!:;])(?=\\s|${CJK}|$)`, 'gm'), (_, a, p) => a + map[p]);
  t = t.replace(new RegExp(`(${CJK})\\(([^()\\n]*)\\)`, 'g'), (_, a, inner) => a + '（' + inner + '）');
  t = t.replace(/\.{3,}|。{3,}/g, '……').replace(/([，。？！：；])\s+(?=[\u3400-\u9fff])/g, '$1');
  t = t.replace(/"([^"\n]*[\u3400-\u9fff][^"\n]*)"/g, '“$1”');
  t = t.replace(/\n{3,}/g, '\n\n');
  if (indent) t = t.split('\n').map(l => (/^[\s　]*[\u3400-\u9fff“「（]/.test(l) && !/^\s*([#>|`-]|\d+\.)/.test(l)) ? '　　' + l.replace(/^[\s　]+/, '') : l).join('\n');
  return t;
}

  get dirty() { return this.ta.value !== this.saved; }
  isMd() { return this.node ? /^(md|markdown)$/.test(extOf(this.node.name)) : false; }

  async load(args) {
    if (args && args.path) {
      const n = FS.resolve(args.path);
      if (!n || n.kind !== 'file') { this.setText(''); this.win.setTitle('墨砚'); UI.toast('找不到文件：' + args.path, { type: 'warn' }); return; }
      if (n.size > 12 * 1024 * 1024 && !(await UI.confirm({ title: '文件很大', msg: `「${n.name}」有 ${fmtSize(n.size)}，打开可能会卡一会儿。仍要打开吗？`, ok: '打开' }))) { this.win.close(true); return; }
      this.node = n; this.draftKey = n.id;
      let text = '';
      try { text = await FS.read(n, 'text'); } catch (e) { UI.toast('读取失败：' + e.message, { type: 'err' }); }
      this.ro = n.size > 0 && /\uFFFD/.test(text.slice(0, 4000)) && kindOf(n) !== 'text';
      this.setText(text);
      const d = await Drafts.get(n.id);
      if (d && d.text != null && d.text !== text) this.showDraftBanner(d);
      if (this.isMd() && Prefs.get('edMdPreview')) this.togglePreview(true);
    } else {
      this.setText(args && args.text || '');
      if (args && args.draft) { const d = await Drafts.get(args.draft); if (d) { this.draftKey = args.draft; this.ta.value = d.text; this.onInput(); } }
    }
    this.updTitle(); this.updKind();
    requestAnimationFrame(() => { this.ta.focus({ preventScroll: true }); this.ta.setSelectionRange(0, 0); this.ta.scrollTop = 0; });
  }
  setText(t) { this.ta.value = t; this.saved = t; this.win.setDirty(false); this.updCount(); this.updPos(); this.gutUpd(); this.mdUpd(); this.updSaved(); }

  showDraftBanner(d) {
    this.banner.replaceChildren(
      h('span.seal-chip', { text: '稿' }),
      h('span', { html: `有一份 <b>${fmtRel(d.at)}</b> 未保存的草稿，与文件内容不同。` }),
      h('span.spacer'),
      h('button.btn.sm.ghost', { text: '丢弃草稿', on: { click: () => { Drafts.remove(this.draftKey); this.banner.classList.add('hide'); } } }),
      h('button.btn.sm', { text: '对照', on: { click: () => this.diffDraft(d) } }),
      h('button.btn.sm.primary', { text: '恢复草稿', on: { click: () => { this.replaceAllText(d.text); this.banner.classList.add('hide'); UI.toast('已恢复草稿，记得保存', { type: 'ok' }); } } }));
    this.banner.classList.remove('hide');
  }
  diffDraft(d) {
    const a = this.saved.split('\n'), b = d.text.split('\n'), rows = [];
    const n = Math.max(a.length, b.length); let shown = 0;
    for (let i = 0; i < n && shown < 400; i++) if (a[i] !== b[i]) { shown++; rows.push(`<div class="ed-dl"><i>${i + 1}</i>${a[i] != null ? `<del>${esc(a[i]) || '&nbsp;'}</del>` : ''}${b[i] != null ? `<ins>${esc(b[i]) || '&nbsp;'}</ins>` : ''}</div>`); }
    UI.alert({ title: '草稿与文件的差异', glyph: '对', html: `<div class="ed-diff">${rows.join('') || '（只有空白差异）'}</div><div class="muted" style="font-size:12px;margin-top:6px">红为文件中的，绿为草稿中的（逐行比较）</div>` });
  }

  updTitle() {
    const nm = this.node ? this.node.name : '无题';
    this.win.setTitle((this.dirty ? '● ' : '') + nm);
    this.win.setDirty(this.dirty);
  }
  updKind() { this.st.kind.textContent = this.node ? (this.isMd() ? 'Markdown' : (extOf(this.node.name) || '纯文本').toUpperCase()) : '未存'; this.bMd.classList.toggle('dim', !this.isMd() && !this.mdOn); this.bWeb.classList.toggle('hide', !(this.node && kindOf(this.node) === 'web')); }
  updCount() {
    const t = this.ta.value;
    const han = (t.match(/[\u3400-\u9fff\uf900-\ufaff]/g) || []).length, words = (t.match(/[A-Za-z0-9_'’-]+/g) || []).length;
    const lines = t ? t.split('\n').length : 1;
    this.st.cnt.textContent = `${han ? han + ' 字' : ''}${han && words ? ' · ' : ''}${words ? words + ' 词' : ''}${!han && !words ? '0 字' : ''} · ${lines} 行`;
  }
  updPos() {
    const t = this.ta.value, p = this.ta.selectionStart, e = this.ta.selectionEnd;
    const before = t.slice(0, p), ln = before.split('\n').length, col = p - before.lastIndexOf('\n');
    this.st.pos.textContent = `第 ${ln} 行 · 第 ${col} 列` + (e > p ? ` · 选 ${e - p} 字` : '');
  }
  updSaved() {
    if (this.ro) { this.st.save.textContent = '只读（非文本内容）'; return; }
    if (this.dirty) { this.st.save.textContent = Prefs.get('edAutosave') && this.node ? '待自动保存…' : '未保存'; this.st.save.className = 'ed-saved wait'; }
    else { this.st.save.textContent = this.node ? '已存 · ' + fmtRel(this.node.mtime) : '空白稿'; this.st.save.className = 'ed-saved'; }
  }

  onInput() {
    this.updTitle(); this.updCount(); this.updPos(); this.gutUpd(); if (this.mdOn) this.mdUpd(); this.updSaved();
    this.saveDraft();
    if (this.node && Prefs.get('edAutosave') && !this.ro) this.autosave();
    if (!this.find.classList.contains('hide')) this.findUpdate(true);
  }
  insert(text) {
    this.ta.focus();
    if (!document.execCommand('insertText', false, text)) { const s = this.ta.selectionStart; this.ta.setRangeText(text, s, this.ta.selectionEnd, 'end'); this.onInput(); }
  }
  replaceAllText(t) { this.ta.focus(); this.ta.select(); this.insert(t); if (this.ta.value !== t) { this.ta.value = t; this.onInput(); } }

  onKey(e) {
    const ta = this.ta;
    if (e.key === 'Tab' && !e.ctrlKey && !e.altKey) {
      e.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd, v = ta.value;
      if (s !== en && v.slice(s, en).includes('\n')) {    // 多行缩进 / 反缩进
        const ls = v.lastIndexOf('\n', s - 1) + 1, block = v.slice(ls, en);
        const nb = e.shiftKey ? block.replace(/^( {1,2}|\t|　{1,2})/gm, '') : block.replace(/^/gm, '  ');
        ta.setSelectionRange(ls, en); this.insert(nb); ta.setSelectionRange(ls, ls + nb.length);
      } else if (!e.shiftKey) this.insert(Prefs.get('edFont') === 'mono' ? '  ' : '　　');
      return;
    }
    if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.isComposing) {   // 列表与缩进延续
      const s = ta.selectionStart, v = ta.value, ls = v.lastIndexOf('\n', s - 1) + 1, line = v.slice(ls, s);
      const m = line.match(/^(\s*)([-*+]|\d+[.)])(\s+)(\[[ xX]\]\s+)?/);
      if (m && this.isMd()) {
        e.preventDefault();
        if (line.trim() === m[0].trim()) { ta.setSelectionRange(ls, s); this.insert(''); return; }
        let mk = m[2]; if (/\d/.test(mk)) mk = (parseInt(mk) + 1) + mk.slice(-1);
        this.insert('\n' + m[1] + mk + m[3] + (m[4] ? '[ ] ' : '')); return;
      }
      const ind = line.match(/^[ \t]+/);
      if (ind && Prefs.get('edFont') === 'mono') { e.preventDefault(); this.insert('\n' + ind[0]); return; }
    }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'b' && this.isMd()) { e.preventDefault(); this.wrapSel('**'); }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'i' && this.isMd()) { e.preventDefault(); this.wrapSel('*'); }
    if (e.key === 'Escape' && !this.find.classList.contains('hide')) { this.closeFind(); }
  }
  wrapSel(m) { const s = this.ta.selectionStart, e = this.ta.selectionEnd, t = this.ta.value.slice(s, e); this.insert(m + t + m); if (!t) this.ta.setSelectionRange(s + m.length, s + m.length); }

  /* ---------- 保存 ---------- */
  async save(manual) {
    if (this.ro) { if (manual) UI.toast('这是非文本内容，墨砚只读打开', { type: 'warn' }); return; }
    if (!this.node) { if (manual) return this.saveAs(); return; }
    if (!this.dirty && !manual) return;
    if (this.saving) { this.again = true; return; }
    this.saving = true;
    const text = this.ta.value;
    try {
      const fresh = FS.get(this.node.id);
      if (!fresh || FS.inTrash(fresh.id)) {
        const c = await UI.choose({ title: '文件已不在原处', glyph: '失', html: `「${esc(this.node.name)}」已被删除或移入拾遗。`, options: [{ label: '取消', value: null, cls: 'ghost' }, { label: '另存为…', value: 'as', cls: 'primary', primary: 1 }] });
        this.saving = false; if (c === 'as') return this.saveAs(); return;
      }
      const ver = manual || Date.now() - this.lastVer > 5 * 60 * 1000;
      this.node = await FS.update(this.node.id, text, { version: ver });
      if (ver) this.lastVer = Date.now();
      this.saved = text; this.updTitle(); this.updSaved();
      Drafts.remove(this.draftKey);
      if (manual) this.flashSaved();
    } catch (e) {
      UI.toast('保存失败：' + e.message + '（草稿已保留，不会丢）', { type: 'err', ms: 6000 });
    } finally {
      this.saving = false;
      if (this.again) { this.again = false; if (this.dirty) this.save(false); }
    }
  }
  flashSaved() { this.st.save.classList.remove('flash'); void this.st.save.offsetWidth; this.st.save.classList.add('flash'); }
  async saveAs() {
    const curDir = this.node ? FS.pathOf(this.node.parent) : '/文稿';
    const first = this.ta.value.split('\n').find(l => l.trim()) || '';
    const guess = this.node ? this.node.name : (first.replace(/^[#\s　]+/, '').replace(/[\\/:*?"<>|]/g, '').slice(0, 16).trim() || '无题') + '.txt';
    const p = await UI.prompt({ title: '另存为', glyph: '存', label: '存到（可写完整路径）', value: (curDir === '/' ? '' : curDir) + '/' + guess, selectBase: true, validate: s => { s = s.trim(); if (!s || s.endsWith('/')) return '请写上文件名'; try { FS.validName(s.split('/').pop()); } catch (e) { return e.message; } return ''; } });
    if (!p) return false;
    let path = p.trim(); if (!path.startsWith('/')) path = curDir.replace(/\/$/, '') + '/' + path;
    const ex = FS.resolve(path);
    if (ex && (!this.node || ex.id !== this.node.id)) {
      if (ex.kind === 'dir') { UI.toast('那里已有同名文件夹', { type: 'err' }); return false; }
      if (!(await UI.confirm({ title: '同名文件已存在', html: `「<b>${esc(ex.name)}</b>」已经存在。替换后旧内容会作为一个历史版本保留。`, ok: '替换目标文件', danger: true }))) return false;
    }
    try {
      const n = await FS.writeFile(path, this.ta.value);
      const oldKey = this.draftKey;
      this.node = n; this.draftKey = n.id; this.lastVer = Date.now();
      this.saved = this.ta.value; Drafts.remove(oldKey); Recent.add(n.id);
      this.win.args = { path: FS.pathOf(n.id) }; WM.saveSession();
      this.updTitle(); this.updKind(); this.updSaved(); this.flashSaved();
      UI.toast('已存到 ' + FS.pathOf(n.id), { type: 'ok' });
      return true;
    } catch (e) { UI.toast('保存失败：' + e.message, { type: 'err' }); return false; }
  }
  async confirmClose() {
    if (!this.dirty || this.ro) { if (!this.dirty) Drafts.remove(this.draftKey); return true; }
    if (this.node && Prefs.get('edAutosave')) { await this.save(false); return !this.dirty || this.confirmClose2(); }
    return this.confirmClose2();
  }
  async confirmClose2() {
    const r = await UI.choose({ title: '还没保存', glyph: '存', html: `「<b>${esc(this.node ? this.node.name : '无题')}</b>」有改动尚未保存。<br><span class="muted">不保存也会留一份草稿，下次可以找回。</span>`, options: [{ label: '取消', value: null, cls: 'ghost' }, { label: '不保存', value: 'no' }, { label: '保存', value: 'yes', cls: 'primary', primary: 1 }] });
    if (r === 'yes') { await this.save(true); return !this.dirty; }
    if (r === 'no') { Drafts.save(this.draftKey, this.ta.value, { path: this.node ? FS.pathOf(this.node.id) : '', base: this.node?.mtime || 0 }); return true; }
    return false;
  }
  async onFsChange(e) {
    if (!this.node || !e.ids.includes(this.node.id) || this.saving) return;
    const n = FS.get(this.node.id);
    if (!n) { this.st.save.textContent = '文件已被删除'; return; }
    if (n.name !== this.node.name || n.parent !== this.node.parent) { this.node = n; this.win.args = { path: FS.pathOf(n.id) }; this.updTitle(); this.updKind(); }
    if (n.mtime === this.node.mtime && n.size === this.node.size) { this.node = n; return; }
    this.node = n;
    const text = await FS.read(n, 'text').catch(() => null); if (text == null || text === this.ta.value) { this.saved = text ?? this.saved; this.updTitle(); return; }

  /* ---------- 外观 ---------- */
  applyPrefs() {

    mir.innerHTML = lines.map(l => `<div>${esc(l) || '&#8203;'}</div>`).join('');

  togglePreview(force) {

  syncPreviewScroll() { if (!this.mdOn) return; const ta = this.ta, r = ta.scrollTop / Math.max(1, ta.scrollHeight - ta.clientHeight); this.mdv.scrollTop = r * (this.mdv.scrollHeight - this.mdv.clientHeight); }

  /* ---------- 查找替换 ---------- */
  openFind(rep) {

    const sel = this.ta.value.slice(this.ta.selectionStart, this.ta.selectionEnd);

  }
  closeFind() { this.find.classList.add('hide'); this.ta.focus(); }
  findRe() {
    const q = this.fq.value; if (!q) return null;
    try { return new RegExp(this.fRe.classList.contains('on') ? q : q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g' + (this.fCase.classList.contains('on') ? '' : 'i') + 'u'); }
    catch { return 'bad'; }
  }
  findUpdate(quiet) {
    const re = this.findRe();

    if (!re) { this.fcnt.textContent = ''; return; }
    let n = 0; const v = this.ta.value; for (const m of v.matchAll(re)) { n++; if (n > 9999 || !m[0].length) break; }
    this.fcnt.textContent = n ? `共 ${n > 9999 ? '9999+' : n} 处` : '无'; this.fcnt.className = 'ed-fcnt' + (n ? '' : ' bad');

  }
  findNext(dir = 1, keepFocus) {

    this.select(m.index, m.index + m[0].length, keepFocus);

  select(a, b, keepFocus) {

    if (!Prefs.get('edVertical')) { const ln = ta.value.slice(0, a).split('\n').length, lh = parseFloat(getComputedStyle(ta).lineHeight) || 24; const y = (ln - 1) * lh; if (y < ta.scrollTop || y > ta.scrollTop + ta.clientHeight - lh * 2) ta.scrollTop = Math.max(0, y - ta.clientHeight / 3); }

  replaceOne() {

  }

  menu() {

      { label: '保存', glyph: '存', kbd: 'Ctrl S', act: () => this.save(true) },
      { label: '另存为…', glyph: '另', kbd: 'Ctrl Shift S', act: () => this.saveAs() },

      '-',

      { label: '插入当前时间', glyph: '时', act: () => { const d = new Date(), sc = shichen(d); this.insert(`${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${sc.label}`); } },

      { label: '行号', glyph: '#', checked: !!Prefs.get('edLineNo'), act: () => Prefs.set('edLineNo', !Prefs.get('edLineNo')) },
      { label: '拼写检查', glyph: 'A', checked: !!Prefs.get('edSpell'), act: () => Prefs.set('edSpell', !Prefs.get('edSpell')) },
      { label: '自动保存', glyph: '自', checked: !!Prefs.get('edAutosave'), act: () => Prefs.set('edAutosave', Prefs.get('edAutosave') ? 0 : 800) },
      { label: '更多编辑设置…', glyph: '设', act: () => WM.open('shege', { section: 'editor' }) }
    ];
  }
  tidy() {
    const v = this.ta.value, t = tidyChinese(v);
    if (t === v) return UI.toast('已经很整齐了');
    this.replaceAllText(t);
    UI.toast('已整理：全角标点、段首缩进、多余空行（Ctrl+Z 可撤销）', { type: 'ok' });
  }
  /** 把文字誊成右起竖排的长卷 PNG（带界栏与印），存到 /图画 */
  async toScrollImage() {
    const text = this.ta.value.trim(); if (!text) return UI.toast('还没有字');
    if (text.length > 6000) return UI.toast('字太多了（上限 6000 字）', { type: 'warn' });
    const fs = 30, colH = 22, gap = 18, pad = 70;
    const cols = [];
    for (const para of text.split('\n')) { const chars = [...para.replace(/\t/g, '　')]; if (!chars.length) { cols.push([]); continue; } for (let i = 0; i < chars.length; i += colH) cols.push(chars.slice(i, i + colH)); }
    const W = pad * 2 + cols.length * (fs + gap), H = pad * 2 + colH * fs * 1.12 + 40;
    if (W > 30000) return UI.toast('太长了，分几段誊吧', { type: 'warn' });
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const c = cv.getContext('2d');
    c.fillStyle = '#f3ead6'; c.fillRect(0, 0, W, H);
    const R = rng(7); for (let i = 0; i < W * H / 900; i++) { c.fillStyle = `rgba(120,100,70,${R() * 0.05})`; c.fillRect(R() * W, R() * H, 1 + R() * 2, 1); }
    c.strokeStyle = 'rgba(176,74,58,.45)'; c.lineWidth = 1.2; c.strokeRect(pad - 20, pad - 24, W - pad * 2 + 40, H - pad * 2 + 30);
    c.font = `${fs}px ${getComputedStyle(document.body).getPropertyValue('--font-kai')}`; c.fillStyle = '#1c1a17'; c.textAlign = 'center'; c.textBaseline = 'top';
    cols.forEach((col, i) => {
      const x = W - pad - i * (fs + gap) - fs / 2;
      if (i) { c.beginPath(); c.moveTo(x + (fs + gap) / 2, pad - 24); c.lineTo(x + (fs + gap) / 2, H - pad + 6); c.stroke(); }
      col.forEach((ch, j) => { const y = pad + j * fs * 1.12; if ('，。、；：？！'.includes(ch)) { c.save(); c.font = `${fs * 0.8}px sans-serif`; c.fillText(ch, x + fs * 0.25, y - fs * 0.25); c.restore(); } else if ('（）《》「」『』“”‘’…—'.includes(ch)) { c.save(); c.translate(x, y + fs / 2); c.rotate(Math.PI / 2); c.fillText(ch, 0, -fs / 2); c.restore(); } else c.fillText(ch, x, y); });
    });
    // 印
    const sx = pad - 6, sy = H - pad - 64; c.fillStyle = '#b8432f'; c.fillRect(sx, sy, 52, 52); c.fillStyle = '#f3ead6';
    Brush.glyphToCanvas(c, '青', sx + 3, sy + 3, 46, '#f3ead6');
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    const nm = (this.node ? baseOf(this.node.name) : '无题') + '·长卷.png';
    const n = await FS.create(FS.resolve('/图画')?.id || (await FS.mkdir('/图画')).id, nm, blob, { conflict: 'rename' });
    UI.toast('已誊成长卷：/图画/' + n.name, { type: 'ok', action: { label: '看看', act: () => WM.openFile(n) } });
  }

/* ================= 丹青：水墨画室 ================= */
/* 每一笔都记录为可重放的操作（点列 + 相对时间 + 随机种子），撤销/重做精确无损；
   每 12 笔存一张检查点位图，撤销时从最近的检查点重放，几百笔也是瞬时。
   存为 .qsink（JSON：画纸、尺幅、笔迹、缩略图），可随时接着画；也可导出 PNG。 */

const DQ_PAPERS = {
  xuan:  { name: '生宣', base: '#f4eddc', fiber: 'rgba(120,100,70,', fa: 0.07 },
  shu:   { name: '熟宣', base: '#efe5cc', fiber: 'rgba(130,105,60,', fa: 0.05 },
  juan:  { name: '绢本', base: '#e6d8b8', fiber: 'rgba(110,85,50,', fa: 0.06, weave: true },
  sajin: { name: '洒金', base: '#f1e3c3', fiber: 'rgba(130,100,50,', fa: 0.05, gold: true },
  ciqing:{ name: '瓷青', base: '#26353a', fiber: 'rgba(200,220,230,', fa: 0.05, dark: true },
  su:    { name: '素笺', base: '#fbf9f3', fiber: 'rgba(120,110,90,', fa: 0.03 }
};
const DQ_EXTRA_INKS = {
  泥金: { color: '#c9a24a', load: 0.95, dry: 0.0009, alpha: 0.9, wet: 0.2, light: true },
  蛤粉: { color: '#f2eee4', load: 0.95, dry: 0.0009, alpha: 0.85, wet: 0.2, light: true }
};
const DQ_INK = name => Brush.INKS[name] || DQ_EXTRA_INKS[name];
const DQ_INK_ORDER = ['浓墨', '淡墨', '枯笔', '泼墨', '朱砂', '胭脂', '藤黄', '赭石', '石绿', '石青', '泥金', '蛤粉'];
const DQ_FORMATS = [['hengfu', '横幅', 1600, 1000], ['lizhou', '立轴', 900, 1600], ['doufang', '斗方', 1200, 1200], ['shoujuan', '手卷', 3000, 900], ['shanmian', '扇面', 1600, 900]];

function dqPaintPaper(c, W, H, pid, seed = 3) {
  const P = DQ_PAPERS[pid] || DQ_PAPERS.xuan, R = rng(seed);
  c.save(); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  c.fillStyle = P.base; c.fillRect(0, 0, W, H);
  // 纤维：短而弯的细丝
  const n = Math.round(W * H / 260);
  c.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const x = R() * W, y = R() * H, a = R() * Math.PI * 2, l = 4 + R() * 22, bend = (R() - 0.5) * 8;
    c.strokeStyle = P.fiber + (P.fa * (0.3 + R())) + ')'; c.lineWidth = 0.4 + R() * 0.7;
    c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + Math.cos(a) * l / 2 + bend, y + Math.sin(a) * l / 2 - bend, x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
  }
  // 云状浓淡（帘纹与纸浆不匀）
  for (let i = 0; i < 26; i++) {
    const x = R() * W, y = R() * H, r = 80 + R() * 260, g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, P.fiber + (P.fa * 0.5) + ')'); g.addColorStop(1, P.fiber + '0)');
    c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
  }
  if (!P.weave) { c.fillStyle = P.fiber + (P.fa * 0.35) + ')'; for (let y = 0; y < H; y += 26 + R() * 4) c.fillRect(0, y, W, 0.6); }
  if (P.weave) { c.globalAlpha = 0.07; c.strokeStyle = '#5a4630'; c.lineWidth = 0.5; c.beginPath(); for (let x = 0; x < W; x += 2.2) { c.moveTo(x, 0); c.lineTo(x, H); } for (let y = 0; y < H; y += 2.2) { c.moveTo(0, y); c.lineTo(W, y); } c.stroke(); c.globalAlpha = 1; }
  if (P.gold) for (let i = 0; i < W * H / 2400; i++) {
    const x = R() * W, y = R() * H, s = 1 + R() * R() * 7, k = 3 + Math.floor(R() * 3);
    c.fillStyle = `rgba(${200 + R() * 30 | 0},${160 + R() * 30 | 0},${70 + R() * 30 | 0},${0.45 + R() * 0.45})`;
    c.beginPath(); for (let j = 0; j < k; j++) { const a = j / k * Math.PI * 2 + R(); c.lineTo(x + Math.cos(a) * s * (0.5 + R()), y + Math.sin(a) * s * (0.5 + R())); } c.fill();
  }
  // 四边微微旧色
  const v = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.62);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, P.dark ? 'rgba(0,0,0,.28)' : 'rgba(120,90,40,.13)');
  c.fillStyle = v; c.fillRect(0, 0, W, H);
  c.restore();
}

/** 印章：朱文（红字）/白文（白字），边缘风化 */
function dqDrawSeal(c, { x, y, size, text, style = 'bai', seed = 1, color = '#b8382a' }) {
  const R = rng(seed), chars = [...text].slice(0, 4), s = size;
  const cv = document.createElement('canvas'); cv.width = cv.height = Math.ceil(s + 8); const g = cv.getContext('2d');
  const o = 4, font = getComputedStyle(document.body).getPropertyValue('--font-kai') || 'serif';
  g.fillStyle = color; g.strokeStyle = color;
  const rr = s * 0.06;
  const rect = () => { g.beginPath(); g.roundRect(o, o, s, s, rr); };
  // 字位：右起竖读
  const cells = (() => {
    const n = chars.length, m = s * 0.1, inner = s - m * 2;
    if (n <= 1) return [[o + m, o + m, inner, inner]];
    if (n === 2) return [[o + m + inner / 2, o + m, inner / 2, inner], [o + m, o + m, inner / 2, inner]];
    if (n === 3) return [[o + m + inner / 2, o + m, inner / 2, inner], [o + m, o + m, inner / 2, inner / 2], [o + m, o + m + inner / 2, inner / 2, inner / 2]];
    return [[o + m + inner / 2, o + m, inner / 2, inner / 2], [o + m + inner / 2, o + m + inner / 2, inner / 2, inner / 2], [o + m, o + m, inner / 2, inner / 2], [o + m, o + m + inner / 2, inner / 2, inner / 2]];
  })();
  const drawChars = () => chars.forEach((ch, i) => {
    const [cx, cy, cw, chh] = cells[i];
    g.save(); g.translate(cx + cw / 2, cy + chh / 2); g.scale(1, chh / cw > 1.4 ? 1.9 : 1);
    const fs = cw * 0.94; g.font = `bold ${fs}px ${font}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(ch, 0, fs * 0.04); g.restore();
  });
  if (style === 'bai') { rect(); g.fill(); g.globalCompositeOperation = 'destination-out'; drawChars(); }
  else { g.lineWidth = s * 0.07; g.beginPath(); g.roundRect(o + g.lineWidth / 2, o + g.lineWidth / 2, s - g.lineWidth, s - g.lineWidth, rr); g.stroke(); drawChars(); }
  // 风化：边缘缺口与斑驳
  g.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 18 + s / 4; i++) { const side = R() * 4 | 0, t = R() * s, d = R() * s * 0.05; const px = side === 0 ? o + t : side === 1 ? o + s - d : side === 2 ? o + t : o + d, py = side === 0 ? o + d : side === 1 ? o + t : side === 2 ? o + s - d : o + t; g.beginPath(); g.arc(px, py, 0.5 + R() * s * 0.025, 0, 7); g.fill(); }
  for (let i = 0; i < s * 1.4; i++) { g.globalAlpha = 0.3 + R() * 0.7; g.fillRect(o + R() * s, o + R() * s, 0.6 + R() * 1.6, 0.6 + R() * 1.2); }
  c.save(); c.globalAlpha = 0.92; c.globalCompositeOperation = 'multiply'; c.drawImage(cv, x - s / 2 - o, y - s / 2 - o); c.restore();
}

/** 款识：右起竖书 */
function dqDrawText(c, { x, y, size, text, ink = '浓墨', seed = 1 }) {
  const R = rng(seed), I = DQ_INK(ink) || Brush.INKS.浓墨, font = getComputedStyle(document.body).getPropertyValue('--font-kai') || 'serif';
  c.save(); c.globalCompositeOperation = 'multiply';
  c.font = `${size}px ${font}`; c.textAlign = 'center'; c.textBaseline = 'top';
  text.split('\n').forEach((line, col) => {
    [...line].forEach((ch, i) => {
      const cx = x - col * size * 1.35 + (R() - 0.5) * size * 0.04, cy = y + i * size * 1.08;
      c.fillStyle = rgba(I.color, 0.82 + R() * 0.15);
      if ('，。、；：？！'.includes(ch)) { c.save(); c.font = `${size * 0.7}px ${font}`; c.fillText(ch, cx + size * 0.28, cy - size * 0.35); c.restore(); }
      else if ('（）《》「」『』“”‘’…—'.includes(ch)) { c.save(); c.translate(cx, cy + size / 2); c.rotate(Math.PI / 2); c.textBaseline = 'middle'; c.fillText(ch, 0, 0); c.restore(); }
      else { c.save(); c.translate(cx, cy + size / 2); c.rotate((R() - 0.5) * 0.04); c.fillText(ch, 0, -size / 2); c.restore(); }
    });
  });
  c.restore();
}

  constructor(win, args) {

  async start(args) {

class PoemPaper {

    this.paperSeg = h('div.seg', {}, ...SJ_PAPERS.map(([id, l]) => h('button', { text: l, dataset: { p: id }, on: { click: () => { this.paper = id; Prefs.set('sjPaper', id); this.render(); } } })));
    this.bar = h('div.sj-bar', {}, h('button.ibtn', { html: icon('side'), dataset: { tip: '诗目' }, on: { click: () => this.el.classList.toggle('noside') } }),
      b('上一首', '←', () => this.go(this.i - 1), '.ghost'), b('随缘', '随机一首（R）', () => this.random()), b('下一首', '→', () => this.go(this.i + 1), '.ghost'),
      h('span.spacer'), this.paperSeg,
      h('button.ibtn', { html: icon('more'), dataset: { tip: '更多' }, on: { click: e => UI.menuAt(e.currentTarget, this.menu()) } }));
    this.el = h('div.sj' + (isMobile() ? '.noside' : ''), {}, this.bar, h('div.sj-body', {}, this.side, h('div.sj-desk', {}, this.sheet)));
    win.body.append(this.el);
    this.el.addEventListener('keydown', e => { if (e.target === this.q) return; if (e.key === 'ArrowLeft') this.go(this.i + 1); else if (e.key === 'ArrowRight') this.go(this.i - 1); else if (e.key === 'ArrowDown' || e.key === 'PageDown') this.go(this.i + 1); else if (e.key === 'ArrowUp' || e.key === 'PageUp') this.go(this.i - 1); else if (e.key.toLowerCase() === 'r') this.random(); });
    // 触屏左右轻扫：向右扫看下一首（竖排右起，翻页方向与书一致）
    let sx = null; this.sheet.addEventListener('pointerdown', e => { sx = e.clientX; }); this.sheet.addEventListener('pointerup', e => { if (sx != null && Math.abs(e.clientX - sx) > 60) this.go(this.i + (e.clientX > sx ? 1 : -1)); sx = null; });
    win.on('args', a => a && a.poem && this.goTitle(a.poem));

  daily() {

    const day = Math.floor((Date.now() + 8 * 3600e3) / 864e5), pick = pool.length ? pool[day % pool.length][1] : day % POEMS.length;
    this.go(pick, true);
  }
  goTitle(t) { const i = POEMS.findIndex(p => p.t === t); if (i >= 0) this.go(i); }
  random() { let i; do i = Math.floor(Math.random() * POEMS.length); while (i === this.i && POEMS.length > 1); this.go(i); }
  go(i, first) {
    this.i = (i + POEMS.length) % POEMS.length;

    $$('.sj-it', this.list).forEach(x => x.classList.toggle('on', +x.dataset.i === this.i));

  renderList() {
    const q = this.q.value.trim();

    this.list.replaceChildren(...items.map(([p, i]) => h('button.sj-it' + (i === this.i ? '.on' : ''), { dataset: { i }, on: { click: () => { this.go(i); if (isMobile()) this.el.classList.add('noside'); } } }, h('b', { text: p.t }), h('span', { text: `${p.d} · ${p.a}` }), h('i', { text: p.s }))));
    if (!items.length) this.list.append(h('div.muted', { style: { padding: '12px', fontSize: '13px' }, text: '没有寻到' }));

  render(first) {

    $$('button', this.paperSeg).forEach(x => x.classList.toggle('on', x.dataset.p === this.paper));
    const cols = h('div.sj-cols', {},
      h('div.sj-col.sj-tt', { text: p.t }),
      h('div.sj-col.sj-au', { text: `${p.d}　${p.a}` }),
      ...p.b.map((l, k) => h('div.sj-col', { style: { '--d': (k * 0.12 + 0.15) + 's' } }, ...[...l].map(ch => '，。？！、；：'.includes(ch) ? h('span.sj-pu', { text: ch }) : document.createTextNode(ch)))),
      h('div.sj-seal', { text: (Prefs.get('userName') || '青丝').slice(0, 2) }));
    const card = h('div.sj-card.p-' + this.paper + (first ? '' : '.turn'), {}, cols);
    this.sheet.replaceChildren(card);
    this.win.setTitle('诗笺 · ' + p.t);
  }
  menu() {
    const p = POEMS[this.i], text = `${p.t}\n${p.d} · ${p.a}\n\n${p.b.join('\n')}\n`;
    return [
      { label: '录入文稿（/诗笺）', glyph: '录', act: async () => { const dir = FS.resolve('/诗笺') || await FS.mkdir('/诗笺'); const n = await FS.create(dir.id, p.t.replace(/[\\/:*?"<>|]/g, '') + '.txt', text); UI.toast('已录入 /诗笺/' + n.name, { type: 'ok', action: { label: '打开', fn: () => WM.openFile(n) } }); } },
      { label: '誊为图画', glyph: '画', act: () => this.toImage() },
      { label: '复制诗文', glyph: '复', act: async () => { try { await navigator.clipboard.writeText(text); UI.toast('已复制', { type: 'ok' }); } catch { UI.toast('复制失败', { type: 'err' }); } } },
      { label: '在丹青里题这首诗', glyph: '丹', act: () => { WM.open('danqing', {}); UI.toast('选「款」工具，在款识框里粘贴诗句即可题写'); navigator.clipboard?.writeText(p.b.join('')).catch(() => {}); } },
      '-',
      { label: '卷帘时吟诗', glyph: '帘', checked: !!Prefs.get('lockPoem'), act: () => Prefs.set('lockPoem', !Prefs.get('lockPoem')) }
    ];
  }
  async toImage() {
    const p = POEMS[this.i], size = 46, cols = [p.t, '', ...p.b.map(l => l.replace(/[，。？！、；：]/g, ''))];
    const maxLen = Math.max(...cols.map(c => [...c].length)), W = Math.round(cols.length * size * 1.5 + size * 4), H = Math.round(maxLen * size * 1.1 + size * 4);
    const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
    dqPaintPaper(g, W, H, this.paper === 'sajin' ? 'sajin' : this.paper === 'qing' ? 'ciqing' : this.paper === 'xuetao' ? 'shu' : 'xuan', 11);
    if (this.paper === 'xuetao') { g.fillStyle = 'rgba(214,120,120,.16)'; g.fillRect(0, 0, W, H); }
    g.strokeStyle = 'rgba(176,74,58,.4)'; g.lineWidth = 1.4;
    for (let k = 0; k <= cols.length; k++) { const x = W - size * 2 - k * size * 1.5 + size * 0.75; g.beginPath(); g.moveTo(x, size * 1.4); g.lineTo(x, H - size * 1.4); g.stroke(); }
    const ink = this.paper === 'qing' ? '泥金' : '浓墨';
    cols.forEach((col, k) => { if (col) dqDrawText(g, { x: W - size * 2 - k * size * 1.5, y: size * 1.8, size: k === 0 ? size * 1.05 : size, text: col, ink, seed: k + 3 }); });
    dqDrawText(g, { x: W - size * 2 - 1 * size * 1.5, y: size * 1.8 + size * 4, size: size * 0.6, text: `${p.d}　${p.a}`, ink, seed: 2 });
    dqDrawSeal(g, { x: size * 2.2, y: H - size * 2.4, size: size * 1.4, text: (Prefs.get('userName') || '青丝').slice(0, 4), style: 'bai', seed: 5 });
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    const dir = FS.resolve('/诗笺') || await FS.mkdir('/诗笺');
    const n = await FS.create(dir.id, p.t.replace(/[\\/:*?"<>|]/g, '') + '.png', blob);
    UI.toast('已誊为图画：/诗笺/' + n.name, { type: 'ok', action: { label: '看看', fn: () => WM.openFile(n) } });
  }

/* ================= 表阁：CSV / TSV 表格 =================
   RFC 4180 解析（引号、转义引号、单元格内换行、CRLF），分隔符自动识别，编码自动识别（UTF-8 / GB18030 / UTF-16）。
   只画看得见的行（十万行也不卡）；表头吸顶、行号、列宽可拖、点表头排序（认数字）、筛选；
   双击单元格可改，保存时保留原来的分隔符、换行符与 BOM。 */
const CSV = {
  sniff(text) {
    const sample = text.slice(0, 20000).split(/\r?\n/).slice(0, 30).filter(Boolean);
    let best = ',', score = -1;
    for (const d of [',', '\t', ';', '|']) {
      const counts = sample.map(l => { let n = 0, q = false; for (const c of l) { if (c === '"') q = !q; else if (c === d && !q) n++; } return n; });
      if (!counts.length || !counts[0]) continue;
      const same = counts.filter(c => c === counts[0]).length / counts.length;
      const s = same * 10 + Math.min(counts[0], 20) / 20;
      if (s > score) { score = s; best = d; }
    }
    return best;
  },
  parse(text, d) {
    const rows = []; let row = [], cell = '', i = 0, q = false; const n = text.length;
    while (i < n) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i += 2; continue; } q = false; i++; continue; }
        cell += c; i++; continue;
      }
      if (c === '"' && cell === '') { q = true; i++; continue; }
      if (c === d) { row.push(cell); cell = ''; i++; continue; }
      if (c === '\r') { i++; if (text[i] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; continue; }
      if (c === '\n') { i++; row.push(cell); rows.push(row); row = []; cell = ''; continue; }
      // 大段普通字符一次吃掉
      let j = i + 1; while (j < n) { const x = text[j]; if (x === d || x === '\n' || x === '\r' || x === '"') break; j++; }
      cell += text.slice(i, j); i = j;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  },
  stringify(rows, d, eol = '\n') {
    const need = new RegExp(`["\\r\\n${d === '\t' ? '\\t' : d.replace(/[|]/g, '\\|')}]|^\\s|\\s$`);
    return rows.map(r => r.map(v => { v = v == null ? '' : String(v); return need.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(d)).join(eol) + eol;
  }
};

## 三根卷轴

- **开**：两根轴向屏幕两端推开，画卷展满；再按一次，收回原处。
- **合**：两根轴从左右向中间卷拢，合成一线。有没存的字时，合轴上会悬一滴朱墨。

把鼠标停在卷轴上，笔会把字一笔一笔写出来。

## 四核存储
- **OPFS**：存文件内容，快，适合大文件。
- **IndexedDB**：存索引、旧稿，以及小文件的镜像——OPFS 万一丢了内容，会从镜像自动补回。
- **localStorage**：存设置、草稿（写字时每停一下就存一次）。
- **Cookie**：记得你是谁。

每一步写入都先落新内容、再一次性切换索引、最后才删旧内容；中途断电或崩溃，下次打开会自动体检、清理半成品。

## 小提示
- \`Ctrl K\` 呼出「寻」：程序、文件、命令、设置、诗句，一处都能找。
- \`Alt W\` 合 · \`Alt M\` 收 · \`Alt ↑\` 开 · \`Alt ← →\` 靠边半屏。
- 把窗口拖到屏幕边缘可以吸附半屏、四分之一屏；拖到顶部展开。
- 点顶栏右侧的节气，看今日时令。
- 书阁里除了图标、列表，还有「书架」与「长卷」两种看法。
- 设阁里几乎一切都能调，也能整体导出、导入。

async function boot() {
  Sync.init(); Theme.init();
  const { cv, winLayer } = Shell.init();
  UI.initTips(); WM.init(winLayer);
  try { await FS.init({ seed: seedFiles }); }
  catch (e) {
    console.error(e);
    document.body.append(h('div', { style: { position: 'fixed', inset: '30% 10% auto', zIndex: 9999, padding: '20px', background: 'var(--paper3)', border: '1px solid var(--accent)', borderRadius: '10px' } }, h('b', { text: '文件系统启动失败' }), h('div', { text: e.message || String(e) })));
  }
  cleanTemp();
  Wallpaper.init(cv);
  Shell.start(); Lock.init(); setFavicon();
  // 全局快捷键
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'k') { e.preventDefault(); Launcher.isOpen ? Launcher.close() : Launcher.open(); }
    else if (e.altKey && !e.ctrlKey && e.key.toLowerCase() === 'l') { e.preventDefault(); Lock.lock(); }
    else if (e.altKey && e.code === 'Space') { e.preventDefault(); Launcher.open(); }
  });
  // 首次交互时请求持久化（不在启动时弹窗打扰）
  addEventListener('pointerdown', () => { if (!FS.info.persisted) FS.requestPersist().then(() => Shell.refreshCores()); }, { once: true, capture: true });
  // 阻止浏览器把拖进来的文件直接打开
  addEventListener('dragover', e => e.preventDefault()); addEventListener('drop', e => e.preventDefault());
  addEventListener('unhandledrejection', e => { const r = e.reason; if (r && r.name === 'FSError') { UI.toast(r.message, { type: 'err' }); e.preventDefault(); } });
  await WM.restoreSession();
  if (!Prefs.get('welcomed') && !Cookie.hasOnce('welcomed')) await welcome();
  else if (!Prefs.get('welcomed')) Prefs.set('welcomed', true);
  document.documentElement.classList.add('ready');
  window.__qsReady = true;
  /* 关页前：各处的草稿立刻落盘；若还有写入没完成（导入、保存大文件），提醒一声别急着关 */
  const flushAll = () => { try { BUS.emit('flush'); } catch { } };
  addEventListener('pagehide', flushAll);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAll(); });
  addEventListener('beforeunload', e => { flushAll(); if (FS.busy) { e.preventDefault(); e.returnValue = ''; } });
}
