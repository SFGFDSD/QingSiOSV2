<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#ebe2d0">
<meta name="color-scheme" content="light dark">
<title>青丝 OS · V4</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='10' fill='%23b8402f'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23f3ead8' font-family='serif'%3E%E9%9D%92%3C/text%3E%3C/svg%3E">
<style>
/* ── 00-base.css ── */
/* ================= 基础：变量、排版、控件 ================= */
:root {
  --paper: #ebe2d0; --paper2: #d9ceb8; --paper3: #f4eee2; --ink: #1c1a17; --ink2: #3a3530; --ink3: #7a7266; --line: #cbbfa6;
  --willow: #7a8b6f; --willow-deep: #4f5e48; --willow-mist: #a8b89a; --accent: #c44a3a; --gold: #b08a4a; --jade: #5d7a6f; --plum: #6b3a4a; --rust: #a8553a;
  --bar: #1f1d1a; --bar-ink: #e9e1cf; --dock: rgba(31,29,26,.93); --sel: rgba(122,139,111,.24); --glass: rgba(244,238,226,.78);
  /* 字：全系统只有一种字——花字（本机楷/宋当场写成的毛笔字）；--font-base 由 Ink 按本机字体填写 */
  --font-base: "Kaiti SC", "STKaiti", "KaiTi", "BiauKai", "AR PL UKai CN", "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
  --font-ink: "QS Huazi", var(--font-base);
  --font-ui: var(--font-ink); --font-display: var(--font-ink);
  --font-kai: var(--font-display); --font-song: var(--font-ui); --font-sans: var(--font-ui);
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace;
  --ui-scale: 1; --rk: 0; --r: calc(10px * var(--rk)); --r-sm: calc(6px * var(--rk)); --bar-h: 34px; --dock-h: 66px;
  --ease: cubic-bezier(.22, .8, .24, 1); --ease-ink: cubic-bezier(.6, .05, .3, 1); --spring: cubic-bezier(.3, 1.4, .5, 1);
  --t: .22s; --shadow: 0 1px 2px rgba(40,30,20,.08), 0 8px 24px rgba(40,30,20,.12), 0 24px 60px rgba(40,30,20,.12);
  --shadow-sm: 0 1px 2px rgba(40,30,20,.1), 0 4px 12px rgba(40,30,20,.1);
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
}
:root.dark { --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.4), 0 30px 70px rgba(0,0,0,.35); --shadow-sm: 0 2px 10px rgba(0,0,0,.35); }
:root[data-glyph=display] { --font-ui: var(--font-base); --font-kai: var(--font-display); --font-song: var(--font-ui); --font-sans: var(--font-ui); }
:root[data-glyph=font] { --font-ui: var(--font-base); --font-display: var(--font-base); --font-kai: var(--font-display); --font-song: var(--font-ui); --font-sans: var(--font-ui); }
:root[data-density=compact] { --bar-h: 30px; --dock-h: 56px; }
:root[data-motion="0"] *, :root[data-motion="0"] *::before, :root[data-motion="0"] *::after { animation-duration: 0s !important; animation-delay: 0s !important; transition-duration: 0s !important; }
:root[data-motion="1"] { --t: .14s; }
@media (pointer: coarse) { :root { --bar-h: 38px; } }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: pan-x pan-y; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  font: calc(14px * var(--ui-scale)) / 1.55 var(--font-ui); color: var(--ink); background: var(--paper);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  user-select: none; -webkit-user-select: none; text-rendering: optimizeLegibility;
}
input, textarea, select, button { font: inherit; color: inherit; }
input, textarea, [contenteditable=true], .selectable { user-select: text; -webkit-user-select: text; }
button { cursor: pointer; }
::selection { background: color-mix(in srgb, var(--willow) 35%, transparent); }
svg.glyph { display: block; overflow: visible; }
@keyframes qs-write { to { stroke-dashoffset: 0; } }
@keyframes qs-stroke-in { 0% { opacity: 0; filter: blur(1.2px); } 60% { opacity: .85; } 100% { opacity: 1; filter: none; } }
@keyframes qs-fade-in { from { opacity: 0; } }
@keyframes qs-rise { from { opacity: 0; transform: translateY(8px) scale(.98); } }
@keyframes qs-spin { to { transform: rotate(360deg); } }
@keyframes qs-ink-pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }

/* 滚动条：一笔细墨 */
* { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--ink3) 45%, transparent) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--ink3) 40%, transparent); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--ink3) 65%, transparent); }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }

/* ---------- 按钮 ---------- */
.btn {
  --b: var(--line); display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; padding: 0 14px;
  border: 1px solid var(--b); border-radius: var(--r-sm); background: var(--paper3); color: var(--ink);
  transition: background var(--t), border-color var(--t), transform .08s, box-shadow var(--t); white-space: nowrap; letter-spacing: .04em;
}
.btn:hover { background: color-mix(in srgb, var(--paper3) 70%, var(--willow-mist)); border-color: color-mix(in srgb, var(--line) 50%, var(--willow)); }
.btn:active { transform: translateY(1px) scale(.985); }
.btn:focus-visible, .ibtn:focus-visible, .field:focus-visible { outline: 2px solid color-mix(in srgb, var(--willow) 70%, transparent); outline-offset: 2px; }
.btn.primary { background: var(--willow-deep); border-color: var(--willow-deep); color: var(--paper3); }
.btn.primary:hover { background: color-mix(in srgb, var(--willow-deep) 85%, var(--ink)); }
:root.dark .btn.primary { color: #13120f; }
.btn.danger { background: var(--accent); border-color: var(--accent); color: #fff8ef; }
.btn.danger:hover { background: color-mix(in srgb, var(--accent) 85%, #000); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--sel); }
.btn.sm { min-height: 26px; padding: 0 10px; font-size: .92em; }
.btn[disabled], .ibtn[disabled] { opacity: .45; pointer-events: none; }
.ibtn {
  display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--ink2);
  transition: background var(--t), color var(--t), transform .08s; flex: none; font-size: 15px;
}
.ibtn:hover { background: var(--sel); color: var(--ink); }
.ibtn:active { transform: scale(.94); }
.ibtn.on { color: var(--willow-deep); background: color-mix(in srgb, var(--willow) 16%, transparent); }
.ibtn.on { background: color-mix(in srgb, var(--willow) 22%, transparent); color: var(--willow-deep); }
.ibtn svg { width: 18px; height: 18px; }
@media (pointer: coarse) { .ibtn { width: 40px; height: 40px; } .btn { min-height: 40px; } }

/* ---------- 输入 ---------- */
.field {
  width: 100%; min-height: 34px; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r-sm);
  background: color-mix(in srgb, var(--paper3) 85%, #fff); color: var(--ink); transition: border-color var(--t), box-shadow var(--t);
}
:root.dark .field { background: color-mix(in srgb, var(--paper3) 80%, #000); }
.field:focus { outline: none; border-color: var(--willow); box-shadow: 0 0 0 3px color-mix(in srgb, var(--willow) 22%, transparent); }
textarea.field { resize: vertical; line-height: 1.6; }
select.field { appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--ink3) 50%), linear-gradient(135deg, var(--ink3) 50%, transparent 50%); background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
input[type=range] { appearance: none; height: 22px; background: transparent; width: 100%; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--willow) var(--p, 50%), var(--line) var(--p, 50%)); }
input[type=range]::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: var(--paper3); border: 2px solid var(--willow-deep); box-shadow: var(--shadow-sm); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--willow); }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--paper3); border: 2px solid var(--willow-deep); }
/* 开关：一枚小印 */
.switch { position: relative; width: 42px; height: 24px; flex: none; appearance: none; border-radius: 24px; background: color-mix(in srgb, var(--ink3) 45%, var(--line)); cursor: pointer; transition: background var(--t); margin: 0; }
.switch::after { content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--paper3); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform var(--t) var(--spring); }
.switch:checked { background: var(--willow-deep); }
.switch:checked::after { transform: translateX(18px); }
.seg { display: inline-flex; padding: 2px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--paper2) 70%, transparent); border: 1px solid var(--line); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 3px 12px; border-radius: calc(4px * var(--rk)); color: var(--ink2); min-height: 26px; transition: background var(--t), color var(--t); }
.seg button.on { background: var(--paper3); color: var(--ink); box-shadow: var(--shadow-sm); }
@media (pointer: coarse) { .seg button { min-height: 34px; } }

.kbd { display: inline-block; padding: 0 5px; min-width: 18px; text-align: center; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: calc(4px * var(--rk)); font: 11px/16px var(--font-mono); color: var(--ink3); }
.muted { color: var(--ink3); }
.spacer { flex: 1; }
.row { display: flex; align-items: center; gap: 8px; }
.hide { display: none !important; }
.spin { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--willow-deep); border-radius: 50%; animation: qs-spin .8s linear infinite; }
.seal-chip { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: calc(4px * var(--rk)); background: var(--accent); color: #fff6ea; font: 13px/1 var(--font-kai); }

/* 空状态：一行诗 + 一笔 */
.empty { display: grid; place-items: center; align-content: center; gap: 10px; padding: 40px 20px; color: var(--ink3); text-align: center; height: 100%; }
.empty .em-glyph { width: 64px; height: 64px; color: color-mix(in srgb, var(--ink3) 45%, transparent); }
.empty .em-poem { font: 15px/1.9 var(--font-kai); letter-spacing: .12em; }
.empty .em-acts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

/* ---------- 花字小件 ---------- */
.ink { display: inline-flex; align-items: center; justify-content: center; width: 1em; height: 1em; flex: none; font-family: var(--font-display); font-style: normal; line-height: 1; vertical-align: -0.12em; }
.inkw { font-family: var(--font-display); white-space: nowrap; }
.inked { font-family: var(--font-display); }
.tb-logo .lg { display: inline-flex; gap: 1px; font-size: 21px; }
.tb-sub { opacity: .75; font-size: .92em; }
.em-glyph { display: grid; place-items: center; font: 52px/1 var(--font-display); }
.em-glyph .ink { font-size: inherit; }
.sg-logo .ink { font-size: 42px; width: 46px; height: 46px; color: var(--ink); }
.win-title .tt .inkw { font-size: 17px; }
.tb-app .inkw { font-size: 16px; }
.fm-sh .inkw { font-size: 14px; opacity: .85; }
.sg-h .inkw { font-size: 1.15em; }
.cl-h .inkw { font-size: 1.1em; }
/* 各应用工具条同一副骨架：同高、同底、同线；放不下时先收说明字（autoCompact），再横向滑 */
.appbar { display: flex; align-items: center; gap: 3px; padding: 5px 8px; min-height: 44px; border-bottom: 1px solid color-mix(in srgb, var(--line) 65%, transparent); background: color-mix(in srgb, var(--paper3) 70%, var(--paper)); color: var(--ink); flex: none; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.appbar::-webkit-scrollbar { display: none; }
.appbar > * { flex-shrink: 0; }
.appbar .ibtn { font: 600 14px/1 var(--font-kai); }
.appbar .ed-sep { width: 1px; height: 20px; background: color-mix(in srgb, var(--line) 80%, transparent); margin: 0 4px; }
@media (pointer: coarse) { .appbar { min-height: 50px; } }
.inkbtn { width: auto !important; padding: 0 9px 0 7px !important; gap: 4px; display: inline-flex; align-items: center; }
.inkbtn .ink { font-size: 17px; }
.inkbtn .ib-l { font-size: 12.5px; font-weight: 400; letter-spacing: .04em; white-space: nowrap; }
.inkbtn.on { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.compact .inkbtn .ib-l { display: none; }
.appbar.wrapped { flex-wrap: wrap; row-gap: 4px; }
.appbar.wrapped .ed-sep { display: none; }
.appbar.wrapped .seg { flex-wrap: nowrap; }
.compact .inkbtn { padding: 0 7px !important; }
/* 工具条量宽时：冻结过渡、不许收缩、不折行 */
.appbar.measuring { flex-wrap: nowrap !important; }
.appbar.measuring, .appbar.measuring * { transition: none !important; }
.appbar.measuring > * { flex-shrink: 0 !important; }
/* ── 10-shell.css ── */
/* ================= 外壳：桌面 / 顶栏 / 程序坞 / 窗口 / 三卷轴 ================= */
#desk { position: fixed; inset: 0; overflow: hidden; }
#wp { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ---------- 顶栏 ---------- */
#topbar {
  position: fixed; z-index: 60; top: 0; left: 0; right: 0; height: calc(var(--bar-h) + var(--safe-t)); padding: var(--safe-t) calc(10px + var(--safe-r)) 0 calc(10px + var(--safe-l));
  display: flex; align-items: center; gap: 4px; background: var(--bar); color: var(--bar-ink); font-size: 13px; letter-spacing: .04em;
  box-shadow: 0 1px 0 rgba(255,255,255,.04), 0 2px 12px rgba(0,0,0,.18);
}
#topbar .tb { display: flex; align-items: center; gap: 6px; height: calc(var(--bar-h) - 8px); padding: 0 9px; border: 0; border-radius: calc(6px * var(--rk)); background: none; color: inherit; white-space: nowrap; transition: background var(--t); }
#topbar .tb:hover, #topbar .tb.open { background: rgba(255,255,255,.09); }
.tb-logo { gap: 1px !important; padding-left: 4px !important; }
.tb-logo svg { width: 19px; height: 19px; }
.tb-logo .os { font: 600 10px/1 var(--font-sans); color: var(--gold); margin-left: 4px; letter-spacing: .1em; }
.tb-app { font-weight: 600; max-width: 30vw; overflow: hidden; text-overflow: ellipsis; }
.tb-greet { opacity: .62; font-size: 12.5px; }
.tb-cores { gap: 5px !important; }
.tb-cores i { width: 7px; height: 7px; border-radius: 50%; background: #6a6358; box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset; transition: background .4s; }
.tb-cores i.ok { background: #8fb07a; box-shadow: 0 0 6px rgba(143,176,122,.6); }
.tb-cores i.warn { background: #d4a85a; }
.tb-cores i.off { background: #6a6358; opacity: .5; }
.tb-time { display: inline-flex; align-items: baseline; font-variant-numeric: tabular-nums; font-family: var(--font-sans); font-weight: 500; letter-spacing: 0; white-space: nowrap; contain: layout; }
.tb-time i { font-style: normal; display: inline-block; text-align: center; }
.tb-time .tc-d { width: .66em; }
.tb-time .tc-c { width: .34em; opacity: .8; }
.tb-time .tc-ap { margin-right: .4em; }
/* 顶栏各格不许被挤扁：放不下时让问候语先退场，而不是让谁忽隐忽现 */
#topbar > .tb, #topbar > .tb-greet { flex: none; }
#topbar > .tb-app { flex: 0 1 auto; min-width: 3em; }
#topbar > .tb-greet { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#topbar > .spacer { min-width: 0; }
.tb-sc { opacity: .78; }
.tb-sc b { color: var(--gold); font-weight: 400; }
#topbar svg.ic { width: 15px; height: 15px; }

/* ---------- 桌面图标 ---------- */
#icons {
  position: absolute; top: calc(var(--bar-h) + var(--safe-t) + 14px); left: calc(14px + var(--safe-l)); right: calc(14px + var(--safe-r)); bottom: calc(var(--dock-h) + 30px + var(--safe-b));
  touch-action: none; -webkit-user-select: none; user-select: none;
}
#wp { touch-action: none; }
.dicon { position: absolute; width: var(--cw, calc(var(--icon, 64px) + 30px)); transition: left .22s var(--ease), top .22s var(--ease), background var(--t); -webkit-touch-callout: none; }
.dicon.moving { transition: none; pointer-events: none; z-index: 5; opacity: .88; }
.dicon .dot-gold { position: absolute; right: -3px; top: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 2px var(--paper3); }
.dicon { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 3px 4px; border-radius: calc(10px * var(--rk)); border: 1px solid transparent; touch-action: none; }
.dicon:hover { background: color-mix(in srgb, var(--paper3) 35%, transparent); }
.dicon.sel { background: color-mix(in srgb, var(--willow) 26%, transparent); border-color: color-mix(in srgb, var(--willow) 45%, transparent); }
.dicon.drop { background: color-mix(in srgb, var(--gold) 30%, transparent); transform: scale(1.04); }
.dicon .lbl { max-width: 100%; padding: 0 4px; font-size: 12.5px; line-height: 1.35; text-align: center; color: var(--ink); text-shadow: 0 0 4px var(--paper), 0 0 8px var(--paper), 0 0 2px var(--paper); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all; }
:root.dark .dicon .lbl { text-shadow: 0 1px 3px #000, 0 0 8px #000; }

/* 印：应用图标 = 一方朱文/白文印 */
.seal {
  --c: var(--accent); position: relative; display: grid; place-items: center; width: var(--sz, 52px); height: var(--sz, 52px); flex: none; border-radius: calc(var(--sz, 52px) * .22 * var(--rk));
  background: radial-gradient(120% 90% at 30% 20%, color-mix(in srgb, var(--c) 82%, #fff) 0%, var(--c) 55%, color-mix(in srgb, var(--c) 75%, #000) 100%);
  color: #fbf3e4; font: calc(var(--sz, 52px) * .5) / 1 var(--font-kai); text-shadow: 0 1px 1px rgba(0,0,0,.25);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 -2px 6px rgba(0,0,0,.18), 0 2px 6px rgba(40,25,10,.22);
}
.seal::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle at 70% 80%, rgba(255,255,255,.08), transparent 40%), repeating-radial-gradient(circle at 20% 30%, transparent 0 3px, rgba(0,0,0,.025) 3px 4px); pointer-events: none; }
.seal.file { --c: var(--paper3); color: var(--ink2); text-shadow: none; background: linear-gradient(160deg, var(--paper3), color-mix(in srgb, var(--paper2) 80%, var(--paper3))); box-shadow: inset 0 0 0 1px var(--line), 0 2px 5px rgba(40,25,10,.14); }
.seal.file .k { position: absolute; right: 8%; bottom: 7%; font: 600 calc(var(--sz, 52px) * .15)/1 var(--font-sans); color: var(--k, var(--willow-deep)); letter-spacing: 0; text-transform: uppercase; }
.seal.thumb { background-size: cover !important; background-position: center !important; }

/* ---------- 程序坞 ---------- */
#dock {
  position: fixed; z-index: 55; left: 50%; bottom: calc(10px + var(--safe-b)); transform: translateX(-50%);
  display: flex; align-items: flex-end; gap: 6px; padding: 7px 9px; border-radius: calc(18px * var(--rk)); background: var(--dock);
  border: 1px solid rgba(255,255,255,.08); box-shadow: 0 10px 40px rgba(0,0,0,.28); transition: transform .35s var(--ease), opacity .35s;
}
#dock.left { left: calc(10px + var(--safe-l)); bottom: auto; top: 50%; transform: translateY(-50%); flex-direction: column; align-items: flex-start; }
#dock.hidden { transform: translate(-50%, calc(100% + 20px)); }
#dock.left.hidden { transform: translate(calc(-100% - 20px), -50%); }
.dock-item { position: relative; width: 48px; height: 48px; display: grid; place-items: center; border: 0; padding: 0; background: none; transform-origin: 50% 100%; transition: transform .18s var(--ease); }
#dock.left .dock-item { transform-origin: 0 50%; }
.dock-item .seal { --sz: 44px; transition: transform .25s var(--spring), filter .2s; }
.dock-item:active .seal { transform: scale(.92); filter: brightness(.92); }
.dock-item::after { content: ''; position: absolute; bottom: -5px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--bar-ink); opacity: 0; transition: opacity .2s, width .2s, margin .2s; }
.dock-item.run::after { opacity: .75; }
.dock-item.run.focus::after { width: 14px; margin-left: -7px; border-radius: calc(3px * var(--rk)); background: var(--gold); opacity: 1; }
#dock.left .dock-item::after { bottom: auto; left: -6px; top: 50%; margin: -2px 0 0; }
/* 收起的窗口：印上压一卷小轴 */
.dock-item .minroll { position: absolute; left: 50%; top: -7px; width: 30px; height: 8px; margin-left: -15px; border-radius: calc(4px * var(--rk)); background: linear-gradient(180deg, #7a5f46, #3a2b1f); box-shadow: 0 1px 2px rgba(0,0,0,.4); opacity: 0; transform: scaleX(.3); transition: opacity .25s, transform .35s var(--spring); }
.dock-item .minroll::before, .dock-item .minroll::after { content: ''; position: absolute; top: -1px; width: 4px; height: 10px; border-radius: 2px; background: var(--c, var(--gold)); }
.dock-item .minroll::before { left: -3px; } .dock-item .minroll::after { right: -3px; }
.dock-item.min .minroll { opacity: 1; transform: none; }
.dock-sep { width: 1px; height: 36px; margin: 0 3px 6px; background: rgba(255,255,255,.14); align-self: center; }
#dock.left .dock-sep { width: 36px; height: 1px; margin: 3px 6px; }
.dock-tip { position: fixed; z-index: 2000; padding: 3px 10px; border-radius: calc(6px * var(--rk)); background: var(--bar); color: var(--bar-ink); font-size: 12.5px; pointer-events: none; white-space: nowrap; box-shadow: var(--shadow-sm); animation: qs-fade-in .12s; }

/* ---------- 窗口 ---------- */
#wins { position: absolute; inset: 0; pointer-events: none; }
.win {
  position: absolute; display: flex; flex-direction: column; min-width: 280px; min-height: 180px; pointer-events: auto;
  background: var(--paper3); color: var(--ink); border-radius: var(--r); border: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
  box-shadow: var(--shadow); transition: box-shadow .25s;
}
.win:not(.focused) { box-shadow: var(--shadow-sm); }
.win.max { border-radius: 0; border-width: 0; }
.win.snapped { border-radius: 0; }
.win.anim { transition: left .3s var(--ease), top .3s var(--ease), width .3s var(--ease), height .3s var(--ease), border-radius .3s, box-shadow .25s; }
.win-title {
  position: relative; flex: none; height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; touch-action: none;
  background: linear-gradient(180deg, color-mix(in srgb, var(--paper3) 92%, #fff), var(--paper3)); border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
  border-radius: var(--r) var(--r) 0 0;
}
.win.max .win-title { border-radius: 0; }
.win-grab { display: none; position: absolute; left: 50%; top: 4px; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: color-mix(in srgb, var(--ink3) 45%, transparent); pointer-events: none; }
:root.dark .win { border-color: #2e2a24; background-image: radial-gradient(120% 60% at 50% 0%, rgba(212,168,90,.035), transparent 70%);
  box-shadow: 0 24px 64px rgba(0,0,0,.55), 0 0 0 1px rgba(212,168,90,.12), inset 0 1px 0 rgba(255,255,255,.04); }
:root.dark .win:not(.focused) { box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 0 1px rgba(212,168,90,.06); }
/* 夜里的标题栏：一段乌木，下缘一线泥金 */
:root.dark .win-title { background: linear-gradient(180deg, #0e0d0b, #161411); border-bottom-color: rgba(212,168,90,.26); }
:root.dark .win:not(.focused) .win-title { border-bottom-color: rgba(212,168,90,.1); }
:root.dark .win.focused .win-title .tt { color: color-mix(in srgb, var(--gold) 78%, var(--ink)); text-shadow: 0 1px 3px rgba(0,0,0,.5); }
.win-title .tt { min-width: 0; max-width: calc(50% - 90px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; letter-spacing: .05em; color: var(--ink2); transition: color var(--t); }
.win.focused .win-title .tt { color: var(--ink); }
.win-title .ta { margin-left: auto; display: flex; align-items: center; gap: 2px; min-width: 0; }
.win:not(.focused) .win-title .tt { opacity: .7; }
.win-body { position: relative; flex: 1; min-height: 0; overflow: hidden; border-radius: 0 0 var(--r) var(--r); display: flex; flex-direction: column; }
.win.max .win-body { border-radius: 0; }
.win .rz { position: absolute; z-index: 6; touch-action: none; }
.rz.n { top: -4px; left: 12px; right: 12px; height: 8px; cursor: ns-resize; } .rz.s { bottom: -4px; left: 12px; right: 12px; height: 8px; cursor: ns-resize; }
.rz.e { right: -4px; top: 12px; bottom: 12px; width: 8px; cursor: ew-resize; } .rz.w { left: -4px; top: 12px; bottom: 12px; width: 8px; cursor: ew-resize; }
.rz.ne { right: -5px; top: -5px; width: 16px; height: 16px; cursor: nesw-resize; } .rz.nw { left: -5px; top: -5px; width: 16px; height: 16px; cursor: nwse-resize; }
.rz.se { right: -5px; bottom: -5px; width: 18px; height: 18px; cursor: nwse-resize; } .rz.sw { left: -5px; bottom: -5px; width: 16px; height: 16px; cursor: nesw-resize; }
.win.max .rz, .win.mobile .rz { display: none; }
.win .shield { position: absolute; inset: 0; z-index: 4; display: none; }
.win.dragging .shield, .win.resizing .shield, body.dragging-win .win .shield { display: block; }
body.dragging-win, body.dragging-win * { cursor: grabbing !important; }

/* ---------- 三卷轴：收 · 开 · 合 ---------- */
.scrolls { position: absolute; left: 50%; top: 0; height: 100%; transform: translateX(-50%); display: flex; align-items: stretch; gap: 3px; z-index: 2; }
/* 每只卷子是一张逐像素画出的小画布（见 22c-scrollart.js）：按钮本身只是透明的托 */
.scroll { position: relative; flex: none; height: 100%; width: 18px; padding: 0; border: 0; background: none; outline: none; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: filter .25s; }
.scroll .sc-cv { position: absolute; left: 0; pointer-events: none; }
.scroll .sc-ink { position: absolute; display: flex; align-items: center; justify-content: flex-end; overflow: hidden; pointer-events: none; transition: opacity .2s; color: #1c1a17; }
.scroll .sc-ink[data-o=v] { flex-direction: column; justify-content: flex-end; }
.scroll .sc-ink[data-o=v] .sc-g { margin: 0 auto 0; }
.scroll .sc-g { flex: none; display: block; margin-right: 1px; }
.scroll .sc-g svg { width: 100%; height: 100%; display: block; }
.scroll[data-act=close] .sc-ink { color: #2a1210; }
:root.dark .scroll .sc-ink { color: #1a1612; }
.scroll:active .sc-cv { transform: translateY(.5px); }
.scroll:focus-visible { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--willow) 70%, transparent); border-radius: 6px; }
.win:not(.focused) .scroll { filter: saturate(.45) brightness(1.02) opacity(.78); }
/* 未保存：合轴上悬一滴墨 */
.win.dirty .scroll[data-act=close]::after { content: ''; position: absolute; top: 3px; right: -1px; width: 6px; height: 6px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--accent); animation: qs-ink-pulse 2.4s ease-in-out infinite; }
@media (pointer: coarse) { .scrolls { gap: 4px; } }

/* 卷轴动效层：窗口开合时出现的两根轴 */

#snap { position: absolute; z-index: 40; pointer-events: none; border-radius: calc(12px * var(--rk)); border: 2px solid color-mix(in srgb, var(--willow) 70%, transparent); background: color-mix(in srgb, var(--willow-mist) 22%, transparent); backdrop-filter: blur(2px); opacity: 0; transition: all .16s var(--ease); }
#snap.on { opacity: 1; }
.qs-band { position: absolute; z-index: 30; border: 1px solid var(--willow); background: color-mix(in srgb, var(--willow) 14%, transparent); border-radius: calc(3px * var(--rk)); pointer-events: none; }

/* ---------- 菜单 ---------- */
.menu { position: fixed; z-index: 1500; min-width: 210px; max-width: 320px; display: flex; flex-direction: column; font-size: 13.5px; }
/* 纸：宣纸色、帘纹、左右细边；天杆地杆夹住 */
.mpaper {
  position: relative; margin: 0 1px; padding: 5px; max-height: calc(100vh - 34px); overflow: auto; overscroll-behavior: contain;
  background: color-mix(in srgb, var(--paper3) 90%, transparent); backdrop-filter: blur(18px) saturate(1.25); -webkit-backdrop-filter: blur(18px) saturate(1.25);
  background-image: repeating-linear-gradient(90deg, color-mix(in srgb, var(--ink) 2.2%, transparent) 0 1px, transparent 1px 6px);
  border-left: 1px solid color-mix(in srgb, var(--line) 75%, transparent); border-right: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
  box-shadow: 0 14px 34px rgba(28,26,23,.2), 0 3px 8px rgba(28,26,23,.12);
}
:root.dark .mpaper { background-color: color-mix(in srgb, var(--paper3) 94%, transparent); box-shadow: 0 16px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(212,168,90,.1); }
.mrod { position: relative; z-index: 1; display: block; flex: none; border-radius: 3px; background: linear-gradient(180deg, #6a5e4c, #2a2620 55%, #14120f); box-shadow: 0 1px 2px rgba(0,0,0,.35); }
.mrod.top { height: 5px; margin: 0 -2px; }
.mrod.bot { height: 8px; margin: 0 2px; border-radius: 4px; }
/* 轴头：地杆两端各出一粒泥金 */
.mrod.bot::before, .mrod.bot::after { content: ''; position: absolute; top: -2px; width: 10px; height: 12px; border-radius: 4px; background: radial-gradient(circle at 40% 35%, #f0d79a, #b08a4a 55%, #6a4e22); box-shadow: 0 1px 2px rgba(0,0,0,.4); }
.mrod.bot::before { left: -9px; } .mrod.bot::after { right: -9px; }
:root.dark .mrod { background: linear-gradient(180deg, #3a342a, #0e0d0b 60%, #050504); }
/* 顶上一行字印：常用动作 */
.mquick { display: flex; gap: 2px; padding: 2px 0 6px; margin: 0 3px 4px; border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.mq { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px 4px; border: 0; background: none; color: var(--ink2); border-radius: calc(7px * var(--rk)); font-size: 11px; letter-spacing: .1em; cursor: default; }
.mq .g { width: 28px; height: 28px; display: grid; place-items: center; font: 16px/1 var(--font-ink); color: var(--ink); border: 1px solid color-mix(in srgb, var(--line) 90%, transparent); border-radius: calc(6px * var(--rk)); background: color-mix(in srgb, var(--paper) 50%, transparent); }
.mq .t { white-space: nowrap; }
.mq.hl, .mq:hover { background: color-mix(in srgb, var(--willow) 16%, transparent); color: var(--ink); }
.mq.hl .g, .mq:hover .g { border-color: var(--willow-deep); }
.mq.danger .g { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.mq.danger.hl .g, .mq.danger:hover .g { background: var(--accent); color: #fff; border-color: var(--accent); }
.mq.dis { opacity: .38; pointer-events: none; }
.mi.mback { color: var(--ink3); border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); border-radius: 0; margin-bottom: 3px; }
.menu.coarse .mi { min-height: 42px; font-size: 15px; } .menu.coarse .mk { display: none; } .menu.coarse .mq { padding: 8px 2px 6px; } .menu.coarse .mq .g { width: 34px; height: 34px; font-size: 18px; }
.mi { display: flex; align-items: center; gap: 10px; min-height: 30px; padding: 4px 10px; border-radius: calc(7px * var(--rk)); cursor: default; white-space: nowrap; }
.mi .mg { width: 18px; height: 18px; display: grid; place-items: center; color: var(--ink3); font: 14px/1 var(--font-kai); flex: none; }
/* 菜单左列：楷体单字（默认）/ 小朱印 / 无 */
:root[data-mg="seal"] .mi .mg:not(:empty) { width: 17px; height: 17px; font-size: 11.5px; background: var(--accent); color: var(--paper3); border-radius: calc(3px * var(--rk)); opacity: .9; }
:root[data-mg="seal"] .mi.hl .mg:not(:empty) { background: var(--paper3); color: var(--accent); opacity: 1; }
:root[data-mg="none"] .mi .mg { display: none; }
:root[data-mg="none"] .mi.on .mg { display: grid; }
.mi .ml { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.mi .mk { color: var(--ink3); font: 11.5px var(--font-sans); }
.mi.hl { background: var(--willow-deep); color: var(--paper3); }
.mi.hl .mg, .mi.hl .mk { color: inherit; opacity: .85; }
:root.dark .mi.hl { color: #14130f; }
.mi.danger { color: var(--accent); } .mi.danger.hl { background: var(--accent); color: #fff; }
.mi.dis { opacity: .42; pointer-events: none; }
.mi.on .mg::before { content: '✓'; color: var(--willow-deep); }
.mi.hl.on .mg::before { color: inherit; }
.mi .sub-arrow { color: var(--ink3); }
.msep { height: 1px; margin: 4px 8px; background: color-mix(in srgb, var(--line) 80%, transparent); }
.mhead { padding: 6px 10px 3px; font-size: 11.5px; color: var(--ink3); letter-spacing: .1em; }

/* ---------- 提示 ---------- */
#toasts { position: fixed; z-index: 1600; left: 50%; bottom: calc(var(--dock-h) + 34px + var(--safe-b)); transform: translateX(-50%); display: flex; flex-direction: column-reverse; align-items: center; gap: 8px; pointer-events: none; width: max-content; max-width: 92vw; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 9px 12px 9px 14px; border-radius: calc(12px * var(--rk)); background: color-mix(in srgb, var(--bar) 94%, transparent); color: var(--bar-ink); box-shadow: 0 10px 30px rgba(0,0,0,.25); font-size: 13.5px; animation: qs-rise .2s var(--ease); max-width: 100%; }
.toast.out { animation: qs-toast-out .2s forwards; }
@keyframes qs-toast-out { to { opacity: 0; transform: translateY(6px) scale(.97); } }
.toast .tg { width: 8px; height: 8px; border-radius: 50%; background: var(--willow-mist); flex: none; }
.toast.err .tg { background: var(--accent); } .toast.warn .tg { background: var(--gold); }
.toast .tt { font: 600 15px/1.2 var(--font-display); letter-spacing: .12em; white-space: nowrap; flex: none; }
.toast .tm { overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; opacity: .78; letter-spacing: .02em; }
.toast .tt + .tm { padding-left: 10px; border-left: 1px solid rgba(255,255,255,.16); }
.toast button { border: 0; background: rgba(255,255,255,.1); color: var(--gold); padding: 3px 10px; border-radius: calc(6px * var(--rk)); font-weight: 600; }
.toast button:hover { background: rgba(255,255,255,.18); }
.toast .tx { background: none; color: inherit; opacity: .5; padding: 0 4px; font-weight: 400; }
/* 进度卡 */
#jobs { position: fixed; z-index: 1550; right: calc(14px + var(--safe-r)); bottom: calc(var(--dock-h) + 30px + var(--safe-b)); display: flex; flex-direction: column; gap: 8px; width: min(320px, calc(100vw - 28px)); }
.job { padding: 11px 13px; border-radius: calc(12px * var(--rk)); background: var(--glass); backdrop-filter: blur(18px); border: 1px solid var(--line); box-shadow: var(--shadow); animation: qs-rise .2s var(--ease); font-size: 13px; }
.job .jt { display: flex; gap: 8px; align-items: center; } .job .jt b { font-weight: 600; flex: 1; }
.job .jl { color: var(--ink3); font-size: 12px; margin: 3px 0 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job .jb { height: 4px; border-radius: calc(4px * var(--rk)); background: var(--line); overflow: hidden; }
.job .jb i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--willow), var(--willow-deep)); transition: width .2s; }

/* ---------- 对话框：一幅立轴自上而下展开 ---------- */
.modal-bg { position: fixed; inset: 0; z-index: 1700; display: grid; place-items: center; padding: 20px; background: rgba(20,16,12,.3); animation: qs-fade-in .18s; }
:root.dark .modal-bg { background: rgba(0,0,0,.5); }
.modal-bg.out { animation: qs-toast-out .16s forwards; }
.hscroll { position: relative; width: min(var(--w, 440px), 100%); filter: drop-shadow(0 18px 40px rgba(30,20,10,.3)); }
.hscroll > .rodbar { position: relative; z-index: 2; height: 12px; margin: 0 -10px; border-radius: calc(6px * var(--rk)); background: linear-gradient(180deg, #2c2118, #7b604a 38%, #a3866a 50%, #4a382a 80%, #2c2118); }
.hscroll > .rodbar::before, .hscroll > .rodbar::after { content: ''; position: absolute; top: -3px; bottom: -3px; width: 12px; border-radius: calc(3px * var(--rk)); background: linear-gradient(180deg, #8a6a30, var(--gold) 45%, #6a4f22); }
.hscroll > .rodbar::before { left: -6px; } .hscroll > .rodbar::after { right: -6px; }
.hscroll.danger > .rodbar::before, .hscroll.danger > .rodbar::after { background: linear-gradient(180deg, #7a2a20, var(--accent) 45%, #6a2018); }
.hscroll > .sheet {
  position: relative; z-index: 1; overflow: hidden; max-height: calc(100vh - 80px); display: flex; flex-direction: column;
  background: linear-gradient(90deg, color-mix(in srgb, var(--paper2) 60%, var(--paper3)) 0 10px, var(--paper3) 10px calc(100% - 10px), color-mix(in srgb, var(--paper2) 60%, var(--paper3)) calc(100% - 10px));
}
.hscroll > .sheet::before { content: ''; position: absolute; inset: 8px 10px; border: 1px solid color-mix(in srgb, var(--line) 75%, transparent); pointer-events: none; }
.dlg { position: relative; padding: 22px 28px 18px; overflow: auto; }
.dlg-t { display: flex; align-items: center; gap: 10px; font-size: 18px; letter-spacing: .12em; margin-bottom: 8px; }
.dlg-m { color: var(--ink2); line-height: 1.75; word-break: break-word; }
.dlg-m b { color: var(--ink); }
.dlg-f { margin-top: 14px; display: grid; gap: 10px; }
.dlg-f label { display: grid; gap: 4px; font-size: 13px; color: var(--ink3); }
.dlg-b { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
.dlg-b .btn { min-width: 80px; }
.dlg-check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--ink2); }
.dlg-files { margin: 10px 0 0; padding: 8px 10px; max-height: 140px; overflow: auto; background: color-mix(in srgb, var(--paper2) 45%, transparent); border-radius: calc(6px * var(--rk)); font-size: 12.5px; color: var(--ink2); }

/* ---------- 寻：万物检索 ---------- */
.launcher { position: fixed; z-index: 1800; inset: 0; display: flex; justify-content: center; align-items: flex-start; padding: calc(var(--bar-h) + var(--safe-t) + 30px) 14px 14px; background: rgba(20,16,12,.22); animation: qs-fade-in .15s; }
.launcher .lbox { width: min(640px, 100%); background: var(--glass); backdrop-filter: blur(26px) saturate(1.35); -webkit-backdrop-filter: blur(26px) saturate(1.35); border: 1px solid var(--line); border-radius: calc(16px * var(--rk)); box-shadow: var(--shadow); overflow: hidden; animation: qs-rise .18s var(--ease); }
.launcher .lin { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.launcher .lin .seal { --sz: 30px; font-size: 16px; }
.launcher input { flex: 1; border: 0; background: none; outline: none; font-size: 19px; letter-spacing: .04em; min-width: 0; }
.launcher .lres { max-height: min(calc(100vh - var(--bar-h) - var(--safe-t) - 170px), 460px); min-height: 60px; overflow: auto; overscroll-behavior: contain; padding: 6px; }
.launcher .lsec { padding: 8px 12px 4px; font-size: 11.5px; color: var(--ink3); letter-spacing: .15em; }
.launcher .lit { display: flex; align-items: center; gap: 12px; padding: 7px 10px; border-radius: calc(9px * var(--rk)); cursor: default; }
.launcher .lit .seal { --sz: 30px; font-size: 15px; }
.launcher .lit .li-t { flex: 1; min-width: 0; } .launcher .lit .li-t div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.launcher .lit .li-s { font-size: 12px; color: var(--ink3); }
.launcher .lit.hl { background: color-mix(in srgb, var(--willow) 22%, transparent); }
.launcher .lit mark { background: none; color: var(--accent); }
.launcher .lfoot { display: flex; gap: 14px; padding: 7px 14px; font-size: 11.5px; color: var(--ink3); border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }

/* ---------- 弹出卡（时令 / 系统菜单） ---------- */
.pop { position: fixed; z-index: 1500; background: var(--glass); backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3); border: 1px solid var(--line); border-radius: calc(16px * var(--rk)); box-shadow: var(--shadow); animation: qs-rise .16s var(--ease); }
.shiling { width: 340px; padding: 16px 18px 18px; }
.shiling .sl-date { font-size: 20px; letter-spacing: .14em; }
.shiling .sl-sub { color: var(--ink3); font-size: 12.5px; margin-top: 2px; letter-spacing: .06em; }
.shiling svg.wheel { display: block; width: 100%; height: auto; margin: 10px 0 6px; }
.shiling .sl-poem { font-size: 14px; line-height: 1.9; color: var(--ink2); text-align: center; letter-spacing: .1em; }
.shiling .sl-poem small { display: block; color: var(--ink3); font-size: 11.5px; letter-spacing: .05em; }

/* ---------- 卷帘（锁屏） ---------- */
#lock { position: fixed; inset: 0; z-index: 3000; display: grid; place-items: center; overflow: hidden; color: #f4ecdc; cursor: pointer; }
#lock .slats { position: absolute; inset: 0; display: flex; flex-direction: column; }
#lock .slat { flex: 1; background: linear-gradient(180deg, color-mix(in srgb, var(--bar) 92%, #6b5a40) 0 82%, color-mix(in srgb, var(--bar) 70%, #000) 82% 100%); transform-origin: top; transition: transform .5s var(--ease-ink); opacity: .96; }
#lock .lk { position: relative; text-align: center; transition: opacity .3s; }
#lock .lk-time { font: 300 clamp(64px, 14vw, 128px)/1 var(--font-sans); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
#lock .lk-date { margin-top: 10px; font-size: 18px; letter-spacing: .3em; opacity: .85; }
#lock .lk-poem { margin-top: 34px; font: 17px/2 var(--font-kai); letter-spacing: .2em; opacity: .8; writing-mode: vertical-rl; height: 9em; display: inline-block; }
#lock .lk-hint { position: absolute; left: 0; right: 0; bottom: calc(40px + var(--safe-b)); text-align: center; font-size: 13px; letter-spacing: .3em; opacity: .55; animation: qs-ink-pulse 3s infinite; }
#lock.open .slat { transform: scaleY(0); }
#lock.open .lk { opacity: 0; }

/* ---------- 提示气泡 ---------- */
.tip { position: fixed; z-index: 2100; padding: 4px 9px; border-radius: calc(6px * var(--rk)); background: var(--bar); color: var(--bar-ink); font-size: 12px; line-height: 1.5; pointer-events: none; white-space: nowrap; box-shadow: var(--shadow-sm); animation: qs-fade-in .12s; }
.tip .kbd { border-color: rgba(255,255,255,.2); color: rgba(255,255,255,.65); margin-left: 6px; }

/* ---------- 手机 ---------- */
@media (max-width: 759px) {
  :root { --dock-h: 58px; }
  .tb-greet, .tb-jq, .tb-cores { display: none !important; }
  #dock { left: 8px; right: 8px; transform: none; justify-content: space-around; bottom: calc(6px + var(--safe-b)); padding: 6px; border-radius: calc(20px * var(--rk)); overflow-x: auto; }
  #dock.hidden { transform: translateY(calc(100% + 20px)); }
  #dock.left { left: 8px; top: auto; flex-direction: row; }
  .dock-sep { display: none; }
  #dock { gap: 2px; }
  #dock { justify-content: safe space-around; }
  .dock-item { width: auto; height: 46px; flex: 1 1 0; min-width: 28px; max-width: 52px; }
  .dock-item .seal { --sz: clamp(26px, calc((100vw - 40px) / max(8, var(--dn, 8)) - 5px), 44px); }
  .win.mobile { left: 0 !important; top: calc(var(--bar-h) + var(--safe-t)) !important; width: 100% !important; height: calc(100% - var(--bar-h) - var(--safe-t) - var(--dock-h) - 14px - var(--safe-b)) !important; border-radius: 0 0 calc(16px * var(--rk)) calc(16px * var(--rk)); border-width: 0; }
  .win.mobile .win-title { border-radius: 0; height: 46px; }
  .win.mobile .win-title { touch-action: none; }
  .win.mobile .win-title .tt { max-width: none; flex: 1; min-width: 0; }
  .win.mobile .scrolls { position: static; transform: none; flex: none; margin-left: auto; }
  .win.mobile .win-grab { display: block; }
  .win.mobile.pulling { box-shadow: 0 18px 50px rgba(0,0,0,.35); overflow: hidden; }
  #icons { left: calc(8px + var(--safe-l)); right: calc(8px + var(--safe-r)); }
  #toasts { bottom: calc(var(--dock-h) + 24px + var(--safe-b)); }
  .shiling { width: calc(100vw - 16px); }
}
.tb-sc { margin-right: 10px; }
.tb-sc .inkw > :first-child { color: var(--gold); }
.tb-sc .inkw, .tb-jq .inkw { font-size: 15px; }


/* ================= 写实水墨：纸、墨、木、瓷 =================
   肌理由 Tex（20-theme.js）当场画出：--tex-paper 宣纸纤维、--tex-wash 题头淡墨、--tex-stroke 飞白一线。 */
:root { --qs-hl: rgba(255,255,255,.55); --qs-sink: rgba(30,22,12,.3);
  --shadow: 0 0 0 .5px rgba(40,30,20,.12), 0 1px 1px rgba(40,30,20,.14), 0 4px 8px -1px rgba(40,30,20,.12), 0 16px 32px -8px rgba(40,30,20,.22), 0 40px 80px -24px rgba(40,30,20,.3);
  --shadow-sm: 0 0 0 .5px rgba(40,30,20,.1), 0 1px 2px rgba(40,30,20,.12), 0 6px 14px -4px rgba(40,30,20,.16); }
:root.dark { --qs-hl: rgba(255,255,255,.07); --qs-sink: rgba(0,0,0,.55); }

/* —— 窗：一张裱好的纸。边是墨线，题头一抹淡墨，下缘一笔飞白 —— */
.win { background-image: var(--tex-paper, none); border-color: color-mix(in srgb, var(--ink) 24%, var(--line)); }
.win-title {
  isolation: isolate; border-bottom-color: color-mix(in srgb, var(--line) 30%, transparent);
  background: var(--tex-paper, none), linear-gradient(180deg, color-mix(in srgb, var(--paper3) 90%, #fff), color-mix(in srgb, var(--paper3) 84%, var(--paper2)));
  box-shadow: inset 0 1px 0 var(--qs-hl);
}
:root.dark .win-title { background: var(--tex-paper, none), linear-gradient(180deg, #0f0e0c, #1a1713); border-bottom-color: rgba(212,168,90,.08); }
.win-title::before { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; border-radius: inherit; background: var(--tex-wash, none) center / 100% 100% no-repeat; opacity: .38; transition: opacity .45s var(--ease-ink); }
.win-title::after { content: ''; position: absolute; left: 0; right: 0; bottom: -2px; height: 6px; z-index: -1; pointer-events: none; background: var(--tex-stroke, none) center / 100% 100% no-repeat; opacity: .3; transition: opacity .45s var(--ease-ink); }
.win.focused .win-title::before { opacity: 1; }
.win.focused .win-title::after { opacity: .9; }
:root.dark .win.focused .win-title::after { opacity: .75; }
.win-title .tt { font-size: 15px; letter-spacing: .08em; }
.win.focused .win-title .tt { text-shadow: 0 0 .6px color-mix(in srgb, var(--ink) 55%, transparent); }

/* —— 卷轴动效：木轴有纹有光，压在纸上有影；素纸先展，墨后洇 —— */

/* —— 开关：砚槽里一颗瓷珠；拨过去，墨自左漫满，珠成朱砂 —— */
.switch { width: 44px; height: 24px; border-radius: 24px; background: linear-gradient(180deg, color-mix(in srgb, var(--ink) 32%, var(--paper2)), color-mix(in srgb, var(--ink) 13%, var(--paper2)));
  box-shadow: inset 0 2px 4px var(--qs-sink), inset 0 0 0 .5px rgba(0,0,0,.25), 0 1px 0 var(--qs-hl); transition: filter var(--t); }
.switch::before { content: ''; position: absolute; left: 2px; top: 2px; bottom: 2px; width: 20px; border-radius: 20px; opacity: 0;
  background: radial-gradient(130% 150% at 0% 50%, #0b0a09, color-mix(in srgb, var(--willow-deep) 62%, #0d0c0a) 58%, var(--willow-deep));
  box-shadow: inset 0 1px 2px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.08); transition: width .46s var(--ease-ink), opacity .22s; }
.switch:checked { background: linear-gradient(180deg, color-mix(in srgb, var(--ink) 32%, var(--paper2)), color-mix(in srgb, var(--ink) 13%, var(--paper2))); }
.switch:checked::before { width: calc(100% - 4px); opacity: 1; }
.switch::after { left: 3px; top: 3px; width: 18px; height: 18px; background: radial-gradient(circle at 34% 27%, #fff 0 9%, #f8f3e8 24%, #dcd2bd 62%, #a59a83 100%);
  box-shadow: 0 1px 2px rgba(0,0,0,.5), 0 3px 6px rgba(0,0,0,.2), inset 0 -1.5px 1.5px rgba(60,45,25,.25); transition: transform .4s var(--spring), background .3s .08s; }
.switch:checked::after { transform: translateX(20px); background: radial-gradient(circle at 34% 27%, #ffe6da 0 8%, color-mix(in srgb, var(--accent) 72%, #fff) 26%, var(--accent) 60%, color-mix(in srgb, var(--accent) 55%, #000) 100%); }
.switch:active::after { transform: scale(.88); } .switch:checked:active::after { transform: translateX(20px) scale(.88); }
.switch:hover { filter: brightness(1.04); }
.switch:focus-visible { outline: 2px solid color-mix(in srgb, var(--willow) 70%, transparent); outline-offset: 2px; }

/* —— 滑杆：一道墨槽，一颗瓷珠 —— */
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 6px; box-shadow: inset 0 1px 2px var(--qs-sink), 0 1px 0 var(--qs-hl);
  background: linear-gradient(90deg, transparent var(--p, 50%), color-mix(in srgb, var(--ink) 16%, var(--paper2)) var(--p, 50%)), linear-gradient(90deg, #14120f, var(--willow-deep)); }
input[type=range]::-webkit-slider-thumb { width: 18px; height: 18px; margin-top: -6px; border: 0; background: radial-gradient(circle at 34% 27%, #fff 0 9%, #f8f3e8 24%, #dcd2bd 62%, #a59a83 100%);
  box-shadow: 0 1px 2px rgba(0,0,0,.5), 0 3px 6px rgba(0,0,0,.2), inset 0 -1.5px 1.5px rgba(60,45,25,.25); transition: transform .15s var(--spring); }
input[type=range]:active::-webkit-slider-thumb { transform: scale(1.14); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 6px; background: color-mix(in srgb, var(--ink) 16%, var(--paper2)); box-shadow: inset 0 1px 2px var(--qs-sink); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 6px; background: linear-gradient(90deg, #14120f, var(--willow-deep)); }
input[type=range]::-moz-range-thumb { width: 17px; height: 17px; border: 0; background: radial-gradient(circle at 34% 27%, #fff 0 9%, #f8f3e8 24%, #dcd2bd 62%, #a59a83 100%); box-shadow: 0 1px 2px rgba(0,0,0,.5); }

/* —— 按钮：一枚纸签，按下去陷进纸里；主钮是一方墨 —— */
.btn { background: linear-gradient(180deg, color-mix(in srgb, var(--paper3) 94%, #fff), color-mix(in srgb, var(--paper3) 84%, var(--paper2))); border-color: color-mix(in srgb, var(--ink) 20%, var(--line));
  box-shadow: inset 0 1px 0 var(--qs-hl), 0 1px 1.5px rgba(40,30,20,.16); }
.btn:hover { background: linear-gradient(180deg, color-mix(in srgb, var(--paper3) 88%, var(--willow-mist)), color-mix(in srgb, var(--paper3) 66%, var(--willow-mist))); border-color: color-mix(in srgb, var(--ink) 34%, var(--line)); }
.btn:active { transform: translateY(1px); box-shadow: inset 0 1px 3px var(--qs-sink); }
.btn.primary { background: radial-gradient(150% 130% at 18% 0%, color-mix(in srgb, var(--willow-deep) 86%, #fff), var(--willow-deep) 52%, color-mix(in srgb, var(--willow-deep) 76%, #000)); border-color: color-mix(in srgb, var(--willow-deep) 68%, #000);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 1px 2px rgba(20,15,10,.32); text-shadow: 0 1px 1px rgba(0,0,0,.28); }
.btn.primary:hover { background: radial-gradient(150% 130% at 18% 0%, color-mix(in srgb, var(--willow-deep) 78%, #fff), color-mix(in srgb, var(--willow-deep) 92%, var(--ink)) 52%, color-mix(in srgb, var(--willow-deep) 70%, #000)); border-color: color-mix(in srgb, var(--willow-deep) 60%, #000); }
.btn.danger { background: radial-gradient(150% 130% at 18% 0%, color-mix(in srgb, var(--accent) 84%, #fff), var(--accent) 52%, color-mix(in srgb, var(--accent) 76%, #000)); border-color: color-mix(in srgb, var(--accent) 68%, #000); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 1px 2px rgba(20,15,10,.32); text-shadow: 0 1px 1px rgba(0,0,0,.25); }
.btn.danger:hover { background: radial-gradient(150% 130% at 18% 0%, color-mix(in srgb, var(--accent) 78%, #fff), color-mix(in srgb, var(--accent) 90%, #000) 52%, color-mix(in srgb, var(--accent) 68%, #000)); }
.btn.primary:active, .btn.danger:active { box-shadow: inset 0 2px 4px rgba(0,0,0,.4); }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; }
.btn.ghost:hover { background: var(--sel); border-color: transparent; }
.ibtn:active { box-shadow: inset 0 1px 3px var(--qs-sink); }
.field { box-shadow: inset 0 1px 2.5px color-mix(in srgb, var(--qs-sink) 55%, transparent); border-color: color-mix(in srgb, var(--ink) 16%, var(--line)); }
.field:focus { box-shadow: inset 0 1px 2.5px color-mix(in srgb, var(--qs-sink) 55%, transparent), 0 0 0 3px color-mix(in srgb, var(--willow) 22%, transparent); }
.seg { box-shadow: inset 0 1px 2.5px color-mix(in srgb, var(--qs-sink) 60%, transparent), 0 1px 0 var(--qs-hl); border-color: color-mix(in srgb, var(--ink) 14%, var(--line)); }
.seg button.on { background: linear-gradient(180deg, color-mix(in srgb, var(--paper3) 94%, #fff), color-mix(in srgb, var(--paper3) 88%, var(--paper2))); box-shadow: inset 0 1px 0 var(--qs-hl), 0 1px 2px rgba(40,30,20,.22), 0 0 0 .5px rgba(40,30,20,.14); }

/* —— 天栏如砚、坞如漆盘、单与轴都是同一张纸 —— */
#topbar { background-image: linear-gradient(180deg, rgba(255,255,255,.055), transparent 45%, rgba(0,0,0,.2)); box-shadow: inset 0 -1px 0 color-mix(in srgb, var(--gold) 26%, transparent), 0 2px 12px rgba(0,0,0,.22); }
#dock { background-image: linear-gradient(180deg, rgba(255,255,255,.085), transparent 34%, rgba(0,0,0,.22)); border-color: rgba(255,255,255,.09);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.1), inset 0 -2px 3px rgba(0,0,0,.35), 0 2px 3px rgba(0,0,0,.3), 0 14px 40px -6px rgba(0,0,0,.42); }
.mpaper { background-image: var(--tex-paper, none), repeating-linear-gradient(90deg, color-mix(in srgb, var(--ink) 2.2%, transparent) 0 1px, transparent 1px 6px); }
.hscroll > .sheet::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: var(--tex-paper, none); }
.appbar { background-image: var(--tex-paper, none); }

@keyframes qs-range-in { from { outline-color: transparent; } to { outline-color: transparent; } }
input[type=range] { animation: qs-range-in .01s; }

/* ================= 卷轴（重做）=================
   窗是手卷、对话框是立轴、菜单是小条幅——开合收放都是「卷」。
   轴是圆的：迎光一侧有高光，背光有暗部，边上有反光；木头有丝；卷在轴上的纸有绫边，越卷越粗；两头出轴头；压在纸上有影。 */
:root {
  --zwood: #70492f; --zroll: #ece3cf; --zsilk: #8a8f70; --zcord: #94402f;
  --zst: rgba(0,0,0,.6) 0%, rgba(0,0,0,.24) 9%, rgba(255,255,255,.04) 21%, rgba(255,255,255,.52) 32%, rgba(255,255,255,.12) 45%, rgba(0,0,0,.14) 62%, rgba(0,0,0,.45) 84%, rgba(0,0,0,.3) 94%, rgba(0,0,0,.64) 100%;
  --zstp: rgba(0,0,0,.44) 0%, rgba(0,0,0,.17) 10%, rgba(255,255,255,0) 26%, rgba(255,255,255,.24) 38%, rgba(255,255,255,.06) 52%, rgba(0,0,0,.09) 66%, rgba(0,0,0,.3) 86%, rgba(0,0,0,.22) 95%, rgba(0,0,0,.46) 100%;
  --zspec: radial-gradient(55% 45% at 34% 30%, rgba(255,255,255,.72), rgba(255,255,255,0) 72%);
}
:root.dark { --zwood: #553823; --zroll: #a0977f; --zsilk: #5b624e; }
.rollfx { position: absolute; z-index: 9; pointer-events: none; }
.zhou { position: absolute; left: 0; top: 0; width: 0; height: 100%; --T: 20px; --cyl: linear-gradient(90deg, var(--zst)); --cylp: linear-gradient(90deg, var(--zstp)); --gr: var(--tex-grv, none); --a: 90deg; --b: 180deg; }
.zhou.h { width: 100%; height: 0; --cyl: linear-gradient(180deg, var(--zst)); --cylp: linear-gradient(180deg, var(--zstp)); --gr: var(--tex-grh, none); --a: 180deg; --b: 90deg; }
.zhou > i { position: absolute; display: block; }
/* 木轴：比纸长，两头露一截 */
.zhou > .zx { left: -4px; width: 8px; top: -10px; bottom: -10px; border-radius: 3px; background: var(--cyl), var(--gr) 0 0 / 12px 80px, linear-gradient(var(--zwood), var(--zwood)); }
.zhou.h > .zx { left: -10px; right: -10px; width: auto; top: -4px; bottom: auto; height: 8px; background-size: auto, 80px 12px, auto; }
/* 卷在轴上的纸：两端一道绫边，纸口一线 */
.zhou > .zp { left: calc(var(--T) / -2); width: var(--T); top: 0; bottom: 0; border-radius: 1.5px;
  background: var(--cylp),
    linear-gradient(var(--b), var(--zsilk) 0 7px, rgba(40,30,15,.4) 7px 8px, transparent 8px calc(100% - 8px), rgba(40,30,15,.4) calc(100% - 8px) calc(100% - 7px), var(--zsilk) calc(100% - 7px)),
    linear-gradient(var(--a), transparent 0 71%, rgba(60,42,20,.16) 71% calc(71% + 1px), transparent calc(71% + 1px)),
    var(--tex-paper, none), linear-gradient(var(--zroll), var(--zroll));
  box-shadow: 3px 5px 10px rgba(24,14,4,.38), 0 0 0 .5px rgba(40,28,12,.45); }
.zhou.h > .zp { left: 0; right: 0; width: auto; top: calc(var(--T) / -2); bottom: auto; height: var(--T); box-shadow: 0 6px 11px rgba(24,14,4,.4), 0 0 0 .5px rgba(40,28,12,.45); }
/* 卷压在展开的纸上的影 */
.zhou.l > .zs { left: 0; width: 30px; top: 0; bottom: 0; background: linear-gradient(90deg, rgba(24,14,4,.44), rgba(24,14,4,.15) 38%, transparent); }
.zhou.r > .zs { right: 0; width: 26px; top: 0; bottom: 0; background: linear-gradient(270deg, rgba(24,14,4,.28), rgba(24,14,4,.09) 38%, transparent); }
.zhou.h.u > .zs { left: 0; right: 0; bottom: 0; height: 24px; background: linear-gradient(0deg, rgba(24,14,4,.26), rgba(24,14,4,.08) 40%, transparent); }
/* 轴头：一粒旋出来的钮，根上一道铜箍 */
.zhou > .zk { left: -6.5px; width: 13px; height: 12px; background: var(--zspec), var(--cyl), linear-gradient(var(--c, var(--gold)), var(--c, var(--gold))); box-shadow: 0 0 0 .5px rgba(20,10,0,.5), 2px 3px 4px rgba(20,10,0,.35); }
.zhou > .zk::after { content: ''; position: absolute; left: 2px; right: 2px; height: 3px; background: var(--cyl), linear-gradient(#cfa85c, #cfa85c); box-shadow: 0 0 0 .5px rgba(20,10,0,.45); }
.zhou > .zk.a { top: -21px; border-radius: 6.5px 6.5px 3px 3px / 7px 7px 2px 2px; } .zhou > .zk.a::after { bottom: -3px; }
.zhou > .zk.b { bottom: -21px; border-radius: 3px 3px 6.5px 6.5px / 2px 2px 7px 7px; } .zhou > .zk.b::after { top: -3px; }
.zhou.h > .zk { left: auto; top: -6.5px; bottom: auto; width: 12px; height: 13px; }
.zhou.h > .zk::after { left: auto; right: auto; top: 2px; bottom: 2px; width: 3px; height: auto; }
.zhou.h > .zk.a { left: -21px; border-radius: 7px 2px 2px 7px / 6.5px 3px 3px 6.5px; } .zhou.h > .zk.a::after { right: -3px; }
.zhou.h > .zk.b { right: -21px; border-radius: 2px 7px 7px 2px / 3px 6.5px 6.5px 3px; } .zhou.h > .zk.b::after { left: -3px; }

/* 菜单：小条幅。天杆细，地杆粗、两头出轴头 */
.mrod, :root.dark .mrod { background: linear-gradient(180deg, var(--zst)), var(--tex-grh, none) 0 0 / 80px 12px, linear-gradient(var(--zwood), var(--zwood)); box-shadow: 0 2px 4px rgba(20,12,4,.4); }
.mrod.top { height: 6px; margin: 0 -3px; border-radius: 3px 3px 1.5px 1.5px; }
.mrod.bot { height: 10px; margin: 0 2px; border-radius: 2px; }
.mrod.bot::before, .mrod.bot::after { top: -1.5px; width: 11px; height: 13px; background: var(--zspec), linear-gradient(180deg, var(--zst)), linear-gradient(#c9a257, #c9a257); box-shadow: 0 0 0 .5px rgba(20,10,0,.5), 1px 2px 3px rgba(20,10,0,.4); }
.mrod.bot::before { left: -10px; border-radius: 6px 2px 2px 6px / 6.5px 3px 3px 6.5px; } .mrod.bot::after { right: -10px; border-radius: 2px 6px 6px 2px / 3px 6.5px 6.5px 3px; }

/* 对话框：立轴。上面是天杆（细、无轴头），下面是地杆（粗、两头出轴头）；展开时地杆上还卷着纸 */
.hscroll > .rodbar { height: 9px; margin: 0 -6px; border-radius: 4.5px 4.5px 2px 2px; background: linear-gradient(180deg, var(--zst)), var(--tex-grh, none) 0 0 / 80px 12px, linear-gradient(var(--zwood), var(--zwood)); box-shadow: 0 2px 4px rgba(20,12,4,.35); }
.hscroll > .rodbar::before, .hscroll > .rodbar::after { display: none; }
.hscroll > .rodbar.bottom { height: 15px; margin: 0 -4px; border-radius: 3px; box-shadow: 0 5px 9px rgba(20,12,4,.4); }
.hscroll > .rodbar.bottom::before, .hscroll > .rodbar.bottom::after { display: block; top: -2px; bottom: -2px; width: 15px; background: var(--zspec), linear-gradient(180deg, var(--zst)), linear-gradient(var(--gold), var(--gold)); box-shadow: 0 0 0 .5px rgba(20,10,0,.5), 1px 3px 4px rgba(20,10,0,.4); }
.hscroll > .rodbar.bottom::before { left: -14px; border-radius: 8px 2px 2px 8px / 9.5px 3px 3px 9.5px; } .hscroll > .rodbar.bottom::after { right: -14px; border-radius: 2px 8px 8px 2px / 3px 9.5px 9.5px 3px; }
.hscroll.danger > .rodbar.bottom::before, .hscroll.danger > .rodbar.bottom::after { background: var(--zspec), linear-gradient(180deg, var(--zst)), linear-gradient(var(--accent), var(--accent)); }
.hscroll > .rodbar > .zp { position: absolute; inset: -4px 5px; border-radius: 2px; opacity: 0; pointer-events: none;

/* 挂载 */
.fm-si .fm-mlost, .fm-si .fm-mro { margin-left: auto; font-size: 10.5px; padding: 1px 6px; border-radius: calc(8px * var(--rk)); white-space: nowrap; }
.fm-si .fm-mlost { color: #fff; background: var(--accent); }
.fm-si .fm-mro { color: var(--ink3); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 18%, transparent); }
.fm-si.fm-madd { color: var(--ink3); font-size: 12.5px; }
.fm-si.fm-madd .fm-sg { opacity: .8; }
.fm-si.fm-madd:hover { color: var(--jade, var(--willow-deep)); }
.fm-mbar { display: flex; align-items: center; gap: 10px; padding: 7px 14px; font-size: 12.5px; color: var(--ink2); background: linear-gradient(90deg, color-mix(in srgb, var(--gold) 16%, transparent), transparent 80%); border-bottom: 1px solid color-mix(in srgb, var(--gold) 26%, transparent); }
.fm-mbar .fm-mb-t { flex: 1; min-width: 0; line-height: 1.5; }
.em-glyph.breath { animation: qsBreath 2.4s ease-in-out infinite; }
@keyframes qsBreath { 50% { opacity: .45; transform: scale(.96); } }
.fm-si > span:not(.fm-sg):not(.fm-mlost):not(.fm-mro) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fm-mbar .ink { font-size: 20px; color: var(--gold); flex-shrink: 0; }
/* 窄处：搜索框只是变窄，位置与宽度都不随焦点改变（旧法点一下搜索框，路径就隐去、搜索框跳到别处，
   键盘一收又跳回来——触屏上「什么也点不到」的根源之一）。再窄就折两行：上排按钮与搜索，下排整行路径。 */
.fm-search { min-width: 0; flex: 0 1 150px; }
.fm-bar.compact .fm-search { flex: 0 1 112px; width: 112px; }
.fm-bar.wrapped .fm-crumbs { order: 9; flex: 1 1 100%; margin: 0; }
.fm-bar.wrapped .fm-search { flex: 1 1 96px; width: auto; max-width: 260px; margin-left: auto; }
.fm-ghost.dragimg { top: -400px; left: 0; z-index: -1; max-width: 260px; backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--paper3); pointer-events: none; }
:root.qs-dragout .fm-main [data-drop], :root.qs-dragout .dicon { transition: none; }


/* ================= 书架（写实）：木书格里立着线装书，书脊朝外；文件夹是蓝布函套 =================
   书脊 = 一叠纸页的切口 + 两侧封皮的边 + 上下包角 + 四道订线 + 一枚题签。木格由 Tex 画出（--tex-shelf）。 */
.v-shelf { background: #3d2c1d; }
:root.dark .v-shelf { background: #120d09; }
.fm-shelf { --pg1: #f0e6cd; --pg2: #e0d2b2; --th: #f6f0df;
  background: linear-gradient(90deg, rgba(0,0,0,.55), rgba(0,0,0,.14) 14px, transparent 36px, transparent calc(100% - 36px), rgba(0,0,0,.14) calc(100% - 14px), rgba(0,0,0,.55)),
              var(--tex-shelf, linear-gradient(#674b33, #674b33)) 0 0 / 512px var(--row) repeat; }
:root.dark .fm-shelf { --pg1: #b4a88b; --pg2: #988c70; --th: #cfc7b2; }
.fm-spine { border-radius: 1.5px 1.5px 0 0;
  background:
    linear-gradient(90deg, rgba(0,0,0,.5) 0, rgba(0,0,0,.14) 7%, rgba(255,255,255,.2) 24%, rgba(255,255,255,0) 50%, rgba(0,0,0,.12) 82%, rgba(0,0,0,.5) 100%),
    linear-gradient(180deg, rgba(255,255,255,.22), transparent 3px, transparent calc(100% - 14px), rgba(0,0,0,.34)),
    linear-gradient(90deg, var(--c1) 0 3.5px, transparent 3.5px calc(100% - 3.5px), var(--c1) calc(100% - 3.5px)),
    linear-gradient(180deg, rgba(0,0,0,.4), var(--th) 40%, rgba(0,0,0,.25)) 0 39% / 100% 1.7px no-repeat,
    linear-gradient(180deg, rgba(0,0,0,.4), var(--th) 40%, rgba(0,0,0,.25)) 0 61% / 100% 1.7px no-repeat,
    repeating-linear-gradient(90deg, rgba(90,70,40,.24) 0 .5px, transparent .5px 2px),
    linear-gradient(180deg, var(--pg1), var(--pg2));
  box-shadow: 5px 0 7px -3px rgba(0,0,0,.6), -1px 0 2px -1px rgba(0,0,0,.4), 0 -1px 0 rgba(255,255,255,.1); }
.fm-spine::before, .fm-spine::after { content: ''; position: absolute; left: 0; right: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(90deg, rgba(0,0,0,.5), rgba(255,255,255,.18) 26%, transparent 55%, rgba(0,0,0,.5)), var(--tex-cloth, none) 0 0 / 48px 48px, linear-gradient(var(--c2), var(--c1)); }
.fm-spine::before { top: 0; height: 11px; box-shadow: 0 1px 1.5px rgba(0,0,0,.35); }
.fm-spine::after { bottom: 0; height: 20px; box-shadow: 0 -1px 1.5px rgba(0,0,0,.35); }
.fm-spine .band { z-index: 2; height: 1.7px; background: linear-gradient(180deg, rgba(0,0,0,.4), var(--th) 40%, rgba(0,0,0,.25)); box-shadow: 0 .8px 1px rgba(0,0,0,.4); }
.fm-spine .band.t { top: 18%; } .fm-spine .band.b { top: 82%; bottom: auto; }
.fm-slip { position: relative; z-index: 3; margin-top: 24px; max-height: calc(100% - 62px); border: 0; outline: 1px solid rgba(70,50,25,.3); outline-offset: -2.5px;
  background: var(--tex-paper, none), linear-gradient(90deg, #efe5cd, #fbf6e6 45%, #e9ddc2); box-shadow: 0 0 0 .5px rgba(60,40,20,.55), 1px 1.5px 2.5px rgba(0,0,0,.4); }
.fm-slip span { color: #241d15; text-shadow: 0 0 .6px rgba(36,29,21,.6); }
.fm-ext { z-index: 2; color: rgba(255,244,222,.82); text-shadow: 0 1px 1px rgba(0,0,0,.5); }
.fm-bthumb { opacity: .2; z-index: 0; }
.fm-book:hover .fm-spine { transform: translateY(-9px); box-shadow: 5px 0 7px -3px rgba(0,0,0,.6), 0 12px 12px -6px rgba(0,0,0,.55), 0 -1px 0 rgba(255,255,255,.1); }
.fm-book.sel .fm-spine { transform: translateY(-13px); box-shadow: 0 0 0 1.5px var(--gold), 0 0 12px color-mix(in srgb, var(--gold) 55%, transparent), 0 16px 14px -6px rgba(0,0,0,.6); }
.fm-book.drop .fm-spine { box-shadow: 0 0 0 2.5px var(--gold), 0 0 16px color-mix(in srgb, var(--gold) 60%, transparent); }
:root.dark .fm-spine { filter: brightness(.86); }
/* 函套：靛蓝布面，一道掩口缝，两枚骨别子，题签贴在正中 */
.fm-book.case .fm-spine { border-radius: 1px;
  background:
    linear-gradient(90deg, rgba(0,0,0,.52) 0, rgba(0,0,0,.12) 6%, rgba(255,255,255,.14) 22%, transparent 50%, rgba(0,0,0,.14) 84%, rgba(0,0,0,.52)),
    linear-gradient(180deg, rgba(255,255,255,.22), transparent 3px, transparent calc(100% - 12px), rgba(0,0,0,.4)),
    var(--tex-cloth, none) 0 0 / 48px 48px,
    linear-gradient(180deg, #34496b, #24344f); }
.fm-book.case .fm-spine::before { inset: 0 auto 0 80%; width: 2px; height: auto; background: linear-gradient(90deg, rgba(0,0,0,.55), rgba(255,255,255,.16)); box-shadow: none; }
.fm-book.case .fm-spine::after { left: 80%; top: 27%; bottom: auto; width: 5px; height: 15px; margin: 0 0 0 -1.5px; border-radius: 2.5px; z-index: 2;
  background: linear-gradient(90deg, #a2967e, #fcf7ec 40%, #dcd2bb 75%, #8a806c); box-shadow: 0 1px 2px rgba(0,0,0,.6), 0 52px 0 0 #e6decb, 0 53px 2px rgba(0,0,0,.6); }
.fm-book.case .band { display: none; }
.fm-book.case .fm-slip { margin-top: 15px; }

/* ================= 长卷（写实）：案上铺毡，展开一卷手卷——上下绫边、泥金隔界、两头卷着、朱丝栏分段 ================= */
.v-juan { padding: 20px 0 22px; background: var(--tex-cloth, none) 0 0 / 48px 48px, radial-gradient(120% 100% at 50% 0%, #5d5c50, #3b3b33 75%); }
:root.dark .v-juan { background: var(--tex-cloth, none) 0 0 / 48px 48px, radial-gradient(120% 100% at 50% 0%, #1f1f1a, #0e0e0b 75%); }
.fm-juan { --silk: color-mix(in srgb, var(--willow) 48%, #b7b097); padding: 30px 0; min-height: 220px; box-shadow: 0 2px 3px rgba(0,0,0,.4), 0 16px 28px -8px rgba(0,0,0,.6);
  background: linear-gradient(180deg, rgba(0,0,0,.1), transparent 4px, transparent calc(100% - 4px), rgba(0,0,0,.14)), var(--tex-paper, none),
              linear-gradient(180deg, color-mix(in srgb, var(--paper3) 93%, #fff), var(--paper3) 50%, color-mix(in srgb, var(--paper3) 92%, var(--paper2))); }
:root.dark .fm-juan { --silk: color-mix(in srgb, var(--willow) 40%, #3a3a30); background: linear-gradient(180deg, rgba(0,0,0,.2), transparent 4px, transparent calc(100% - 4px), rgba(0,0,0,.24)), var(--tex-paper, none), linear-gradient(180deg, #2a251d, #231f18); }
.fm-juan::before, .fm-juan::after { content: ''; position: absolute; left: 0; right: 0; height: 21px; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,.14), transparent 35%, rgba(0,0,0,.16)), var(--tex-cloth, none) 0 0 / 48px 48px, linear-gradient(var(--silk), var(--silk)); }
.fm-juan::before { top: 0; box-shadow: 0 1px 0 color-mix(in srgb, var(--gold) 70%, #4a3a1c), 0 2px 4px rgba(0,0,0,.14); }
.fm-juan::after { bottom: 0; box-shadow: 0 -1px 0 color-mix(in srgb, var(--gold) 70%, #4a3a1c), 0 -2px 4px rgba(0,0,0,.1); }
.fm-jend { width: 30px; margin: -30px 0; z-index: 2; border-radius: 2px;
  background: linear-gradient(90deg, rgba(0,0,0,.6), rgba(0,0,0,.12) 18%, rgba(255,255,255,.36) 38%, rgba(255,255,255,.04) 56%, rgba(0,0,0,.32) 82%, rgba(0,0,0,.66)),
              var(--tex-cloth, none) 0 0 / 48px 48px, linear-gradient(var(--silk), var(--silk));
  box-shadow: -18px 0 24px -9px rgba(0,0,0,.5), 16px 0 22px -9px rgba(0,0,0,.45), 0 3px 6px rgba(0,0,0,.45); }
.fm-jend::before, .fm-jend::after { left: 6px; right: 6px; height: 15px; border-radius: 3px;
  background: linear-gradient(90deg, #140b07, #5c3625 22%, #a87656 40%, #6e4332 56%, #2a1710 86%, #0f0805); box-shadow: 0 2px 3px rgba(0,0,0,.5), inset 0 0 0 .5px rgba(0,0,0,.5); }
.fm-jend::before { top: -13px; } .fm-jend::after { bottom: -13px; }
.fm-jend.r { margin-left: 20px; } .fm-jend.l { margin-right: auto; width: 22px; }
.fm-jseg { border-left: 0; position: relative; }
.fm-jseg::after { content: ''; position: absolute; left: 0; top: 34px; bottom: 34px; width: 1px; pointer-events: none;
  background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--accent) 42%, transparent) 9%, color-mix(in srgb, var(--accent) 42%, transparent) 91%, transparent); }
.fm-juan .fm-jseg:last-of-type::after { display: none; }
.fm-jtitle span { background: none; border: 0; font-size: 19px; padding: 8px 4px; text-shadow: 0 0 .7px color-mix(in srgb, var(--ink) 60%, transparent); }
.fm-jimg { border: 4px solid #f7f1e2; outline: 1px solid rgba(60,45,25,.3); box-shadow: 0 1px 2px rgba(0,0,0,.25), 0 8px 12px -5px rgba(0,0,0,.4); }
/* ── 31-moyan.css ── */
/* ================= 墨砚 ================= */
.ed { --ed-font: var(--font-song); --ed-size: 17px; --ed-lh: 1.85; display: flex; flex-direction: column; height: 100%; min-height: 0; }
.ed-bar { gap: 2px; }
.ed-bar::-webkit-scrollbar { display: none; }
.ed-bar .ibtn { font: 600 14px/1 var(--font-kai); min-width: 30px; }
.ed-bar .ibtn.dim { opacity: .45; }
.ed-sep { width: 1px; height: 18px; background: var(--line); margin: 0 6px; flex: none; }
.ed-fonts button { padding: 3px 9px; font-size: 13px; }
.ed-size { min-width: 22px; text-align: center; font: 12px var(--font-sans); color: var(--ink2); font-variant-numeric: tabular-nums; }
.ed-find { display: flex; align-items: center; gap: 5px; padding: 6px 10px; flex-wrap: wrap; border-bottom: 1px solid color-mix(in srgb, var(--line) 65%, transparent); background: color-mix(in srgb, var(--paper2) 30%, var(--paper3)); animation: qs-fade-in .15s; }
.ed-find .field.sm { height: 28px; width: 170px; padding: 0 9px; font-size: 13px; }
.ed-find .ibtn.sm { min-width: 28px; height: 28px; font: 600 12px var(--font-mono); }
.ed-fcnt { font-size: 12px; color: var(--ink2); min-width: 54px; } .ed-fcnt.bad { color: var(--accent); }
.ed-find:not(.rep) > .field:nth-of-type(2), .ed-find:not(.rep) > .field:nth-of-type(2) ~ .btn { display: none; }
.ed-find:not(.rep)::after { content: '替换 Ctrl+H'; font-size: 11.5px; color: var(--ink3); margin-left: auto; order: 9; }
.ed-banner { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 13px; background: color-mix(in srgb, var(--gold) 16%, var(--paper3)); border-bottom: 1px solid color-mix(in srgb, var(--gold) 40%, transparent); flex: none; flex-wrap: wrap; }
.ed-body { flex: 1; min-height: 0; display: flex; }
.ed-paper { flex: 1; min-width: 0; display: flex; position: relative; background: var(--paper3); }
.ed.split .ed-paper { flex-basis: 50%; border-right: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.ed-ta {
  flex: 1; min-width: 0; resize: none; border: 0; outline: none; margin: 0; background: transparent; color: var(--ink);
  font: var(--ed-size)/var(--ed-lh) var(--ed-font); padding: 22px max(22px, calc((100% - 46em) / 2)) 40vh; tab-size: 2; caret-color: var(--willow-deep);
  scrollbar-gutter: stable;
}
.ed-ta::selection { background: color-mix(in srgb, var(--willow) 30%, transparent); }
.ed-ta::placeholder { color: var(--ink3); font-style: normal; }
.ed.nowrap .ed-ta { white-space: pre; overflow-x: auto; }
.ed:has(.ed-ta) .ed-ta { font-variant-east-asian: proportional-width; }
:root .ed .ed-ta[style*="mono"], .ed[style*="--font-mono"] .ed-ta { letter-spacing: 0; }
/* 行号 */
.ed-gut { display: none; flex: none; width: 46px; padding: 22px 8px 40vh 0; overflow: hidden; text-align: right; font: 11.5px var(--font-mono); color: var(--ink3); background: color-mix(in srgb, var(--paper2) 22%, var(--paper3)); border-right: 1px solid color-mix(in srgb, var(--line) 50%, transparent); user-select: none; }
.ed-gut div { line-height: calc(var(--ed-size) * var(--ed-lh)); height: calc(var(--ed-size) * var(--ed-lh)); }
.ed.lineno .ed-gut { display: block; }
.ed.lineno .ed-ta { padding-left: 16px; }
.ed-mirror { position: absolute; visibility: hidden; left: 0; top: 0; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word; pointer-events: none; }
/* 稿纸格：横排为红色界行，竖排为右起红格 */
.ed.grid .ed-paper { background: #f6eedb; }
:root.dark .ed.grid .ed-paper { background: #22201b; }
.ed.grid .ed-ta {
  background-image: linear-gradient(transparent calc(100% - 1px), color-mix(in srgb, var(--accent) 38%, transparent) 0);
  background-size: 100% calc(var(--ed-size) * var(--ed-lh)); background-position: 0 calc(22px - 1px); background-attachment: local;
}
.ed.grid:not(.vert) .ed-ta { background-clip: content-box; padding-top: 22px; }
/* 竖排 */
.ed.vert .ed-ta { writing-mode: vertical-rl; text-orientation: mixed; padding: 34px 40px; overflow-x: auto; overflow-y: hidden; letter-spacing: .08em; }
.ed.vert.grid .ed-ta { background-image: linear-gradient(90deg, color-mix(in srgb, var(--accent) 40%, transparent) 1px, transparent 0); background-size: calc(var(--ed-size) * var(--ed-lh)) 100%; background-position: right 40px top 0; background-clip: content-box; }
/* Markdown 预览 */
.ed-md { flex: 1 1 50%; min-width: 0; overflow: auto; padding: 22px 28px 30vh; background: color-mix(in srgb, var(--paper) 30%, var(--paper3)); }
.md { font: 15.5px/1.85 var(--font-song); color: var(--ink); word-wrap: break-word; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--font-kai); font-weight: 600; line-height: 1.35; margin: 1.2em 0 .5em; color: var(--ink); }
.md h1 { font-size: 1.85em; letter-spacing: .06em; padding-bottom: .25em; border-bottom: 1px solid var(--line); }
.md h2 { font-size: 1.45em; } .md h3 { font-size: 1.2em; } .md h1:first-child, .md h2:first-child { margin-top: 0; }
.md p { margin: .6em 0; } .md a { color: var(--willow-deep); text-underline-offset: 3px; }
.md blockquote { margin: .8em 0; padding: .3em 1em; border-left: 3px solid var(--willow); background: color-mix(in srgb, var(--willow-mist) 14%, transparent); color: var(--ink2); font-family: var(--font-kai); }
.md code { font: .88em var(--font-mono); padding: .1em .35em; border-radius: calc(4px * var(--rk)); background: color-mix(in srgb, var(--paper2) 60%, transparent); }
.md pre { padding: 12px 14px; border-radius: calc(8px * var(--rk)); background: color-mix(in srgb, var(--paper2) 45%, transparent); overflow: auto; line-height: 1.6; }
.md pre code { padding: 0; background: none; }
.md ul, .md ol { padding-left: 1.6em; } .md li { margin: .2em 0; }
.md hr { border: 0; height: 12px; margin: 1.4em 0; background: radial-gradient(circle, var(--ink3) 1.5px, transparent 2px) center / 18px 12px repeat-x; opacity: .6; }
.md table { border-collapse: collapse; margin: .8em 0; font-size: .93em; } .md th, .md td { border: 1px solid var(--line); padding: 5px 10px; } .md th { background: color-mix(in srgb, var(--paper2) 45%, transparent); }
.md img { max-width: 100%; border-radius: calc(6px * var(--rk)); } .md mark { background: color-mix(in srgb, var(--gold) 35%, transparent); color: inherit; padding: 0 .15em; }
.md-img { color: var(--ink3); font-size: .9em; }
/* 状态栏 */
.ed-status { display: flex; align-items: center; gap: 14px; height: 26px; padding: 0 12px; font-size: 11.5px; color: var(--ink2); border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); background: color-mix(in srgb, var(--paper3) 70%, var(--paper)); flex: none; white-space: nowrap; overflow: hidden; }
.ed-saved.wait { color: var(--gold); }
.ed-saved.flash { animation: ed-flash 1.1s var(--ease); }
@keyframes ed-flash { 0% { color: var(--willow-deep); text-shadow: 0 0 8px var(--willow-mist); } 100% { color: inherit; text-shadow: none; } }
/* 草稿对照 */
.ed-diff { max-height: 50vh; overflow: auto; text-align: left; font: 12.5px/1.6 var(--font-mono); border: 1px solid var(--line); border-radius: calc(8px * var(--rk)); padding: 6px; }
.ed-dl { display: grid; grid-template-columns: 36px 1fr; gap: 0 8px; padding: 2px 0; border-bottom: 1px dashed color-mix(in srgb, var(--line) 60%, transparent); }
.ed-dl i { grid-row: span 2; color: var(--ink3); font-style: normal; text-align: right; }
.ed-dl del { background: color-mix(in srgb, var(--accent) 14%, transparent); text-decoration: none; white-space: pre-wrap; }
.ed-dl ins { background: color-mix(in srgb, var(--willow) 20%, transparent); text-decoration: none; white-space: pre-wrap; grid-column: 2; }
@media (max-width: 759px) {
  .ed-ta { padding: 16px 16px 40vh; }
  .ed.split .ed-paper { display: none; }
  .ed-find .field.sm { width: 120px; }
}
.ed-bar > * { flex-shrink: 0; } .ed-bar .seg { white-space: nowrap; flex-wrap: nowrap; } .ed-bar .spacer { flex-shrink: 1; min-width: 4px; }

/* ── 32-danqing.css ── */
/* ================= 丹青 ================= */
.dq { display: flex; flex-direction: column; height: 100%; min-height: 0; container: dq / inline-size; }
/* 工具条：宽时一行；窄了分两行（笔具 + 存取一行，墨碟与滑杆另起一行）；再窄只留墨字。绝不叠在一起 */
.dq-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 4px; padding: 6px 8px; border-bottom: 1px solid color-mix(in srgb, var(--line) 65%, transparent); background: color-mix(in srgb, var(--paper3) 70%, var(--paper)); flex: none; min-height: 48px; }
.dq-acts { display: flex; align-items: center; gap: 2px; flex: none; margin-left: auto; }
.dq-acts .inkbtn.dim { opacity: .4; }
@container dq (max-width: 1120px) {
  .dq-bar > .ed-sep { display: none; }
  .dq-bar > .spacer { order: 1; }
  .dq-bar .dq-acts { order: 2; }
  .dq-bar .dq-opts { order: 3; flex: 1 0 100%; padding-top: 5px; border-top: 1px dashed color-mix(in srgb, var(--line) 55%, transparent); }
  .dq-bar .dq-opt { flex: 1 1 auto; min-width: 0; }
}
@container dq (max-width: 560px) {
  .dq-bar .dq-acts .ib-l { display: none; }
  .dq-bar .dq-acts .inkbtn { padding: 0 6px !important; }
  .dq-bar .dq-tools button { padding: 4px 8px; }
  .dq-bar .dq-opt { flex-wrap: wrap; row-gap: 6px; column-gap: 8px; }
  .dq-bar .dq-dishes { flex: 1 0 100%; justify-content: space-between; }
  .dq-bar .dq-sl { flex: 1 1 130px; min-width: 0; }
  .dq-bar .dq-sl .dq-range { flex: 1; width: auto; min-width: 50px; }
  .dq-bar .dq-opt .field.sm { flex: 1 1 120px; min-width: 0; width: auto !important; }
}

  /* ---------- 公开：改名 / 移动 / 复制 ---------- */

  /** conflict: 'ask' 时由 onConflict(src, existing) 返回 'replace' | 'skip' | 'rename'（可带 all） */

      const dest = N.get(destId); if (!dest || dest.kind !== 'dir') throw new FSError('ENOTDIR', '目标不是文件夹');

  async function _merge(src, dst) {

      const cx = childByName(dst.id, c.name);
      if (cx && cx.kind === 'dir' && c.kind === 'dir') { await _merge(c, cx); continue; }
      if (cx) await _displace(cx);

      const cx = childByName(dst.id, c.name);

      if (cx) await _displace(cx);

  async function copy(ids, destId, { conflict = 'rename', onConflict, onProgress, perId } = {}) {

  /* ---------- 公开：星标（钤印）、版本 ---------- */
  async function star(id, on) {

    return locked(async () => {
      const put = [], ps = new Set();
      for (const x of ids) { const n = N.get(x); if (!n) continue; const nn = { ...n }; if (on) nn.star = true; else delete nn.star; put.push(nn); ps.add(n.parent); }
      if (!put.length) return; await meta.commit({ put }); put.forEach(setNode); changed('star', put.map(n => n.id), [...ps]);

  function versions(id) { const n = N.get(id); return n && n.ver ? n.ver.map((v, i) => ({ ...v, idx: i })) : []; }

  }

  /* ---------- 公开：搜索 ---------- */

    }

  }

  /* ---------- 公开：统计 ---------- */
  function treeSize(id) { let s = 0, f = 0, d = 0; for (const x of descendants(id)) { const n = N.get(x); if (!n || x === id) continue; if (n.kind === 'file') { s += n.size || 0; f++; } else d++; } return { size: s, files: f, dirs: d }; }
  async function stats() {
