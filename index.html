  renderMd() { if (!this.mdOn) return; this.mdv.innerHTML = MD.render(this.ta.value) || '<p class="muted">（空）</p>'; this.syncPreviewScroll(); }
  syncPreviewScroll() { if (!this.mdOn) return; const ta = this.ta, r = ta.scrollTop / Math.max(1, ta.scrollHeight - ta.clientHeight); this.mdv.scrollTop = r * (this.mdv.scrollHeight - this.mdv.clientHeight); }

  /* ---------- 查找替换 ---------- */
  openFind(rep) {
    this.find.classList.remove('hide'); this.find.classList.toggle('rep', !!rep || !!this.fr.value);
    const sel = this.ta.value.slice(this.ta.selectionStart, this.ta.selectionEnd);
    if (sel && !sel.includes('\n') && sel.length < 80) this.fq.value = sel;
    (rep && this.fq.value ? this.fr : this.fq).focus(); this.fq.select();
    this.findUpdate();
  }
  closeFind() { this.find.classList.add('hide'); this.ta.focus(); }
  findRe() {
    const q = this.fq.value; if (!q) return null;
    try { return new RegExp(this.fRe.classList.contains('on') ? q : q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g' + (this.fCase.classList.contains('on') ? '' : 'i') + 'u'); }
    catch { return 'bad'; }
  }
  findUpdate(quiet) {
    const re = this.findRe();
    if (re === 'bad') { this.fcnt.textContent = '正则有误'; this.fcnt.className = 'ed-fcnt bad'; return; }
    if (!re) { this.fcnt.textContent = ''; return; }
    let n = 0; const v = this.ta.value; for (const m of v.matchAll(re)) { n++; if (n > 9999 || !m[0].length) break; }
    this.fcnt.textContent = n ? `共 ${n > 9999 ? '9999+' : n} 处` : '无'; this.fcnt.className = 'ed-fcnt' + (n ? '' : ' bad');
    if (!quiet && n) { const p = this.ta.selectionStart; this.ta.setSelectionRange(p, p); this.findNext(1, true); }
  }
  findNext(dir = 1, keepFocus) {
    const re = this.findRe(); if (!re || re === 'bad') return;
    const v = this.ta.value, ms = [...v.matchAll(re)].filter(m => m[0].length);
    if (!ms.length) return;
    const cur = dir > 0 ? this.ta.selectionEnd : this.ta.selectionStart;
    let m = dir > 0 ? ms.find(x => x.index >= cur) || ms[0] : [...ms].reverse().find(x => x.index + x[0].length <= cur) || ms[ms.length - 1];
    this.select(m.index, m.index + m[0].length, keepFocus);
    this.fcnt.textContent = `${ms.indexOf(m) + 1} / ${ms.length}`;
  }
  select(a, b, keepFocus) {
    const ta = this.ta, fa = document.activeElement;
    ta.focus({ preventScroll: true }); ta.setSelectionRange(a, b);
    // 滚到选中处：用 blur/focus 技巧不可靠，按行估算
    if (!Prefs.get('edVertical')) { const ln = ta.value.slice(0, a).split('\n').length, lh = parseFloat(getComputedStyle(ta).lineHeight) || 24; const y = (ln - 1) * lh; if (y < ta.scrollTop || y > ta.scrollTop + ta.clientHeight - lh * 2) ta.scrollTop = Math.max(0, y - ta.clientHeight / 3); }

  }
  replaceOne() {

  menu() {
    const n = this.node;

      { label: '保存', glyph: '存', kbd: 'Ctrl S', act: () => this.save(true) },
      { label: '另存为…', glyph: '另', kbd: 'Ctrl Shift S', act: () => this.saveAs() },
      { label: '在书阁中显示', glyph: '册', disabled: !n, act: () => WM.open('shuge', { path: FS.pathOf(n.parent), select: n.id }) },

      '-',
      { label: '中文排版整理', glyph: '整', act: () => this.tidy() },
      { label: '插入当前时间', glyph: '时', act: () => { const d = new Date(), sc = shichen(d); this.insert(`${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${sc.label}`); } },
      { label: '转成竖排长卷图片', glyph: '卷', act: () => this.toScrollImage() },
      '-',
      { label: '自动换行', glyph: '↩', checked: !!Prefs.get('edWrap'), act: () => Prefs.set('edWrap', !Prefs.get('edWrap')) },
      { label: '行号', glyph: '#', checked: !!Prefs.get('edLineNo'), act: () => Prefs.set('edLineNo', !Prefs.get('edLineNo')) },
      { label: '拼写检查', glyph: 'A', checked: !!Prefs.get('edSpell'), act: () => Prefs.set('edSpell', !Prefs.get('edSpell')) },
      { label: '自动保存', glyph: '自', checked: !!Prefs.get('edAutosave'), act: () => Prefs.set('edAutosave', Prefs.get('edAutosave') ? 0 : 800) },

  tidy() {
    const v = this.ta.value, t = tidyChinese(v);
    if (t === v) return UI.toast('已经很整齐了');
    this.replaceAllText(t);
    UI.toast('已整理：全角标点、段首缩进、多余空行（Ctrl+Z 可撤销）', { type: 'ok' });
  }
  /** 把文字誊成右起竖排的长卷 PNG（带界栏与印），存到 /图画 */
  async toScrollImage() {
    const text = this.ta.value.trim(); if (!text) return UI.toast('还没有字');
    if (text.length > 6000) return UI.toast('字太多了（上限 6000 字）', { type: 'warn' });
    const fs = 30, colH = 22, gap = 18, pad = 70;
    const cols = [];
    for (const para of text.split('\n')) { const chars = [...para.replace(/\t/g, '　')]; if (!chars.length) { cols.push([]); continue; } for (let i = 0; i < chars.length; i += colH) cols.push(chars.slice(i, i + colH)); }
    const W = pad * 2 + cols.length * (fs + gap), H = pad * 2 + colH * fs * 1.12 + 40;
    if (W > 30000) return UI.toast('太长了，分几段誊吧', { type: 'warn' });
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const c = cv.getContext('2d');
    c.fillStyle = '#f3ead6'; c.fillRect(0, 0, W, H);
    const R = rng(7); for (let i = 0; i < W * H / 900; i++) { c.fillStyle = `rgba(120,100,70,${R() * 0.05})`; c.fillRect(R() * W, R() * H, 1 + R() * 2, 1); }
    c.strokeStyle = 'rgba(176,74,58,.45)'; c.lineWidth = 1.2; c.strokeRect(pad - 20, pad - 24, W - pad * 2 + 40, H - pad * 2 + 30);
    c.font = `${fs}px ${getComputedStyle(document.body).getPropertyValue('--font-kai')}`; c.fillStyle = '#1c1a17'; c.textAlign = 'center'; c.textBaseline = 'top';
    cols.forEach((col, i) => {
      const x = W - pad - i * (fs + gap) - fs / 2;
      if (i) { c.beginPath(); c.moveTo(x + (fs + gap) / 2, pad - 24); c.lineTo(x + (fs + gap) / 2, H - pad + 6); c.stroke(); }
      col.forEach((ch, j) => { const y = pad + j * fs * 1.12; if ('，。、；：？！'.includes(ch)) { c.save(); c.font = `${fs * 0.8}px sans-serif`; c.fillText(ch, x + fs * 0.25, y - fs * 0.25); c.restore(); } else if ('（）《》「」『』“”‘’…—'.includes(ch)) { c.save(); c.translate(x, y + fs / 2); c.rotate(Math.PI / 2); c.fillText(ch, 0, -fs / 2); c.restore(); } else c.fillText(ch, x, y); });
    });
    // 印
    const sx = pad - 6, sy = H - pad - 64; c.fillStyle = '#b8432f'; c.fillRect(sx, sy, 52, 52); c.fillStyle = '#f3ead6';
    Brush.glyphToCanvas(c, '青', sx + 3, sy + 3, 46, '#f3ead6');
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    const nm = (this.node ? baseOf(this.node.name) : '无题') + '·长卷.png';
    const n = await FS.create(FS.resolve('/图画')?.id || (await FS.mkdir('/图画')).id, nm, blob, { conflict: 'rename' });
    UI.toast('已誊成长卷：/图画/' + n.name, { type: 'ok', action: { label: '看看', act: () => WM.openFile(n) } });
  }
}

/* ================= 丹青：水墨画室 ================= */
/* 每一笔都记录为可重放的操作（点列 + 相对时间 + 随机种子），撤销/重做精确无损；
   每 12 笔存一张检查点位图，撤销时从最近的检查点重放，几百笔也是瞬时。
   存为 .qsink（JSON：画纸、尺幅、笔迹、缩略图），可随时接着画；也可导出 PNG。 */

const DQ_PAPERS = {
  xuan:  { name: '生宣', base: '#f4eddc', fiber: 'rgba(120,100,70,', fa: 0.07 },
  shu:   { name: '熟宣', base: '#efe5cc', fiber: 'rgba(130,105,60,', fa: 0.05 },
  juan:  { name: '绢本', base: '#e6d8b8', fiber: 'rgba(110,85,50,', fa: 0.06, weave: true },
  sajin: { name: '洒金', base: '#f1e3c3', fiber: 'rgba(130,100,50,', fa: 0.05, gold: true },
  ciqing:{ name: '瓷青', base: '#26353a', fiber: 'rgba(200,220,230,', fa: 0.05, dark: true },
  su:    { name: '素笺', base: '#fbf9f3', fiber: 'rgba(120,110,90,', fa: 0.03 }
};
const DQ_EXTRA_INKS = {
  泥金: { color: '#c9a24a', load: 0.95, dry: 0.0009, alpha: 0.9, wet: 0.2, light: true },
  蛤粉: { color: '#f2eee4', load: 0.95, dry: 0.0009, alpha: 0.85, wet: 0.2, light: true }
};
const DQ_INK = name => Brush.INKS[name] || DQ_EXTRA_INKS[name];
const DQ_INK_ORDER = ['浓墨', '淡墨', '枯笔', '泼墨', '朱砂', '胭脂', '藤黄', '赭石', '石绿', '石青', '泥金', '蛤粉'];
const DQ_FORMATS = [['hengfu', '横幅', 1600, 1000], ['lizhou', '立轴', 900, 1600], ['doufang', '斗方', 1200, 1200], ['shoujuan', '手卷', 3000, 900], ['shanmian', '扇面', 1600, 900]];

function dqPaintPaper(c, W, H, pid, seed = 3) {
  const P = DQ_PAPERS[pid] || DQ_PAPERS.xuan, R = rng(seed);
  c.save(); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  c.fillStyle = P.base; c.fillRect(0, 0, W, H);
  // 纤维：短而弯的细丝
  const n = Math.round(W * H / 260);
  c.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const x = R() * W, y = R() * H, a = R() * Math.PI * 2, l = 4 + R() * 22, bend = (R() - 0.5) * 8;
    c.strokeStyle = P.fiber + (P.fa * (0.3 + R())) + ')'; c.lineWidth = 0.4 + R() * 0.7;
    c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + Math.cos(a) * l / 2 + bend, y + Math.sin(a) * l / 2 - bend, x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
  }
  // 云状浓淡（帘纹与纸浆不匀）
  for (let i = 0; i < 26; i++) {
    const x = R() * W, y = R() * H, r = 80 + R() * 260, g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, P.fiber + (P.fa * 0.5) + ')'); g.addColorStop(1, P.fiber + '0)');
    c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
  }
  if (!P.weave) { c.fillStyle = P.fiber + (P.fa * 0.35) + ')'; for (let y = 0; y < H; y += 26 + R() * 4) c.fillRect(0, y, W, 0.6); }
  if (P.weave) { c.globalAlpha = 0.07; c.strokeStyle = '#5a4630'; c.lineWidth = 0.5; c.beginPath(); for (let x = 0; x < W; x += 2.2) { c.moveTo(x, 0); c.lineTo(x, H); } for (let y = 0; y < H; y += 2.2) { c.moveTo(0, y); c.lineTo(W, y); } c.stroke(); c.globalAlpha = 1; }
  if (P.gold) for (let i = 0; i < W * H / 2400; i++) {
    const x = R() * W, y = R() * H, s = 1 + R() * R() * 7, k = 3 + Math.floor(R() * 3);
    c.fillStyle = `rgba(${200 + R() * 30 | 0},${160 + R() * 30 | 0},${70 + R() * 30 | 0},${0.45 + R() * 0.45})`;
    c.beginPath(); for (let j = 0; j < k; j++) { const a = j / k * Math.PI * 2 + R(); c.lineTo(x + Math.cos(a) * s * (0.5 + R()), y + Math.sin(a) * s * (0.5 + R())); } c.fill();

      mv: { d: 'mv <源…> <目标>  移动或改名', async run(a) { if (a.length < 2) throw new Error('mv 源 目标'); const dst = T.abs(a[a.length - 1]), srcs = a.slice(0, -1).map(p => T.need(p)), dn = FS.resolve(dst);
        if (dn && dn.kind === 'dir') { const r = await FS.move(srcs.map(s => s.id), dn.id, { conflict: 'skip' }); T.o(`已移动 ${srcs.length} 项` + (r && r.skipped && r.skipped.length ? `，跳过同名 ${r.skipped.length}` : ''), false, 'tm-dim'); return; }
        if (srcs.length > 1) throw new Error('多个源时，目标必须是已有目录');
        const parent = FS.resolve(dst.replace(/\/[^/]+$/, '') || '/'); if (!parent) throw new Error('目标上级不存在');
        if (parent.id !== srcs[0].parent) await FS.move([srcs[0].id], parent.id, { conflict: 'error' });
        await FS.rename(srcs[0].id, dst.split('/').pop()); } },
      cp: { d: 'cp <源…> <目录>  复制', async run(a) { if (a.length < 2) throw new Error('cp 源 目录'); const dn = T.need(a[a.length - 1]); if (dn.kind !== 'dir') throw new Error('目标须是目录'); const srcs = a.slice(0, -1).filter(x => !x.startsWith('-')).map(p => T.need(p)); await FS.copy(srcs.map(s => s.id), dn.id, { conflict: 'rename' }); T.o(`已复制 ${srcs.length} 项`, false, 'tm-dim'); } },
      find: { d: 'find <关键词> [目录]  按名字找', run([q, p]) { if (!q) throw new Error('find 要给关键词'); const root = T.need(p || '.'); const r = FS.searchNames(q, { root: root.id, limit: 200 }); if (!r.length) return T.o('没找到', false, 'tm-dim'); for (const n of r) { const d = T._cap ? null : T.print('', true); const s = `${T.nameHTML(n)} <span class="tm-dim">${esc(FS.pathOf(n.parent))}</span>`; if (d) { d.innerHTML = s; T.bindLinks(d); } else T.o(FS.pathOf(n.id)); } } },
      grep: { d: 'grep <词> [目录]  在文本内容里找', async run([q, p]) { if (!q) throw new Error('grep 要给词'); const root = T.need(p || '.'); const r = await FS.searchContent(q, { root: root.id, limit: 100 }); if (!r.length) return T.o('没找到', false, 'tm-dim'); for (const x of r) { const n = x.node || FS.get(x.id); T.o(`<span class="tm-path">${esc(FS.pathOf(n.id))}</span>${x.line ? `<span class="tm-dim">:${x.line}</span>` : ''}  ${esc(x.snippet || x.text || '')}`, true); } } },
      stat: { d: 'stat <路径>  详情', run([p]) { const n = T.need(p || '.'); const rows = [['名字', n.name || '/'], ['路径', FS.pathOf(n.id)], ['类别', n.kind === 'dir' ? '目录' : KIND_LABEL[kindOf(n)] + ' · ' + (n.mime || '')], ['大小', n.kind === 'dir' ? (() => { const t = FS.treeSize(n.id); return `${fmtSize(t.size)}（${t.files} 文件，${t.dirs} 目录）`; })() : fmtSize(n.size) + ` (${n.size} B)`], ['存于', n.kind === 'dir' ? '—' : (n.store || '') + (n.mirror ? ' + 镜像' : '')], ['创建', fmtTime(n.ctime, true)], ['修改', fmtTime(n.mtime, true)], ['版本', n.ver ? n.ver.length + ' 个' : '—'], ['校验', n.hash ? n.hash.slice(0, 16) + '…' : '—'], ['编号', n.id]]; for (const [k, v] of rows) T.o(`<span class="tm-dim">${k.padEnd(3, '　')}</span> ${esc(v)}`, true); } },
      du: { d: 'du [目录]  占用', run([p]) { const n = T.need(p || '.'); const t = FS.treeSize(n.id); T.o(`${fmtSize(t.size)}  ${t.files} 文件  ${t.dirs} 目录  ${FS.pathOf(n.id)}`); } },
      open: { d: 'open <路径>  用对应程序打开', run([p]) { const n = T.need(p || '.'); WM.openFile(n); } },
      ver: { d: 'ver <文件>  列出历史版本', run([p]) { const n = T.need(p); const vs = FS.versions(n.id) || []; if (!vs.length) return T.o('没有历史版本', false, 'tm-dim'); vs.forEach((v, i) => T.o(`  #${i}  ${fmtTime(v.mtime, true)}  ${fmtSize(v.size)}`)); T.o('用书阁「详情」可以还原', false, 'tm-dim'); } },
      cores: { d: '四重存储的状态', async run() { const i = FS.info, st = await FS.stats(); const est = navigator.storage?.estimate ? await navigator.storage.estimate() : {};
        T.o(`<span class="tm-gold">四核</span>  模式 ${esc(i.mode)}  启动 ${Math.round(i.bootMs)}ms  持久化 ${i.persisted ? '<span class="tm-ok">已获准</span>' : '<span class="tm-warn">未获准</span>'}`, true);
        T.o(`  OPFS        ${i.opfs ? '<span class="tm-ok">●</span> 启用' : '<span class="tm-warn">○</span> ' + esc(i.opfsReason || '未用')}  ${st.byStore.opfs} 份内容`, true);
        T.o(`  IndexedDB   <span class="tm-ok">●</span> ${esc(i.dbName)}  ${st.byStore.idb} 份内容  镜像 ${st.mirrored}`, true);
        T.o(`  localStorage ${LS.ok ? '<span class="tm-ok">●</span>' : '<span class="tm-err">×</span>'} 偏好 / 草稿 / 目录快照`, true);
        T.o(`  Cookie      ${Cookie.native ? '<span class="tm-ok">●</span>' : '<span class="tm-warn">○</span>'} 称呼与一次性标记`, true);
        T.o(`  共 ${st.files} 文件 · ${st.dirs} 目录 · ${fmtSize(st.bytes)} · 版本 ${st.versions}（${fmtSize(st.verBytes)}） · 拾遗 ${st.trashItems} 项`);
        if (est.quota) T.o(`  配额 ${fmtSize(est.usage)} / ${fmtSize(est.quota)}`); } },
      fsck: { d: 'fsck [--deep]  体检并自愈（deep 会校验每个文件的哈希）', async run(a) { const deep = a.includes('--deep'); T.o(deep ? '深度体检中，逐一校验内容…' : '体检中…', false, 'tm-dim'); const r = await FS.fsck({ deep }); T.o(`检查 ${r.checked} 项 · 自愈 ${r.healed} · 孤块 ${r.orphanBlobs}（释放 ${fmtSize(r.freed)}） · 镜像修补 ${r.mirrorFixed} · 损坏 ${r.corrupt}`, false, r.corrupt ? 'tm-warn' : 'tm-ok'); for (const n of r.notes || []) T.o('  · ' + n, false, 'tm-dim'); } },
      prefs: { d: 'prefs [键 [值]]  查看/修改偏好', run([k, v]) { if (!k) { for (const [kk, vv] of Object.entries(Prefs.all())) T.o(`<span class="tm-dim">${kk.padEnd(16)}</span>${esc(JSON.stringify(vv))}`, true); return; } if (!(k in PREF_DEFAULTS)) throw new Error('没有这个偏好：' + k); if (v === undefined) return T.o(JSON.stringify(Prefs.get(k))); let val = v; try { val = JSON.parse(v); } catch { } Prefs.set(k, val); T.o(`${k} = ${JSON.stringify(val)}`, false, 'tm-ok'); } },
      theme: { d: 'theme [名]  切换主题', run([n]) { const L = Theme.list(); if (!n) { L.forEach(t => T.o(`${t.id === Prefs.get('theme') ? '›' : ' '} ${t.id.padEnd(11)} ${t.name}  <span class="tm-dim">${esc(t.motto)}</span>`, true)); return; } const t = L.find(x => x.id === n || x.name === n); if (!t) throw new Error('没有这个主题'); Prefs.set('theme', t.id); } },
      cookies: { d: '列出 Cookie', run() { const c = document.cookie; T.o(c ? c.split(/;\s*/).join('\n') : '（无）', false, 'tm-pre'); } },
      drafts: { d: '未保存的草稿', run() { const d = Drafts.list(); if (!d.length) return T.o('没有草稿', false, 'tm-dim'); d.forEach(x => T.o(`${fmtTime(x.at)}  ${x.path || '（无题）'}  <span class="tm-dim">${x.big ? '大稿' : (x.text || '').length + ' 字'}</span>`, true)); } },
      recent: { d: '最近打开', run() { Recent.list().slice(0, 20).forEach(r => { const n = FS.get(r.id); if (n) T.o(`${fmtRel(r.at).padEnd(8)} ${FS.pathOf(n.id)}`); }); } },
      date: { d: '日期 · 节气 · 时辰', run() { const d = new Date(), j = jieqi(d), s = shichen(d); T.o(`${d.toLocaleString('zh-CN')}  ${j.name} · 第${cnNum(j.days + 1)}日（距${j.next} ${j.untilNext} 天）  ${s.label}（${s.note}）`); } },
      poem: { d: '吟一首', run() { if (typeof POEMS === 'undefined' || !POEMS.length) return T.o('诗笺未备', false, 'tm-dim'); const p = POEMS[Math.floor(Math.random() * POEMS.length)]; T.o(`<span class="tm-gold">${esc(p.t)}</span> <span class="tm-dim">${esc(p.d || '')} · ${esc(p.a)}</span>`, true); p.b.forEach(l => T.o('  ' + l)); } },
      whoami: { d: '你是谁', run() { T.o(Prefs.get('userName') || '客'); } },
      history: { d: '旧令', run() { T.hist.slice(-50).forEach((c, i) => T.o(`${String(T.hist.length - Math.min(50, T.hist.length) + i + 1).padStart(4)}  ${c}`)); } },
      clear: { d: '清屏（Ctrl+L）', run() { T.out.replaceChildren(); } },
      exit: { d: '合上令符', run() { T.win.close(); } }
    };

  }

/* ================= 仓廪：存储与体检 ================= */
registerApp({
  id: 'canglin', name: '仓廪', glyph: '仓', color: '#7a5a32', desc: '四重存储、体检自愈、备份', kw: 'storage disk backup fsck 存储 备份 空间 体检', w: 860, h: 640, minW: 340, minH: 300, single: true,
  create(win, args) { return new Granary(win, args); }
});

const KIND_HUE = { text: 'var(--willow-deep)', image: 'var(--jade)', audio: 'var(--plum)', video: 'var(--rust)', pdf: 'var(--accent)', zip: 'var(--ink3)', ink: 'var(--ink)', bin: 'var(--paper2)' };

/* ---------- 四仓各有其形：OPFS 是柜（抽屉按类别拉出），IndexedDB 是簿（一行一账），
   localStorage 是砚（墨池的墨面就是用量，按用途分层），Cookie 是笺（朱丝栏里写到哪儿算哪儿），
   浏览器给的配额是一口缸（水位），各类文件是一束竹简（简越长、占得越多） ---------- */
const StoreArt = {
  esc: s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]),
  /** 柜：每个抽屉一类文件，占得越多拉出得越多 */
  cabinet(rows, total, off) {
    const W = 220, H = 150, n = Math.max(4, rows.length), dh = (H - 26) / n;
    let g = `<rect x="34" y="8" width="150" height="${H - 12}" fill="color-mix(in srgb, #7a5a32 78%, var(--paper))" stroke="color-mix(in srgb, #3e2c18 70%, transparent)"/>`
      + `<rect x="30" y="4" width="158" height="7" fill="#5c4226"/><rect x="38" y="${H - 6}" width="8" height="5" fill="#5c4226"/><rect x="172" y="${H - 6}" width="8" height="5" fill="#5c4226"/>`;
    for (let i = 0; i < n; i++) {
      const r = rows[i], y = 14 + i * dh, share = r && total ? r.bytes / total : 0, dx = off ? 0 : Math.round(Math.sqrt(share) * 30);
      if (dx) g += `<rect x="${40 - dx}" y="${y + 2}" width="${dx}" height="${dh - 6}" fill="color-mix(in srgb, #3e2c18 40%, transparent)"/>`;
      g += `<g transform="translate(${-dx},0)"><rect x="40" y="${y}" width="138" height="${dh - 4}" fill="color-mix(in srgb, #9a7748 70%, var(--paper3))" stroke="rgba(60,40,20,.35)"/>`
        + (r ? `<rect x="46" y="${y + 3}" width="5" height="${dh - 10}" fill="${r.color}"/><text x="56" y="${y + dh / 2 + 2}" font-size="11" fill="#2b2217" style="font-family:var(--font-kai)">${this.esc(r.label)}</text><text x="172" y="${y + dh / 2 + 2}" font-size="10" text-anchor="end" fill="rgba(43,34,23,.75)">${this.esc(fmtSize(r.bytes))}</text>` : '')
        + `<circle cx="104" cy="${y + dh / 2 - 2}" r="2.6" fill="none" stroke="#c9a45c" stroke-width="1.2"/></g>`;
    }
    if (off) g += `<rect x="92" y="10" width="34" height="${H - 16}" fill="color-mix(in srgb, var(--accent) 85%, transparent)"/><text x="109" y="${H / 2 + 6}" font-size="18" text-anchor="middle" fill="var(--paper3)" style="font-family:var(--font-kai);writing-mode:vertical-rl">封</text>`;
    return `<svg viewBox="0 0 ${W} ${H}" class="cl-art">${g}</svg>`;
  },
  /** 簿：翻开的账簿，每行一笔账，墨线长短按数量（取对数） */
  ledger(rows) {
    const W = 220, H = 150, max = Math.max(...rows.map(r => r.n), 1);
    let g = `<path d="M110 16 Q70 6 18 14 L18 140 Q70 132 110 142 Z" fill="color-mix(in srgb, var(--paper3) 92%, #fff)" stroke="var(--line)"/>`
      + `<path d="M110 16 Q150 6 202 14 L202 140 Q150 132 110 142 Z" fill="color-mix(in srgb, var(--paper3) 92%, #fff)" stroke="var(--line)"/>`
      + `<line x1="110" y1="16" x2="110" y2="142" stroke="color-mix(in srgb, var(--ink) 30%, transparent)"/>`
      + `<text x="64" y="40" font-size="22" text-anchor="middle" fill="var(--ink)" style="font-family:var(--font-kai)">簿</text>`
      + `<text x="64" y="60" font-size="9.5" text-anchor="middle" fill="var(--ink3)">IndexedDB</text>`;
    for (let i = 0; i < 7; i++) g += `<line x1="${120}" y1="${30 + i * 16}" x2="${194}" y2="${30 + i * 16}" stroke="color-mix(in srgb, var(--accent) 22%, transparent)"/><line x1="${26}" y1="${78 + i * 9}" x2="${102}" y2="${78 + i * 9}" stroke="color-mix(in srgb, var(--accent) 14%, transparent)"/>`;
    rows.forEach((r, i) => {
      const y = 26 + i * 16 + 16, len = r.n ? 4 + Math.log(1 + r.n) / Math.log(1 + max) * 26 : 0;
      g += `<text x="122" y="${y - 3}" font-size="10" fill="var(--ink2)" style="font-family:var(--font-kai)">${this.esc(r.label)}</text>`
        + (len ? `<path d="M146 ${y - 6.5} h${len}" stroke="var(--ink)" stroke-width="3.2" stroke-linecap="round" opacity=".72"/>` : '')
        + `<text x="196" y="${y - 3}" font-size="9" text-anchor="end" fill="var(--ink3)">${r.n}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" class="cl-art">${g}</svg>`;
  },
  /** 砚：墨池剖面，墨分层（偏好、草稿、目录快照……），满池约 5 MB */
  inkstone(layers, cap) {
    const W = 220, H = 150, top = 36, bot = 120, x0 = 54, x1 = 166;
    const used = layers.reduce((a, l) => a + l.bytes, 0), pct = used / cap;
    let g = `<path d="M30 24 Q30 14 40 14 H180 Q190 14 190 24 V128 Q190 140 178 140 H42 Q30 140 30 128 Z" fill="color-mix(in srgb, #3c3832 88%, var(--paper))"/>`
      + `<path d="M36 22 H184 V30 H36 Z" fill="rgba(255,255,255,.06)"/>`
      + `<defs><clipPath id="clwell"><path d="M${x0} ${top} H${x1} L${x1 - 8} ${bot} Q110 ${bot + 10} ${x0 + 8} ${bot} Z"/></clipPath></defs>`
      + `<path d="M${x0} ${top} H${x1} L${x1 - 8} ${bot} Q110 ${bot + 10} ${x0 + 8} ${bot} Z" fill="#26231f" stroke="rgba(255,255,255,.12)"/>`;
    let y = bot + 4; const span = bot + 4 - top;
    g += `<g clip-path="url(#clwell)">`;
    for (const l of layers) { if (!l.bytes) continue; const hh = Math.max(1.6, l.bytes / cap * span); y -= hh; g += `<rect x="${x0}" y="${y}" width="${x1 - x0}" height="${hh + .4}" fill="${l.color}"/>`; }
    g += `<path d="M${x0} ${y} q14 -2.4 28 0 t28 0 t28 0 t28 0" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1"/></g>`;
    g += `<g transform="rotate(-14 176 92)"><rect x="168" y="52" width="16" height="80" fill="#1b1a17" stroke="rgba(201,164,92,.6)"/><text x="176" y="78" font-size="10" text-anchor="middle" fill="#c9a45c" style="font-family:var(--font-kai)">松</text><text x="176" y="92" font-size="10" text-anchor="middle" fill="#c9a45c" style="font-family:var(--font-kai)">烟</text></g>`;
    g += `<text x="110" y="${top - 8}" font-size="10" text-anchor="middle" fill="rgba(239,230,207,.8)">${this.esc(fmtSize(used))} / ${this.esc(fmtSize(cap))} · ${(pct * 100).toFixed(pct < .1 ? 2 : 1)}%</text>`;
    return `<svg viewBox="0 0 ${W} ${H}" class="cl-art">${g}</svg>`;
  },
  /** 笺：朱丝栏信笺，从右往左一行行写，写满 4 KB 就是一整张 */
  letter(items, cap) {
    const W = 220, H = 150, cols = 12, x0 = 52, cw = 10, y0 = 18, ch = 116;
    const used = items.reduce((a, c) => a + c.bytes, 0), cells = cols * 14, fill = Math.min(cells, Math.round(used / cap * cells));
    let g = `<rect x="${x0 - 8}" y="${y0 - 8}" width="${cols * cw + 16}" height="${ch + 16}" fill="color-mix(in srgb, #f3e6cf 88%, var(--paper3))" stroke="color-mix(in srgb, var(--accent) 45%, transparent)"/>`;
    for (let i = 0; i <= cols; i++) g += `<line x1="${x0 + i * cw}" y1="${y0}" x2="${x0 + i * cw}" y2="${y0 + ch}" stroke="color-mix(in srgb, var(--accent) 38%, transparent)" stroke-width=".7"/>`;
    for (let k = 0; k < fill; k++) {
      const c = Math.floor(k / 14), r = k % 14, x = x0 + (cols - 1 - c) * cw + cw / 2, y = y0 + 5 + r * 8.1;
      g += `<rect x="${x - 3}" y="${y - 3}" width="6" height="6" fill="${k < Math.max(1, Math.round((items[0]?.ours || 0) / cap * cells)) ? 'var(--ink)' : 'var(--ink3)'}" opacity=".7"/>`;
    }
    if (!fill && used) g += `<rect x="${x0 + (cols - 1) * cw + 2}" y="${y0 + 2}" width="6" height="6" fill="var(--ink)" opacity=".7"/>`;
    g += `<rect x="${x0 + 4}" y="${y0 + ch - 26}" width="20" height="20" fill="color-mix(in srgb, var(--accent) 88%, transparent)"/><text x="${x0 + 14}" y="${y0 + ch - 11}" font-size="13" text-anchor="middle" fill="var(--paper3)" style="font-family:var(--font-kai)">笺</text>`;
    return `<svg viewBox="0 0 ${W} ${H}" class="cl-art">${g}</svg>`;
  },
  /** 缸：浏览器给本站的配额是一口缸，水位是已用；青丝自己的文件用深一层的水表示 */
  vat(usage, quota, ours) {
    const W = 200, H = 190, top = 30, bot = 172, p = quota ? usage / quota : 0, po = quota ? Math.min(usage, ours) / quota : 0;
    const lvl = v => bot - Math.max(v > 0 ? 3 : 0, v * (bot - top));
    const y = lvl(p), yo = lvl(po);
    const jar = `M48 ${top} Q38 ${top} 40 ${top + 10} Q16 70 22 118 Q30 ${bot + 4} 100 ${bot + 6} Q170 ${bot + 4} 178 118 Q184 70 160 ${top + 10} Q162 ${top} 152 ${top} Z`;
    return `<svg viewBox="0 0 ${W} ${H}" class="cl-art cl-vat"><defs><clipPath id="clvat"><path d="${jar}"/></clipPath></defs>`
      + `<path d="${jar}" fill="color-mix(in srgb, #8a6a4a 30%, var(--paper3))" stroke="color-mix(in srgb, #5a4330 70%, transparent)" stroke-width="2"/>`
      + `<g clip-path="url(#clvat)"><rect x="0" y="${y}" width="${W}" height="${H}" fill="color-mix(in srgb, var(--willow) 45%, transparent)"/>`
      + `<rect x="0" y="${yo}" width="${W}" height="${H}" fill="color-mix(in srgb, var(--willow-deep) 70%, transparent)"/>`
      + `<path class="cl-wave" d="M-200 ${y} q25 -4 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 V${H} H-200 Z" fill="color-mix(in srgb, var(--willow) 35%, transparent)"/></g>`
      + `<path d="M40 ${top + 2} Q100 ${top - 8} 160 ${top + 2}" fill="none" stroke="color-mix(in srgb, #5a4330 60%, transparent)" stroke-width="5" stroke-linecap="round"/>`
      + `<text x="100" y="${Math.min(y - 6, bot - 18)}" font-size="11" text-anchor="middle" fill="var(--ink)">${p < 0.01 ? '不到 1%' : (p * 100).toFixed(1) + '%'}</text></svg>`;
  },
  /** 竹简：每类文件一根简，长短按占用（开平方，免得小的看不见） */
  slips(kinds) {
    const max = Math.max(...kinds.map(k => k[1]), 1);
    return h('div.cl-slips', {}, ...kinds.map(([k, b]) => h('div.cl-slip', { style: { '--h': (34 + Math.sqrt(b / max) * 66) + '%', '--c': KIND_HUE[k] }, dataset: { tip: `${KIND_LABEL[k]} · ${fmtSize(b)}` } },
      h('span.cl-sk', { text: KIND_LABEL[k] }), h('span.cl-sv', { text: fmtSize(b) }))));
  }
};

async function seedFiles(fs) {
  await fs.mkdir('/桌面'); await fs.mkdir('/文稿'); await fs.mkdir('/图画'); await fs.mkdir('/丹青'); await fs.mkdir('/诗笺');
  await fs.writeFile('/桌面/启封.md', `# 青丝 OS · 第四卷

柳色青青，宣纸生香。这一卷从头写过。

## 三根卷轴
每个窗口标题栏正中的三根小卷轴，各做各的事：

- **收**：立轴自下而上卷起，卷成一束飞回程序坞。点程序坞上那方印，它又垂展开来。
- **开**：两根轴向屏幕两端推开，画卷展满；再按一次，收回原处。
- **合**：两根轴从左右向中间卷拢，合成一线。有没存的字时，合轴上会悬一滴朱墨。

把鼠标停在卷轴上，笔会把字一笔一笔写出来。

## 四核存储
- **OPFS**：存文件内容，快，适合大文件。
- **IndexedDB**：存索引、旧稿，以及小文件的镜像——OPFS 万一丢了内容，会从镜像自动补回。
- **localStorage**：存设置、草稿（写字时每停一下就存一次）。
- **Cookie**：记得你是谁。

每一步写入都先落新内容、再一次性切换索引、最后才删旧内容；中途断电或崩溃，下次打开会自动体检、清理半成品。

## 小提示
- \`Ctrl K\` 呼出「寻」：程序、文件、命令、设置、诗句，一处都能找。
- \`Alt W\` 合 · \`Alt M\` 收 · \`Alt ↑\` 开 · \`Alt ← →\` 靠边半屏。
- 把窗口拖到屏幕边缘可以吸附半屏、四分之一屏；拖到顶部展开。
- 点顶栏右侧的节气，看今日时令。
- 书阁里除了图标、列表，还有「书架」与「长卷」两种看法。
- 设阁里几乎一切都能调，也能整体导出、导入。
`);
  await fs.writeFile('/文稿/咏柳.txt', '咏柳\n贺知章\n\n碧玉妆成一树高，\n万条垂下绿丝绦。\n不知细叶谁裁出，\n二月春风似剪刀。\n');

  // 一幅用笔锋算法画的柳（SVG）

  Shell.start(); Lock.init(); setFavicon();
  // 全局快捷键
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'k') { e.preventDefault(); Launcher.isOpen ? Launcher.close() : Launcher.open(); }
    else if (e.altKey && !e.ctrlKey && e.key.toLowerCase() === 'l') { e.preventDefault(); Lock.lock(); }
    else if (e.altKey && e.code === 'Space') { e.preventDefault(); Launcher.open(); }
  });
  // 首次交互时请求持久化（不在启动时弹窗打扰）
  addEventListener('pointerdown', () => { if (!FS.info.persisted) FS.requestPersist().then(() => Shell.refreshCores()); }, { once: true, capture: true });
  // 阻止浏览器把拖进来的文件直接打开
  addEventListener('dragover', e => e.preventDefault()); addEventListener('drop', e => e.preventDefault());
  addEventListener('unhandledrejection', e => { const r = e.reason; if (r && r.name === 'FSError') { UI.toast(r.message, { type: 'err' }); e.preventDefault(); } });
  await WM.restoreSession();
  if (!Prefs.get('welcomed') && !Cookie.hasOnce('welcomed')) await welcome();
  else if (!Prefs.get('welcomed')) Prefs.set('welcomed', true);
  document.documentElement.classList.add('ready');
  window.__qsReady = true;
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
</body>
</html>
