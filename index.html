<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#ebe2d0">
<meta name="color-scheme" content="light dark">
<title>青丝 OS · V4</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='10' fill='%23b8402f'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23f3ead8' font-family='serif'%3E%E9%9D%92%3C/text%3E%3C/svg%3E">
<style>
/* ── 00-base.css ── */
/* ================= 基础：变量、排版、控件 ================= */
:root {
  --paper: #ebe2d0; --paper2: #d9ceb8; --paper3: #f4eee2; --ink: #1c1a17; --ink2: #3a3530; --ink3: #7a7266; --line: #cbbfa6;
  --willow: #7a8b6f; --willow-deep: #4f5e48; --willow-mist: #a8b89a; --accent: #c44a3a; --gold: #b08a4a; --jade: #5d7a6f; --plum: #6b3a4a; --rust: #a8553a;
  --bar: #1f1d1a; --bar-ink: #e9e1cf; --dock: rgba(31,29,26,.93); --sel: rgba(122,139,111,.24); --glass: rgba(244,238,226,.78);
  --font-kai: "Kaiti SC", "STKaiti", "KaiTi", "BiauKai", "AR PL UKai CN", "Noto Serif CJK SC", "Source Han Serif SC", serif;
  --font-song: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "Noto Serif SC", "SimSun", serif;
  --font-sans: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace;
  --font-ui: var(--font-kai);
  --ui-scale: 1; --rk: 0; --r: calc(10px * var(--rk)); --r-sm: calc(6px * var(--rk)); --bar-h: 34px; --dock-h: 66px;
  --ease: cubic-bezier(.22, .8, .24, 1); --ease-ink: cubic-bezier(.6, .05, .3, 1); --spring: cubic-bezier(.3, 1.4, .5, 1);
  --t: .22s; --shadow: 0 1px 2px rgba(40,30,20,.08), 0 8px 24px rgba(40,30,20,.12), 0 24px 60px rgba(40,30,20,.12);
  --shadow-sm: 0 1px 2px rgba(40,30,20,.1), 0 4px 12px rgba(40,30,20,.1);
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
}
:root.dark { --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.4), 0 30px 70px rgba(0,0,0,.35); --shadow-sm: 0 2px 10px rgba(0,0,0,.35); }
:root[data-font=song] { --font-ui: var(--font-song); }
:root[data-font=sans] { --font-ui: var(--font-sans); }
:root[data-density=compact] { --bar-h: 30px; --dock-h: 56px; }
:root[data-motion="0"] *, :root[data-motion="0"] *::before, :root[data-motion="0"] *::after { animation-duration: 0s !important; animation-delay: 0s !important; transition-duration: 0s !important; }
:root[data-motion="1"] { --t: .14s; }
@media (pointer: coarse) { :root { --bar-h: 38px; } }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  font: calc(14px * var(--ui-scale)) / 1.55 var(--font-ui); color: var(--ink); background: var(--paper);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  user-select: none; -webkit-user-select: none; text-rendering: optimizeLegibility;
}
input, textarea, select, button { font: inherit; color: inherit; }
input, textarea, [contenteditable=true], .selectable { user-select: text; -webkit-user-select: text; }
button { cursor: pointer; }
::selection { background: color-mix(in srgb, var(--willow) 35%, transparent); }
svg.glyph { display: block; overflow: visible; }
@keyframes qs-write { to { stroke-dashoffset: 0; } }
@keyframes qs-fade-in { from { opacity: 0; } }
@keyframes qs-rise { from { opacity: 0; transform: translateY(8px) scale(.98); } }
@keyframes qs-spin { to { transform: rotate(360deg); } }
@keyframes qs-ink-pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }

/* 滚动条：一笔细墨 */
* { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--ink3) 45%, transparent) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--ink3) 40%, transparent); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--ink3) 65%, transparent); }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }

/* ---------- 按钮 ---------- */
.btn {
  --b: var(--line); display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; padding: 0 14px;
  border: 1px solid var(--b); border-radius: var(--r-sm); background: var(--paper3); color: var(--ink);
  transition: background var(--t), border-color var(--t), transform .08s, box-shadow var(--t); white-space: nowrap; letter-spacing: .04em;
}
.btn:hover { background: color-mix(in srgb, var(--paper3) 70%, var(--willow-mist)); border-color: color-mix(in srgb, var(--line) 50%, var(--willow)); }
.btn:active { transform: translateY(1px) scale(.985); }
.btn:focus-visible, .ibtn:focus-visible, .field:focus-visible { outline: 2px solid color-mix(in srgb, var(--willow) 70%, transparent); outline-offset: 2px; }
.btn.primary { background: var(--willow-deep); border-color: var(--willow-deep); color: var(--paper3); }
.btn.primary:hover { background: color-mix(in srgb, var(--willow-deep) 85%, var(--ink)); }
:root.dark .btn.primary { color: #13120f; }
.btn.danger { background: var(--accent); border-color: var(--accent); color: #fff8ef; }
.btn.danger:hover { background: color-mix(in srgb, var(--accent) 85%, #000); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--sel); }
.btn.sm { min-height: 26px; padding: 0 10px; font-size: .92em; }
.btn[disabled], .ibtn[disabled] { opacity: .45; pointer-events: none; }
.ibtn {
  display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--ink2);
  transition: background var(--t), color var(--t), transform .08s; flex: none; font-size: 15px;
}
.ibtn:hover { background: var(--sel); color: var(--ink); }
.ibtn:active { transform: scale(.94); }
.ibtn.on { color: var(--willow-deep); background: color-mix(in srgb, var(--willow) 16%, transparent); }
.ibtn.on { background: color-mix(in srgb, var(--willow) 22%, transparent); color: var(--willow-deep); }
.ibtn svg { width: 18px; height: 18px; }
@media (pointer: coarse) { .ibtn { width: 40px; height: 40px; } .btn { min-height: 40px; } }

/* ---------- 输入 ---------- */
.field {
  width: 100%; min-height: 34px; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r-sm);
  background: color-mix(in srgb, var(--paper3) 85%, #fff); color: var(--ink); transition: border-color var(--t), box-shadow var(--t);
}
:root.dark .field { background: color-mix(in srgb, var(--paper3) 80%, #000); }
.field:focus { outline: none; border-color: var(--willow); box-shadow: 0 0 0 3px color-mix(in srgb, var(--willow) 22%, transparent); }
textarea.field { resize: vertical; line-height: 1.6; }
select.field { appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--ink3) 50%), linear-gradient(135deg, var(--ink3) 50%, transparent 50%); background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
input[type=range] { appearance: none; height: 22px; background: transparent; width: 100%; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--willow) var(--p, 50%), var(--line) var(--p, 50%)); }
input[type=range]::-webkit-slider-thumb { appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: var(--paper3); border: 2px solid var(--willow-deep); box-shadow: var(--shadow-sm); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--willow); }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--paper3); border: 2px solid var(--willow-deep); }
/* 开关：一枚小印 */
.switch { position: relative; width: 42px; height: 24px; flex: none; appearance: none; border-radius: 24px; background: color-mix(in srgb, var(--ink3) 45%, var(--line)); cursor: pointer; transition: background var(--t); margin: 0; }
.switch::after { content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--paper3); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform var(--t) var(--spring); }
.switch:checked { background: var(--willow-deep); }
.switch:checked::after { transform: translateX(18px); }
.seg { display: inline-flex; padding: 2px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--paper2) 70%, transparent); border: 1px solid var(--line); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 3px 12px; border-radius: calc(4px * var(--rk)); color: var(--ink2); min-height: 26px; transition: background var(--t), color var(--t); }
.seg button.on { background: var(--paper3); color: var(--ink); box-shadow: var(--shadow-sm); }
@media (pointer: coarse) { .seg button { min-height: 34px; } }

.kbd { display: inline-block; padding: 0 5px; min-width: 18px; text-align: center; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: calc(4px * var(--rk)); font: 11px/16px var(--font-mono); color: var(--ink3); }
.muted { color: var(--ink3); }
.spacer { flex: 1; }
.row { display: flex; align-items: center; gap: 8px; }
.hide { display: none !important; }
.spin { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--willow-deep); border-radius: 50%; animation: qs-spin .8s linear infinite; }
.seal-chip { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: calc(4px * var(--rk)); background: var(--accent); color: #fff6ea; font: 13px/1 var(--font-kai); }

/* 空状态：一行诗 + 一笔 */
.empty { display: grid; place-items: center; align-content: center; gap: 10px; padding: 40px 20px; color: var(--ink3); text-align: center; height: 100%; }
.empty .em-glyph { width: 64px; height: 64px; color: color-mix(in srgb, var(--ink3) 45%, transparent); }
.empty .em-poem { font: 15px/1.9 var(--font-kai); letter-spacing: .12em; }

/* ---------- 墨字 ---------- */
.ink { display: inline-block; width: 1em; height: 1em; flex: none; background: currentColor; vertical-align: -0.14em;
  -webkit-mask: var(--g) center / contain no-repeat; mask: var(--g) center / contain no-repeat; }
.inkw { display: inline-flex; align-items: center; gap: 0.02em; white-space: nowrap; }
.inkw .inkf { font-family: var(--font-kai, inherit); }
.inked > .ink, .inked > .inkf { width: 1.3em; height: 1.3em; margin: -0.15em; }
.inked > .inkf { display: inline-flex; align-items: center; justify-content: center; width: auto; height: auto; margin: 0; }
.inkw .ink { width: 1.18em; height: 1.18em; margin: -0.09em -0.02em; }
.tb-logo .lg { display: inline-flex; gap: 1px; font-size: 21px; }
.tb-logo .lg .ink { width: 1.15em; height: 1.15em; }
.tb-sub { opacity: .75; font-size: .92em; }
.em-glyph .ink, .em-glyph .inkf { width: 100%; height: 100%; font-size: inherit; }
.em-glyph .inkf { font: 52px/1 var(--font-kai); display: flex; align-items: center; justify-content: center; }
.sg-logo .ink { width: 46px; height: 46px; color: var(--ink); }
.win-title .tt .inkw { font-size: 17px; }
.tb-app .inkw { font-size: 16px; }
.fm-sh .inkw { font-size: 14px; opacity: .85; }
.sg-h .inkw { font-size: 1.15em; }
.cl-h .inkw { font-size: 1.1em; }
.inkbtn { width: auto !important; padding: 0 9px 0 7px !important; gap: 4px; display: inline-flex; align-items: center; }
.inkbtn .ink, .inkbtn .inkf { font-size: 17px; }
.inkbtn .ib-l { font-size: 12.5px; letter-spacing: .04em; white-space: nowrap; }
.inkbtn.on { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.compact .inkbtn .ib-l { display: none; }
.compact .inkbtn { padding: 0 7px !important; }

/* ── 10-shell.css ── */
/* ================= 外壳：桌面 / 顶栏 / 程序坞 / 窗口 / 三卷轴 ================= */
#desk { position: fixed; inset: 0; overflow: hidden; }
#wp { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ---------- 顶栏 ---------- */
#topbar {
  position: fixed; z-index: 60; top: 0; left: 0; right: 0; height: calc(var(--bar-h) + var(--safe-t)); padding: var(--safe-t) calc(10px + var(--safe-r)) 0 calc(10px + var(--safe-l));
  display: flex; align-items: center; gap: 4px; background: var(--bar); color: var(--bar-ink); font-size: 13px; letter-spacing: .04em;
  box-shadow: 0 1px 0 rgba(255,255,255,.04), 0 2px 12px rgba(0,0,0,.18);
}
#topbar .tb { display: flex; align-items: center; gap: 6px; height: calc(var(--bar-h) - 8px); padding: 0 9px; border: 0; border-radius: calc(6px * var(--rk)); background: none; color: inherit; white-space: nowrap; transition: background var(--t); }
#topbar .tb:hover, #topbar .tb.open { background: rgba(255,255,255,.09); }
.tb-logo { gap: 1px !important; padding-left: 4px !important; }
.tb-logo svg { width: 19px; height: 19px; }
.tb-logo .os { font: 600 10px/1 var(--font-sans); color: var(--gold); margin-left: 4px; letter-spacing: .1em; }
.tb-app { font-weight: 600; max-width: 30vw; overflow: hidden; text-overflow: ellipsis; }
.tb-greet { opacity: .62; font-size: 12.5px; }
.tb-cores { gap: 5px !important; }
.tb-cores i { width: 7px; height: 7px; border-radius: 50%; background: #6a6358; box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset; transition: background .4s; }
.tb-cores i.ok { background: #8fb07a; box-shadow: 0 0 6px rgba(143,176,122,.6); }
.tb-cores i.warn { background: #d4a85a; }
.tb-cores i.off { background: #6a6358; opacity: .5; }
.tb-time { font-variant-numeric: tabular-nums; font-family: var(--font-sans); font-weight: 500; letter-spacing: .02em; }
.tb-sc { opacity: .78; }
.tb-sc b { color: var(--gold); font-weight: 400; }
#topbar svg.ic { width: 15px; height: 15px; }

/* ---------- 桌面图标 ---------- */
#icons {
  position: absolute; top: calc(var(--bar-h) + var(--safe-t) + 14px); left: calc(14px + var(--safe-l)); right: calc(14px + var(--safe-r)); bottom: calc(var(--dock-h) + 30px + var(--safe-b));
  touch-action: none; -webkit-user-select: none; user-select: none;
}
#wp { touch-action: none; }
.dicon { position: absolute; width: var(--cw, calc(var(--icon, 64px) + 30px)); transition: left .22s var(--ease), top .22s var(--ease), background var(--t); -webkit-touch-callout: none; }
.dicon.moving { transition: none; pointer-events: none; z-index: 5; opacity: .88; }
.dicon .dot-gold { position: absolute; right: -3px; top: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 2px var(--paper3); }
.dicon { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 3px 4px; border-radius: calc(10px * var(--rk)); border: 1px solid transparent; touch-action: none; }
.dicon:hover { background: color-mix(in srgb, var(--paper3) 35%, transparent); }
.dicon.sel { background: color-mix(in srgb, var(--willow) 26%, transparent); border-color: color-mix(in srgb, var(--willow) 45%, transparent); }
.dicon.drop { background: color-mix(in srgb, var(--gold) 30%, transparent); transform: scale(1.04); }
.dicon .lbl { max-width: 100%; padding: 0 4px; font-size: 12.5px; line-height: 1.35; text-align: center; color: var(--ink); text-shadow: 0 0 4px var(--paper), 0 0 8px var(--paper), 0 0 2px var(--paper); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all; }
:root.dark .dicon .lbl { text-shadow: 0 1px 3px #000, 0 0 8px #000; }

/* 印：应用图标 = 一方朱文/白文印 */
.seal {
  --c: var(--accent); position: relative; display: grid; place-items: center; width: var(--sz, 52px); height: var(--sz, 52px); flex: none; border-radius: calc(var(--sz, 52px) * .22 * var(--rk));
  background: radial-gradient(120% 90% at 30% 20%, color-mix(in srgb, var(--c) 82%, #fff) 0%, var(--c) 55%, color-mix(in srgb, var(--c) 75%, #000) 100%);
  color: #fbf3e4; font: calc(var(--sz, 52px) * .5) / 1 var(--font-kai); text-shadow: 0 1px 1px rgba(0,0,0,.25);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 -2px 6px rgba(0,0,0,.18), 0 2px 6px rgba(40,25,10,.22);
}
.seal::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle at 70% 80%, rgba(255,255,255,.08), transparent 40%), repeating-radial-gradient(circle at 20% 30%, transparent 0 3px, rgba(0,0,0,.025) 3px 4px); pointer-events: none; }
.seal.file { --c: var(--paper3); color: var(--ink2); text-shadow: none; background: linear-gradient(160deg, var(--paper3), color-mix(in srgb, var(--paper2) 80%, var(--paper3))); box-shadow: inset 0 0 0 1px var(--line), 0 2px 5px rgba(40,25,10,.14); }
.seal.file .k { position: absolute; right: 8%; bottom: 7%; font: 600 calc(var(--sz, 52px) * .15)/1 var(--font-sans); color: var(--k, var(--willow-deep)); letter-spacing: 0; text-transform: uppercase; }
.seal.thumb { background-size: cover !important; background-position: center !important; }

/* ---------- 程序坞 ---------- */
#dock {
  position: fixed; z-index: 55; left: 50%; bottom: calc(10px + var(--safe-b)); transform: translateX(-50%);
  display: flex; align-items: flex-end; gap: 6px; padding: 7px 9px; border-radius: calc(18px * var(--rk)); background: var(--dock);
  border: 1px solid rgba(255,255,255,.08); box-shadow: 0 10px 40px rgba(0,0,0,.28); transition: transform .35s var(--ease), opacity .35s;
}
#dock.left { left: calc(10px + var(--safe-l)); bottom: auto; top: 50%; transform: translateY(-50%); flex-direction: column; align-items: flex-start; }
#dock.hidden { transform: translate(-50%, calc(100% + 20px)); }
#dock.left.hidden { transform: translate(calc(-100% - 20px), -50%); }
.dock-item { position: relative; width: 48px; height: 48px; display: grid; place-items: center; border: 0; padding: 0; background: none; transform-origin: 50% 100%; transition: transform .18s var(--ease); }
#dock.left .dock-item { transform-origin: 0 50%; }
.dock-item .seal { --sz: 44px; transition: transform .25s var(--spring), filter .2s; }
.dock-item:active .seal { transform: scale(.92); filter: brightness(.92); }
.dock-item::after { content: ''; position: absolute; bottom: -5px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--bar-ink); opacity: 0; transition: opacity .2s, width .2s, margin .2s; }
.dock-item.run::after { opacity: .75; }
.dock-item.run.focus::after { width: 14px; margin-left: -7px; border-radius: calc(3px * var(--rk)); background: var(--gold); opacity: 1; }
#dock.left .dock-item::after { bottom: auto; left: -6px; top: 50%; margin: -2px 0 0; }
/* 收起的窗口：印上压一卷小轴 */
.dock-item .minroll { position: absolute; left: 50%; top: -7px; width: 30px; height: 8px; margin-left: -15px; border-radius: calc(4px * var(--rk)); background: linear-gradient(180deg, #7a5f46, #3a2b1f); box-shadow: 0 1px 2px rgba(0,0,0,.4); opacity: 0; transform: scaleX(.3); transition: opacity .25s, transform .35s var(--spring); }
.dock-item .minroll::before, .dock-item .minroll::after { content: ''; position: absolute; top: -1px; width: 4px; height: 10px; border-radius: 2px; background: var(--c, var(--gold)); }
.dock-item .minroll::before { left: -3px; } .dock-item .minroll::after { right: -3px; }
.dock-item.min .minroll { opacity: 1; transform: none; }
.dock-sep { width: 1px; height: 36px; margin: 0 3px 6px; background: rgba(255,255,255,.14); align-self: center; }
#dock.left .dock-sep { width: 36px; height: 1px; margin: 3px 6px; }
.dock-tip { position: fixed; z-index: 2000; padding: 3px 10px; border-radius: calc(6px * var(--rk)); background: var(--bar); color: var(--bar-ink); font-size: 12.5px; pointer-events: none; white-space: nowrap; box-shadow: var(--shadow-sm); animation: qs-fade-in .12s; }

/* ---------- 窗口 ---------- */
#wins { position: absolute; inset: 0; pointer-events: none; }
.win {
  position: absolute; display: flex; flex-direction: column; min-width: 280px; min-height: 180px; pointer-events: auto;
  background: var(--paper3); color: var(--ink); border-radius: var(--r); border: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
  box-shadow: var(--shadow); transition: box-shadow .25s;
}
.win:not(.focused) { box-shadow: var(--shadow-sm); }
.win.max { border-radius: 0; border-width: 0; }
.win.snapped { border-radius: 0; }
.win.anim { transition: left .3s var(--ease), top .3s var(--ease), width .3s var(--ease), height .3s var(--ease), border-radius .3s, box-shadow .25s; }
.win-title {
  position: relative; flex: none; height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; touch-action: none;
  background: linear-gradient(180deg, color-mix(in srgb, var(--paper3) 92%, #fff), var(--paper3)); border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);

}

.win-title .tt { min-width: 0; max-width: calc(50% - 90px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; letter-spacing: .05em; color: var(--ink2); transition: color var(--t); }

.win:not(.focused) .win-title > .seal, .win:not(.focused) .win-title .tt { opacity: .7; }
.win-body { position: relative; flex: 1; min-height: 0; overflow: hidden; border-radius: 0 0 var(--r) var(--r); display: flex; flex-direction: column; }
.win.max .win-body { border-radius: 0; }
.win .rz { position: absolute; z-index: 6; touch-action: none; }
.rz.n { top: -4px; left: 12px; right: 12px; height: 8px; cursor: ns-resize; } .rz.s { bottom: -4px; left: 12px; right: 12px; height: 8px; cursor: ns-resize; }
.rz.e { right: -4px; top: 12px; bottom: 12px; width: 8px; cursor: ew-resize; } .rz.w { left: -4px; top: 12px; bottom: 12px; width: 8px; cursor: ew-resize; }
.rz.ne { right: -5px; top: -5px; width: 16px; height: 16px; cursor: nesw-resize; } .rz.nw { left: -5px; top: -5px; width: 16px; height: 16px; cursor: nwse-resize; }
.rz.se { right: -5px; bottom: -5px; width: 18px; height: 18px; cursor: nwse-resize; } .rz.sw { left: -5px; bottom: -5px; width: 16px; height: 16px; cursor: nesw-resize; }
.win.max .rz, .win.mobile .rz { display: none; }
.win .shield { position: absolute; inset: 0; z-index: 4; display: none; }

/* ---------- 三卷轴：收 · 开 · 合 ---------- */
.scrolls { position: absolute; left: 50%; top: 0; height: 100%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; z-index: 2; }
.scroll { --c: var(--ink2); --wood1: #4b3a2c; --wood2: #8a6c50; position: relative; display: flex; align-items: center; height: 100%; padding: 0 5px; border: 0; background: none; outline: none; }
.scroll[data-act=min] { --c: color-mix(in srgb, var(--ink2) 92%, var(--willow)); }
.scroll[data-act=max] { --c: var(--gold); }
.scroll[data-act=close] { --c: var(--accent); }
.scroll .rod { position: relative; width: 4px; height: 20px; border-radius: 2px; background: linear-gradient(90deg, var(--wood1), var(--wood2) 45%, var(--wood1)); box-shadow: 0 1px 1px rgba(0,0,0,.25); transition: transform .3s var(--ease-ink); z-index: 1; }
.scroll .rod::before, .scroll .rod::after { content: ''; position: absolute; left: -1.5px; width: 7px; height: 3.5px; border-radius: 1.5px; background: var(--c); box-shadow: 0 0 0 .5px rgba(0,0,0,.15) inset; }
.scroll .rod::before { top: -3px; } .scroll .rod::after { bottom: -3px; }

  position: relative; width: 3px; height: 17px; overflow: hidden; display: grid; place-items: center;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 30%, var(--paper3)) 0 1.5px, color-mix(in srgb, var(--paper3) 85%, #fff) 1.5px calc(100% - 1.5px), color-mix(in srgb, var(--c) 30%, var(--paper3)) calc(100% - 1.5px));
  box-shadow: inset 2px 0 3px -2px rgba(0,0,0,.3), inset -2px 0 3px -2px rgba(0,0,0,.3);
  transition: width .34s var(--ease-ink);
}
:root.dark .scroll .paper { background: linear-gradient(180deg, color-mix(in srgb, var(--c) 40%, #e9e1cf) 0 1.5px, #e9e1cf 1.5px calc(100% - 1.5px), color-mix(in srgb, var(--c) 40%, #e9e1cf) calc(100% - 1.5px)); }
.scroll .paper svg { width: 14px; height: 14px; color: var(--c); opacity: 0; transition: opacity .2s; flex: none; }
:root.dark .scroll .paper svg { color: color-mix(in srgb, var(--c) 70%, #1c1a17); }
.scrolls:hover .scroll .paper { width: 12px; }
.scrolls:hover .scroll .paper svg { opacity: .55; }
.scroll:hover .paper, .scroll:focus-visible .paper { width: 24px !important; }
.scroll:hover .paper svg, .scroll:focus-visible .paper svg { opacity: 1 !important; }
.scroll:focus-visible .rod { box-shadow: 0 0 0 2px color-mix(in srgb, var(--willow) 60%, transparent); }
.win:not(.focused) .scroll .rod::before, .win:not(.focused) .scroll .rod::after { background: color-mix(in srgb, var(--c) 45%, var(--line)); }
.scrolls[data-labels=always] .scroll .paper { width: 24px; } .scrolls[data-labels=always] .scroll .paper svg { opacity: 1; }
.scrolls[data-labels=never] .scroll:hover .paper { width: 10px !important; } .scrolls[data-labels=never] .scroll .paper svg { display: none; }
/* 按下：各自做自己的事 */
.scroll.do-min .paper { width: 0 !important; transition-duration: .22s; }
.scroll.do-min .rod.r { transform: translateX(-2px); }
.scroll.do-max .paper { width: 34px !important; }
.scroll.do-close .paper { width: 0 !important; transition-duration: .18s; }
.scroll.do-close .rod.l { transform: translateX(2px) rotate(-8deg); } .scroll.do-close .rod.r { transform: translateX(-2px) rotate(8deg); }
/* 未保存：合轴上悬一滴墨 */
.win.dirty .scroll[data-act=close]::after { content: ''; position: absolute; top: 5px; right: 1px; width: 6px; height: 6px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--accent); animation: qs-ink-pulse 2.4s ease-in-out infinite; }
@media (pointer: coarse) {
  .scrolls { gap: 2px; }
  .scroll { padding: 0 8px; }
  .scroll .rod { height: 24px; }
  .scroll .paper { width: 22px; height: 20px; }
  .scroll .paper svg { opacity: 1; width: 16px; height: 16px; }
}

/* 卷轴动效层：窗口开合时出现的两根轴 */
.rollfx { position: absolute; z-index: 9; pointer-events: none; }
.rollfx .rod { position: absolute; top: -7px; bottom: -7px; width: 12px; margin-left: -6px; border-radius: calc(6px * var(--rk)); background: linear-gradient(90deg, #2c2118, #7b604a 38%, #a3866a 50%, #4a382a 80%, #2c2118); box-shadow: 0 4px 14px rgba(0,0,0,.35); }
.rollfx .rod::before, .rollfx .rod::after { content: ''; position: absolute; left: -3px; right: -3px; height: 11px; border-radius: calc(3px * var(--rk)); background: linear-gradient(90deg, color-mix(in srgb, var(--c) 70%, #000), var(--c) 45%, color-mix(in srgb, var(--c) 60%, #000)); }
.rollfx .rod::before { top: -6px; } .rollfx .rod::after { bottom: -6px; }
.rollfx .rod.h { top: auto; left: -7px; right: -7px; bottom: auto; width: auto; height: 12px; margin: -6px 0 0; background: linear-gradient(180deg, #2c2118, #7b604a 38%, #a3866a 50%, #4a382a 80%, #2c2118); }
.rollfx .rod.h::before, .rollfx .rod.h::after { top: -3px; bottom: -3px; height: auto; width: 11px; left: auto; right: auto; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 70%, #000), var(--c) 45%, color-mix(in srgb, var(--c) 60%, #000)); }
.rollfx .rod.h::before { left: -6px; } .rollfx .rod.h::after { right: -6px; }

#snap { position: absolute; z-index: 40; pointer-events: none; border-radius: calc(12px * var(--rk)); border: 2px solid color-mix(in srgb, var(--willow) 70%, transparent); background: color-mix(in srgb, var(--willow-mist) 22%, transparent); backdrop-filter: blur(2px); opacity: 0; transition: all .16s var(--ease); }
#snap.on { opacity: 1; }

/* ---------- 菜单 ---------- */
.menu {
  position: fixed; z-index: 1500; min-width: 200px; max-width: 320px; max-height: calc(100vh - 20px); overflow: auto; padding: 5px;
  background: var(--glass); backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3);
  border: 1px solid color-mix(in srgb, var(--line) 80%, transparent); border-radius: calc(11px * var(--rk)); box-shadow: var(--shadow); animation: qs-rise .13s var(--ease); transform-origin: top left; font-size: 13.5px;
}

/* 菜单左列：楷体单字（默认）/ 小朱印 / 无 */

@keyframes qs-sheet { from { transform: translateY(30px); opacity: 0; } }

/* ---------- 提示 ---------- */
#toasts { position: fixed; z-index: 1600; left: 50%; bottom: calc(var(--dock-h) + 34px + var(--safe-b)); transform: translateX(-50%); display: flex; flex-direction: column-reverse; align-items: center; gap: 8px; pointer-events: none; width: max-content; max-width: 92vw; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 9px 12px 9px 14px; border-radius: calc(12px * var(--rk)); background: color-mix(in srgb, var(--bar) 94%, transparent); color: var(--bar-ink); box-shadow: 0 10px 30px rgba(0,0,0,.25); font-size: 13.5px; animation: qs-rise .2s var(--ease); max-width: 100%; }

.toast .tg { width: 8px; height: 8px; border-radius: 50%; background: var(--willow-mist); flex: none; }

/* 进度卡 */
#jobs { position: fixed; z-index: 1550; right: calc(14px + var(--safe-r)); bottom: calc(var(--dock-h) + 30px + var(--safe-b)); display: flex; flex-direction: column; gap: 8px; width: min(320px, calc(100vw - 28px)); }
.job { padding: 11px 13px; border-radius: calc(12px * var(--rk)); background: var(--glass); backdrop-filter: blur(18px); border: 1px solid var(--line); box-shadow: var(--shadow); animation: qs-rise .2s var(--ease); font-size: 13px; }
.job .jt { display: flex; gap: 8px; align-items: center; } .job .jt b { font-weight: 600; flex: 1; }
.job .jl { color: var(--ink3); font-size: 12px; margin: 3px 0 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job .jb { height: 4px; border-radius: calc(4px * var(--rk)); background: var(--line); overflow: hidden; }
.job .jb i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--willow), var(--willow-deep)); transition: width .2s; }

/* ---------- 对话框：一幅立轴自上而下展开 ---------- */
.modal-bg { position: fixed; inset: 0; z-index: 1700; display: grid; place-items: center; padding: 20px; background: rgba(20,16,12,.3); animation: qs-fade-in .18s; }
:root.dark .modal-bg { background: rgba(0,0,0,.5); }
.modal-bg.out { animation: qs-toast-out .16s forwards; }
.hscroll { position: relative; width: min(var(--w, 440px), 100%); filter: drop-shadow(0 18px 40px rgba(30,20,10,.3)); }
.hscroll > .rodbar { position: relative; z-index: 2; height: 12px; margin: 0 -10px; border-radius: calc(6px * var(--rk)); background: linear-gradient(180deg, #2c2118, #7b604a 38%, #a3866a 50%, #4a382a 80%, #2c2118); }
.hscroll > .rodbar::before, .hscroll > .rodbar::after { content: ''; position: absolute; top: -3px; bottom: -3px; width: 12px; border-radius: calc(3px * var(--rk)); background: linear-gradient(180deg, #8a6a30, var(--gold) 45%, #6a4f22); }
.hscroll > .rodbar::before { left: -6px; } .hscroll > .rodbar::after { right: -6px; }
.hscroll.danger > .rodbar::before, .hscroll.danger > .rodbar::after { background: linear-gradient(180deg, #7a2a20, var(--accent) 45%, #6a2018); }
.hscroll > .sheet {
  position: relative; z-index: 1; overflow: hidden; max-height: calc(100vh - 80px); display: flex; flex-direction: column;
  background: linear-gradient(90deg, color-mix(in srgb, var(--paper2) 60%, var(--paper3)) 0 10px, var(--paper3) 10px calc(100% - 10px), color-mix(in srgb, var(--paper2) 60%, var(--paper3)) calc(100% - 10px));
}

.dlg { position: relative; padding: 22px 28px 18px; overflow: auto; }

.dlg-b { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
.dlg-b .btn { min-width: 80px; }
.dlg-check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--ink2); }
.dlg-files { margin: 10px 0 0; padding: 8px 10px; max-height: 140px; overflow: auto; background: color-mix(in srgb, var(--paper2) 45%, transparent); border-radius: calc(6px * var(--rk)); font-size: 12.5px; color: var(--ink2); }

/* ---------- 寻：万物检索 ---------- */
.launcher { position: fixed; z-index: 1800; inset: 0; display: flex; justify-content: center; align-items: flex-start; padding: calc(12vh + var(--safe-t)) 14px 14px; background: rgba(20,16,12,.22); animation: qs-fade-in .15s; }
.launcher .lbox { width: min(640px, 100%); background: var(--glass); backdrop-filter: blur(26px) saturate(1.35); -webkit-backdrop-filter: blur(26px) saturate(1.35); border: 1px solid var(--line); border-radius: calc(16px * var(--rk)); box-shadow: var(--shadow); overflow: hidden; animation: qs-rise .18s var(--ease); }

.launcher .lit mark { background: none; color: var(--accent); }
.launcher .lfoot { display: flex; gap: 14px; padding: 7px 14px; font-size: 11.5px; color: var(--ink3); border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }

/* ---------- 弹出卡（时令 / 系统菜单） ---------- */
.pop { position: fixed; z-index: 1500; background: var(--glass); backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3); border: 1px solid var(--line); border-radius: calc(16px * var(--rk)); box-shadow: var(--shadow); animation: qs-rise .16s var(--ease); }
.shiling { width: 340px; padding: 16px 18px 18px; }

.shiling .sl-poem small { display: block; color: var(--ink3); font-size: 11.5px; letter-spacing: .05em; }

/* ---------- 卷帘（锁屏） ---------- */
#lock { position: fixed; inset: 0; z-index: 3000; display: grid; place-items: center; overflow: hidden; color: #f4ecdc; cursor: pointer; }
#lock .slats { position: absolute; inset: 0; display: flex; flex-direction: column; }
#lock .slat { flex: 1; background: linear-gradient(180deg, color-mix(in srgb, var(--bar) 92%, #6b5a40) 0 82%, color-mix(in srgb, var(--bar) 70%, #000) 82% 100%); transform-origin: top; transition: transform .5s var(--ease-ink); opacity: .96; }
#lock .lk { position: relative; text-align: center; transition: opacity .3s; }

#lock .lk-poem { margin-top: 34px; font: 17px/2 var(--font-kai); letter-spacing: .2em; opacity: .8; writing-mode: vertical-rl; height: 9em; display: inline-block; }
#lock .lk-hint { position: absolute; left: 0; right: 0; bottom: calc(40px + var(--safe-b)); text-align: center; font-size: 13px; letter-spacing: .3em; opacity: .55; animation: qs-ink-pulse 3s infinite; }
#lock.open .slat { transform: scaleY(0); }
#lock.open .lk { opacity: 0; }

/* ---------- 提示气泡 ---------- */
.tip { position: fixed; z-index: 2100; padding: 4px 9px; border-radius: calc(6px * var(--rk)); background: var(--bar); color: var(--bar-ink); font-size: 12px; line-height: 1.5; pointer-events: none; white-space: nowrap; box-shadow: var(--shadow-sm); animation: qs-fade-in .12s; }
.tip .kbd { border-color: rgba(255,255,255,.2); color: rgba(255,255,255,.65); margin-left: 6px; }

/* ---------- 手机 ---------- */
@media (max-width: 759px) {
  :root { --dock-h: 58px; }
  .tb-greet, .tb-jq, .tb-cores { display: none !important; }
  #dock { left: 8px; right: 8px; transform: none; justify-content: space-around; bottom: calc(6px + var(--safe-b)); padding: 6px; border-radius: calc(20px * var(--rk)); overflow-x: auto; }
  #dock.hidden { transform: translateY(calc(100% + 20px)); }
  #dock.left { left: 8px; top: auto; flex-direction: row; }
  .dock-sep { display: none; }
  #dock { gap: 2px; }
  #dock { justify-content: safe space-around; }
  .dock-item { width: auto; height: 46px; flex: 1 1 0; min-width: 28px; max-width: 52px; }
  .dock-item .seal { --sz: clamp(26px, calc((100vw - 40px) / max(8, var(--dn, 8)) - 5px), 44px); }
  .win.mobile { left: 0 !important; top: calc(var(--bar-h) + var(--safe-t)) !important; width: 100% !important; height: calc(100% - var(--bar-h) - var(--safe-t) - var(--dock-h) - 14px - var(--safe-b)) !important; border-radius: 0 0 calc(16px * var(--rk)) calc(16px * var(--rk)); border-width: 0; }
  .win.mobile .win-title { border-radius: 0; height: 46px; }

/* ================= 四核之一、二：HybridFS v4 =================

   结构：inode 节点（id + parent + name），改名 / 移动只改一条记录。
   写入顺序：新内容块落盘 → 单个事务切换指针 → 删除旧块。任何一步中断，最多留下「孤块」，体检时回收。 */

/* ---------- 内容层：OPFS（真实落盘） ---------- */
const OPFS_WORKER_SRC = `
onmessage = async (e) => {
  const { rid, path, name, blob } = e.data;
  try {
    let d = await navigator.storage.getDirectory();
    for (const p of path) d = await d.getDirectoryHandle(p, { create: true });
    const fh = await d.getFileHandle(name, { create: true });
    const h = await fh.createSyncAccessHandle();
    try {
      h.truncate(0); let off = 0; const CH = 4 << 20;
      while (off < blob.size) { const buf = new Uint8Array(await blob.slice(off, off + CH).arrayBuffer()); h.write(buf, { at: off }); off += buf.length; }
      h.flush();
    } finally { h.close(); }

  } catch (err) { postMessage({ rid, ok: false, err: (err && (err.name + ': ' + err.message)) || String(err) }); }

    try {

      const probe = new Blob(['青丝·' + Date.now()]);
      const fh = await this.dir.getFileHandle('.probe', { create: true });
      if (fh.createWritable) {

      }
      if (!this.writer) {
        try { await this._workerWrite([this.dirName], '.probe', probe); this.writer = 'worker'; }
        catch (e) { this.reason = 'OPFS 无法写入（' + (e.message || e) + '）'; return false; }
      }
      const back = await (await fh.getFile()).text();

      for (const cid of childIds(src.id)) { const c = N.get(cid); if (c && !c.partial) await _copyNode(c, nd.id, c.name, false, acc); }
      return nd;
    }
    const blob = await getContent(src);
    const c = await putContent(blob);
    const nf = { id: newId(), parent: destId, name, kind: 'file', mime: src.mime, ctime: now, mtime: src.mtime, ...c, ...(root ? { partial: true } : {}) };
    await meta.commit({ put: [nf] }); setNode(nf); acc.n++; acc.bytes += c.size;
    acc.onProgress && acc.onProgress(acc);

  }
  async function copy(ids, destId, { conflict = 'rename', onConflict, onProgress, perId } = {}) {
    if (isM(destId) || ids.some(isM)) return locked(() => mTransfer('copy', ids, destId, { conflict, onConflict, onProgress, perId }));
    return locked(async () => {
      const dest = N.get(destId); if (!dest || dest.kind !== 'dir') throw new FSError('ENOTDIR', '目标不是文件夹');
      await reconcile(destId);
      const out = [], acc = { n: 0, bytes: 0, onProgress }; let sticky = null;
      LS.set('fs.journal', { op: 'copy', at: Date.now() });
      try {
        for (const id of ids) {
          const n = N.get(id); if (!n) continue;
          if (n.kind === 'dir' && isUnder(destId, id)) throw new FSError('ELOOP', `不能把「${n.name}」复制进它自己里面`);
          let name = n.name, ex = childByName(destId, name);
          if (ex) {
            let pol = n.parent === destId ? 'rename' : ((perId && perId[id]) || sticky || conflict);
            if (pol === 'ask' && onConflict) { const r = await onConflict(n, ex); pol = r.action; if (r.all) sticky = pol; }
            if (pol === 'cancel') break;
            if (pol === 'skip') continue;
            if (pol === 'replace' && ex.id !== n.id && ex.kind === 'dir' && n.kind === 'dir') { await _copyMerge(n, ex, acc); out.push(ex.id); continue; }
            if (pol === 'replace' && ex.id !== n.id) await _toTrash(ex); else name = uniqueName(destId, name);
          }
          const c = await _copyNode(n, destId, name, true, acc);
          const fin = { ...N.get(c.id) }; delete fin.partial;      // 一次性转正
          await meta.commit({ put: [fin] }); setNode(fin); out.push(fin.id);
        }
      } finally { LS.remove('fs.journal'); }
      changed('copy', out, [destId]);
      return out;
    });
  }

  /* ---------- 公开：回收站 ---------- */
  async function _toTrash(n) {
    const nn = { ...n, parent: TRASH, trash: { at: Date.now(), from: n.parent, path: pathOf(n.id) } };
    await meta.commit({ put: [nn] }); setNode(nn);
    return nn;
  }
  async function remove(ids, { permanent = false } = {}) {
    return locked(async () => {
      const parents = [], done = [];
      for (const id of ids) {
        const n = N.get(id); if (!n || id === ROOT || id === TRASH) continue;
        if (isM(id)) {   // 挂载：挂载点本身 = 卸下；里面的东西 = 留副本进拾遗再删盘（或彻底删）
          if (id === MROOT) continue;
          parents.push(n.parent);
          if (n.parent === MROOT) await unmount(id); else if (permanent) await mUnlink(n); else await mToTrash(n);
          done.push(id); continue;
        }
        parents.push(n.parent);
        if (permanent || inTrash(id)) await _purge(id); else await _toTrash(n);
        done.push(id);
      }
      changed('remove', done, [...parents, TRASH]);
      return done;
    });
  }
  async function _purge(id) {
    const all = descendants(id).filter(x => N.has(x));
    const refs = all.flatMap(x => contentRefs(N.get(x)));
    LS.set('fs.journal', { op: 'purge', at: Date.now() });
    await meta.commit({ del: all });
    all.forEach(dropNode);
    await dropContent(refs);
    LS.remove('fs.journal');
  }
  async function restore(ids) {
    return locked(async () => {
      const out = [], parents = [TRASH];
      for (const id of ids) {
        const n = N.get(id); if (!n || n.parent !== TRASH) continue;
        let to = n.trash && N.get(n.trash.from);
        if (!to || to.kind !== 'dir' || inTrash(to.id)) {   // 原文件夹没了：按原路径重建
          const p = (n.trash?.path || '/' + n.name).replace(/\/[^/]+$/, '') || '/';
          to = (await _mkdirp(p.startsWith('/~拾遗') ? '/' : p)).dir;
        }
        if (isM(to.id)) { await mEnsure(to); const made = await mCopyIn(n, to, childByName(to.id, n.name) ? uniqueName(to.id, n.name) : n.name); await _purge(id); out.push(made.id); parents.push(to.id); continue; }
        await reconcile(to.id);
        const nn = { ...n, parent: to.id, name: childByName(to.id, n.name) ? uniqueName(to.id, n.name) : n.name }; delete nn.trash;
        await meta.commit({ put: [nn] }); setNode(nn); out.push(id); parents.push(to.id);
      }
      changed('restore', out, parents);
      return out;
    });
  }
  async function emptyTrash() { return remove(childIds(TRASH), { permanent: true }); }
  async function autoPurge() {
    const days = Prefs.get('trashDays'); if (!days) return;
    const old = childIds(TRASH).filter(id => { const n = N.get(id); return n && n.trash && Date.now() - n.trash.at > days * 864e5; });
    if (old.length) await remove(old, { permanent: true });
  }

  /* ---------- 公开：星标（钤印）、版本 ---------- */
  async function star(id, on) {
    const ids = (Array.isArray(id) ? id : [id]).filter(x => !isM(x));
    return locked(async () => {
      const put = [], ps = new Set();
      for (const x of ids) { const n = N.get(x); if (!n) continue; const nn = { ...n }; if (on) nn.star = true; else delete nn.star; put.push(nn); ps.add(n.parent); }
      if (!put.length) return; await meta.commit({ put }); put.forEach(setNode); changed('star', put.map(n => n.id), [...ps]);
    });
  }
  function versions(id) { const n = N.get(id); return n && n.ver ? n.ver.map((v, i) => ({ ...v, idx: i })) : []; }
  async function readVersion(id, idx) { const n = N.get(id); const v = n && n.ver && n.ver[idx]; if (!v) throw new FSError('ENOENT', '版本不存在'); return getContent({ ...v, name: n.name, mime: n.mime }); }
  async function restoreVersion(id, idx) {
    return locked(async () => {
      const n = N.get(id); const v = n && n.ver && n.ver[idx]; if (!v) throw new FSError('ENOENT', '版本不存在');
      const cur = { blob: n.blob, store: n.store, mirror: n.mirror, size: n.size, mtime: n.mtime, hash: n.hash };
      const ver = n.ver.slice(); ver.splice(idx, 1); ver.unshift(cur);
      const nn = { ...n, blob: v.blob, store: v.store, mirror: v.mirror, size: v.size, hash: v.hash, mtime: Date.now(), ver };
      await meta.commit({ put: [nn] }); setNode(nn); changed('write', [id], [n.parent]); return nn;
    });
  }
  async function dropVersions(id) {
    return locked(async () => { const n = N.get(id); if (!n || !n.ver) return; const refs = n.ver; const nn = { ...n }; delete nn.ver; await meta.commit({ put: [nn] }); setNode(nn); await dropContent(refs); changed('write', [id], [n.parent]); });
  }

  /* ---------- 公开：搜索 ---------- */
  function searchNames(q, { root = ROOT, limit = 500, kinds } = {}) {
    const t = q.trim().toLowerCase(); if (!t) return [];
    const out = []; const skipDot = !pathOf(root).includes('/.');  /* 点开头的隐藏夹（如 /.暂存）不进搜索，除非就在里面搜 */
    for (const id of descendants(root)) {
      const n = N.get(id); if (!n || id === ROOT || n.partial || inTrash(id)) continue;
      if (skipDot && pathOf(id).includes('/.')) continue;
      if (kinds && !kinds.includes(kindOf(n))) continue;
      if (n.name.toLowerCase().includes(t)) { out.push(n); if (out.length >= limit) break; }
    }
    return out;
  }
  async function searchContent(q, { root = ROOT, limit = 200, onProgress, signal } = {}) {
    const t = q.trim().toLowerCase(); if (!t) return [];
    const files = descendants(root).map(id => N.get(id)).filter(n => n && n.kind === 'file' && !n.partial && !inTrash(n.id) && isTextKind(kindOf(n)) && n.size <= 2 * 1024 * 1024 && (pathOf(root).includes('/.') || !pathOf(n.id).includes('/.')));
    const out = []; let i = 0;
    for (const n of files) {
      if (signal && signal.aborted) break;
      i++; if (onProgress && i % 20 === 0) onProgress(i, files.length);
      try { const txt = await read(n, 'text'); const at = txt.toLowerCase().indexOf(t); if (at >= 0) { out.push({ node: n, at, snippet: txt.slice(Math.max(0, at - 24), at + t.length + 40).replace(/\s+/g, ' ') }); if (out.length >= limit) break; } } catch (e) { }
    }
    return out;
  }

  /* ---------- 公开：统计 ---------- */
  function treeSize(id) { let s = 0, f = 0, d = 0; for (const x of descendants(id)) { const n = N.get(x); if (!n || x === id) continue; if (n.kind === 'file') { s += n.size || 0; f++; } else d++; } return { size: s, files: f, dirs: d }; }
  async function stats() {
    const st = { files: 0, dirs: 0, bytes: 0, versions: 0, verBytes: 0, trashItems: childIds(TRASH).length, trashBytes: 0, byKind: {}, byStore: { opfs: 0, idb: 0 }, storeKind: { opfs: {}, idb: {} }, mirrored: 0, mirrorBytes: 0, nodes: N.size };
    for (const n of N.values()) {
      if (n.id === ROOT || n.id === TRASH || n.partial || n.mount) continue;
      const tr = inTrash(n.id);
      if (n.kind === 'dir') { if (!tr) st.dirs++; continue; }
      if (tr) { st.trashBytes += n.size || 0; continue; }
      st.files++; st.bytes += n.size || 0;
      const k = kindOf(n); st.byKind[k] = (st.byKind[k] || 0) + (n.size || 0);
      st.byStore[n.store] = (st.byStore[n.store] || 0) + 1;
      const sk = st.storeKind[n.store] || (st.storeKind[n.store] = {}); sk[k] = (sk[k] || 0) + (n.size || 0);
      if (n.mirror) { st.mirrored++; st.mirrorBytes += n.size || 0; }
      for (const v of n.ver || []) { st.versions++; st.verBytes += v.size || 0; }
    }
    try { st.quota = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null; } catch (e) { st.quota = null; }
    return st;
  }

  /* ---------- 公开：体检（fsck）与回收孤块 ---------- */
  async function fsck(o) { try { return await _fsck(o); } finally { mReattach(); } }   /* 体检以数据库为准重建索引，挂载节点事后挂回 */
  async function _fsck({ deep = false, repair = true, onProgress } = {}) {
    return locked(async () => {
      const t0 = performance.now();
      const rep = { checked: 0, orphanNodes: 0, cycles: 0, dupNames: 0, partial: 0, missing: 0, healed: 0, corrupt: 0, orphanBlobs: 0, freed: 0, mirrorFixed: 0, notes: [] };
      // 1. 从数据库重新读一遍，以数据库为准
      const rows = await meta.getAll(); N.clear(); K.clear(); rows.forEach(setNode);
      const all = [...N.values()].filter(n => n.id !== ROOT && n.id !== TRASH);
      let rescue = null;
      const rescueDir = async () => { if (rescue) return rescue; rescue = childByName(ROOT, '拾回') || null; if (!rescue) { const now = Date.now(); rescue = { id: newId(), parent: ROOT, name: '拾回', kind: 'dir', ctime: now, mtime: now }; await meta.commit({ put: [rescue] }); setNode(rescue); } return rescue; };
      // 2. 半成品（复制 / 导入中断）
      for (const n of all) if (n.partial && N.has(n.id)) { rep.partial++; if (repair) await _purge(n.id); }
      // 3. 父节点丢失、环
      for (const n of [...N.values()]) {
        if (n.id === ROOT || n.id === TRASH) continue;
        let p = N.get(n.parent), ok = !!p, g = 0, cur = n;
        while (ok && cur.id !== ROOT && cur.id !== TRASH && g++ < 512) { cur = N.get(cur.parent); if (!cur) ok = false; }
        if (g >= 512) { rep.cycles++; ok = false; }
        if (!ok) { rep.orphanNodes++; if (repair) { const r = await rescueDir(); const nn = { ...n, parent: r.id, name: uniqueName(r.id, n.name) }; delete nn.trash; await meta.commit({ put: [nn] }); setNode(nn); } }
      }
      // 4. 同名冲突
      const seen = new Map();
      for (const n of N.values()) {
        if (!n.parent || n.parent === TRASH) continue;
        const k = n.parent + '\u0000' + n.name;
        if (seen.has(k)) { rep.dupNames++; if (repair) { const nn = { ...n, name: uniqueName(n.parent, n.name + ' 重名') }; await meta.commit({ put: [nn] }); setNode(nn); } }
        else seen.set(k, n.id);
      }
      // 5. 内容块是否存在 / 是否完整
      const files = [...N.values()].filter(n => n.kind === 'file');
      const refd = new Set(); let i = 0;
      for (const n of files) {
        i++; if (onProgress && i % 10 === 0) onProgress(i, files.length);
        rep.checked++;
        for (const r of contentRefs(n)) if (r.blob) refd.add(r.blob);
        if (!n.blob) continue;
        let okSize = n.store === 'opfs' && opfs ? (await opfs.size(n.blob)) === n.size : n.store === 'idb' ? (await meta.getBlob(n.blob))?.size === n.size : false;
        if (!okSize) {
          const m = await meta.getBlob(n.blob);
          if (m && m.size === n.size && n.store === 'opfs' && opfs) { if (repair) { await opfs.put(n.blob, m); } rep.healed++; continue; }
          if (n.store === 'opfs' && !opfs) { const m2 = m; if (m2 && m2.size === n.size) { if (repair) { const nn = { ...n, store: 'idb', mirror: false }; await meta.commit({ put: [nn] }); setNode(nn); } rep.healed++; continue; } }
          rep.missing++; rep.notes.push(`内容丢失：${pathOf(n.id)}`);
          continue;
        }
        if (deep && n.hash && n.size <= 64 * 1024 * 1024) {
          try { const b = await getContent(n); const hx = await sha256Hex(await b.arrayBuffer()); if (hx !== n.hash) { rep.corrupt++; rep.notes.push(`内容校验不符：${pathOf(n.id)}`); } } catch (e) { }
        }
        if (n.mirror && n.store === 'opfs' && !(await meta.hasBlob(n.blob))) { rep.mirrorFixed++; if (repair) { try { await meta.putBlob(n.blob, await getContent(n)); } catch (e) { } } }
      }
      // 6. 孤块回收
      if (repair) {
        const orphanIdb = (await meta.blobKeys()).filter(k => !refd.has(k));
        rep.orphanBlobs += orphanIdb.length; await meta.delBlobs(orphanIdb);
        if (opfs) { for (const k of await opfs.keys()) if (!refd.has(k)) { rep.freed += Math.max(0, await opfs.size(k)); rep.orphanBlobs++; await opfs.del(k); } }
      }
      rep.ms = Math.round(performance.now() - t0); rep.at = Date.now();
      info.lastFsck = rep; LS.set('fs.lastFsck', rep);
      ev.emit('change', { type: 'fsck', ids: [], parents: [], local: true });
      return rep;
    });
  }

  /* ---------- 批量：内容块已落盘，镜像与节点按批一次提交 ---------- */
  const newBatch = () => ({ nodes: [], blobs: [], drop: [], fresh: [], bytes: 0 });
  async function flushBatch(bt) {
    if (!bt.nodes.length && !bt.blobs.length) return;
    try { await meta.putBlobs(bt.blobs); await meta.commit({ put: bt.nodes }); }
    catch (e) {
      // 提交失败：内存索引恢复成数据库里的样子，丢掉刚写的内容块
      const ids = bt.nodes.map(n => n.id); const rows = await meta.getNodes(ids).catch(() => ids.map(() => null));
      rows.forEach((r, i) => r ? setNode(r) : dropNode(ids[i]));
      await dropContent(bt.fresh);
      throw e && e.name === 'QuotaExceededError' ? new FSError('EQUOTA', '存储空间不足') : new FSError('EIO', '批量保存失败：' + (e.message || e));
    }
    await dropContent(bt.drop);
    Object.assign(bt, newBatch());
  }

  /* ---------- 公开：批量写入（导入 / 上传用） ---------- */
  /** items: [{path:'a/b.txt', data:Blob, mtime}]（相对 destId）；返回 {ok, skipped, failed} */
  async function importItems(destId, items, { conflict = 'rename', onConflict, onProgress, wrap } = {}) {
    if (isM(destId)) return locked(() => mImport(destId, items, { conflict, onConflict, onProgress, wrap }));
    return locked(async () => {
      let base = N.get(destId); if (!base || base.kind !== 'dir') throw new FSError('ENOTDIR', '目标不是文件夹');
      const res = { ok: 0, skipped: 0, failed: [], bytes: 0, roots: [] };
      let sticky = null, holder = null;
      LS.set('fs.journal', { op: 'import', at: Date.now() });
      try {
        if (wrap) {   // 整体放进一个新文件夹：先建隐藏的半成品，最后转正
          await reconcile(base.id);
          const now = Date.now(); holder = { id: newId(), parent: base.id, name: uniqueName(base.id, validName(wrap)), kind: 'dir', ctime: now, mtime: now, partial: true };
          await meta.commit({ put: [holder] }); setNode(holder); base = holder;
        }
        const dirCache = new Map([['', base]]);
        const ensureDir = async rel => {
          if (dirCache.has(rel)) return dirCache.get(rel);
          const parts = rel.split('/'); const name = validName(parts.pop()); const parent = await ensureDir(parts.join('/'));
          await reconcile(parent.id);
          let d = childByName(parent.id, name);
          if (d && d.kind !== 'dir') d = null;
          if (!d) { const now = Date.now(); d = { id: newId(), parent: parent.id, name: childByName(parent.id, name) ? uniqueName(parent.id, name) : name, kind: 'dir', ctime: now, mtime: now }; await meta.commit({ put: [d] }); setNode(d); if (parent === base) res.roots.push(d.id); }
          dirCache.set(rel, d); return d;
        };
        let i = 0; const bt = newBatch();
        for (const it of items) {
          i++;
          if (bt.nodes.length >= 100 || bt.bytes >= 32 << 20) await flushBatch(bt);
          try {
            const parts = it.path.split('/').filter(Boolean); if (!parts.length) continue;
            if (it.dir) { await ensureDir(parts.join('/')); continue; }
            const name = parts.pop(); const dir = await ensureDir(parts.join('/'));
            let pol = conflict;
            const ex = childByName(dir.id, name);
            if (ex) { pol = sticky || conflict; if (pol === 'ask' && onConflict) { const r = await onConflict({ name, size: it.data.size, mtime: it.mtime }, ex); pol = r.action; if (r.all) sticky = pol; } }
            if (pol === 'cancel') { res.cancelled = true; break; }
            const r = await _writeInto(dir, name, it.data, { conflict: pol === 'ask' ? 'rename' : pol, mtime: it.mtime, ctime: it.ctime, version: true, star: it.star, batch: bt });
            if (r.skipped) res.skipped++; else { res.ok++; res.bytes += it.data.size; if (dir === base && r.created) res.roots.push(r.node.id); }
          } catch (e) { res.failed.push({ path: it.path, err: e.message || String(e) }); if (e.code === 'EQUOTA') break; }
          if (onProgress) onProgress(i, items.length, it.path);
        }
        await flushBatch(bt);
        if (holder) { const fin = { ...N.get(holder.id) }; delete fin.partial; await meta.commit({ put: [fin] }); setNode(fin); res.roots = [fin.id]; }
      } finally { LS.remove('fs.journal'); }
      changed('import', res.roots, [destId]);
      return res;
    });
  }

  /* ---------- 挂载：本地文件夹（File System Access API） ----------
     挂进来的节点只活在内存索引里（id 以 m: 开头），绝不写进数据库；
     读写直接落到磁盘：写入走 createWritable（先写替身文件，关上时原子替换，写坏不伤原件）。
     手机等没有目录选择器的浏览器：用 webkitdirectory 做一份只读快照。 */
  const MROOT = 'm:';
  const isM = id => typeof id === 'string' && id.startsWith('m:');
  const MH = new Map();      // id -> FileSystemHandle | File（只读快照）
  const MN = new Map();      // id -> 节点（体检清空索引后据此挂回）
  const mScanP = new Map();  // dirId -> 进行中的扫描
  const mSeen = new Map();   // dirId -> 上次扫描时间
  const M_TRASH_MAX = 256 * 1024 * 1024;
  function mSet(n) { MN.set(n.id, n); setNode(n); return n; }
  function mDrop(id) { for (const x of descendants(id)) { MN.delete(x); MH.delete(x); mSeen.delete(x); dropNode(x); } }
  function mReattach() { for (const n of MN.values()) setNode(n); }
  function mRootOf(id) { let n = N.get(id), g = 0; while (n && n.parent !== MROOT && g++ < 512) n = N.get(n.parent); return n && n.parent === MROOT ? n : null; }
  function mCheckW(id) {
    if (id === MROOT) throw new FSError('EPERM', '挂载区本身不能放东西，请进到某个挂载的文件夹里');
    const r = mRootOf(id); if (!r) throw new FSError('ENOENT', '挂载点不见了');
    if (r.lost) throw new FSError('EPERM', `「${r.name}」的授权已失效，请在书阁里点「重新授权」`);
    if (r.ro) throw new FSError('EROFS', `「${r.name}」是只读快照（这个浏览器不能写回本地文件夹）`);
  }
  function mErr(e, n) {
    if (e instanceof FSError) return e;
    const nm = e && e.name;
    if (nm === 'NotAllowedError' || nm === 'SecurityError') { const r = n && mRootOf(n.id); if (r && !r.lost) { mSet({ ...r, lost: true }); ev.emit('change', { type: 'mount', ids: [r.id], parents: [MROOT], local: true }); } return new FSError('EPERM', '本地文件夹的授权已失效，请重新授权'); }
    if (nm === 'NotFoundError') { if (n && N.has(n.id)) { const p = n.parent; mDrop(n.id); ev.emit('change', { type: 'remove', ids: [n.id], parents: [p], local: true }); } return new FSError('ENOENT', '本地文件已经不在了（可能在别处被删或改名）'); }
    if (nm === 'QuotaExceededError') return new FSError('EQUOTA', '磁盘空间不足');
    if (nm === 'NoModificationAllowedError' || nm === 'InvalidStateError') return new FSError('EBUSY', '文件正被别的程序占用，稍后再试');
    return new FSError('EIO', '本地读写出错：' + (e && e.message || e));
  }
  function mEnsureRoot() {

/* ── 12-ink.js ── */
/* ================= 墨字：把骨架交给毛笔，写成有墨韵的字 =================
   每一笔单独写在一层上再叠下来——交叠处墨更浓（真墨就是这样），绝不会发白；
   起笔顿处略重，长撇长捺的尾巴带一点飞白，边缘洇开一圈淡墨。
   成字缓存成蒙版（mask），颜色跟随 currentColor，换主题不必重写。
   偏好 glyphStyle：'ink'（墨字，默认）/ 'font'（系统字体）。 */
const Ink = (() => {
  const NV = 91;
  const val = c => { const k = c.charCodeAt(0); return k - 35 - (k > 92 ? 1 : 0); };
  const decoded = new Map();
  function strokes(ch) {
    if (GLYPHS[ch]) { if (!decoded.has(ch)) decoded.set(ch, GLYPHS[ch].map(st => st.map(([x, y, w]) => [x, y, w * 0.86]))); return decoded.get(ch); }
    if (decoded.has(ch)) return decoded.get(ch);
    const p = typeof GLYPH_PACK !== 'undefined' && GLYPH_PACK[ch]; if (!p) return null;
    const st = p.split(' ').map(s => { const P = []; for (let i = 0; i + 2 < s.length; i += 3) P.push([val(s[i]) / (NV - 1) * 104 - 2, val(s[i + 1]) / (NV - 1) * 104 - 2, val(s[i + 2]) / 4 * 1.15]); return P; });
    decoded.set(ch, st); return st;
  }
  const has = ch => !!(GLYPHS[ch] || (typeof GLYPH_PACK !== 'undefined' && GLYPH_PACK[ch]));
  const on = () => Prefs.get('glyphStyle') !== 'font';

  let scratch = null;
  const canvas = (w, hgt) => { const c = document.createElement('canvas'); c.width = w; c.height = hgt; return c; };
  const BUCKETS = [24, 32, 40, 48, 64, 80, 96, 128, 160, 200, 256, 320];
  const bucket = px => BUCKETS.find(b => b >= px) || 320;
  let canFilter = null;

  /** 把一个字写到 px×px 的画布（黑墨，透明底） */
  function paint(ch, px, { bleed = true, dry = true, tone = true, css = px } = {}) {
    let st = strokes(ch); if (!st) return null;
    // 小字加粗：按屏上的 CSS 尺寸判断（手机高 DPR 下同样加粗），细笔在小号里不至于发虚
    const boost = css <= 18 ? 1.42 : css <= 26 ? 1.3 : css <= 40 ? 1.16 : css <= 56 ? 1.06 : 1;
    if (boost !== 1) st = st.map(s => s.map(([x, y, w]) => [x, y, w * boost]));
    const out = canvas(px, px), x = out.getContext('2d');
    if (!scratch || scratch.width < px) scratch = canvas(px, px);
    const sx = scratch.getContext('2d');
    const sc = px / 108, tiny = px < 30, big = px >= 72;
    const R = rng(ch.codePointAt(0) * 977 + 13);
    st.forEach((s, i) => {
      sx.setTransform(1, 0, 0, 1, 0, 0); sx.globalCompositeOperation = 'source-over'; sx.clearRect(0, 0, px, px);
      sx.setTransform(sc, 0, 0, sc, 4 * sc, 4 * sc);
      sx.fillStyle = sx.strokeStyle = '#000';
      // 1) 轮廓：起笔顿、收笔锋
      const poly = Brush.strokePolygon(s, { seed: ch.charCodeAt(0) * 31 + i });
      sx.beginPath(); poly.forEach((p, k) => k ? sx.lineTo(p[0], p[1]) : sx.moveTo(p[0], p[1])); sx.closePath(); sx.fill();
      // 2) 中线逐段描一遍：急转弯处轮廓自交留下的空洞，在这里全部补实
      const S = Brush.spline(s.map(([a, b, w]) => [a, b, w * 0.86 * 0.96]), 1.2);
      sx.lineCap = 'round'; sx.lineJoin = 'round';
      const groups = new Map();
      for (let k = 1; k < S.length; k++) { const w = Math.round((S[k - 1].w + S[k].w) * 4) / 4; let g = groups.get(w); if (!g) groups.set(w, g = new Path2D()); g.moveTo(S[k - 1].x, S[k - 1].y); g.lineTo(S[k].x, S[k].y); }
      for (const [w, g] of groups) { sx.lineWidth = w; sx.stroke(g); }
      // 3) 飞白：长而出锋的笔，尾段有几缕干笔丝
      let L = 0; for (let k = 1; k < S.length; k++) L += Math.hypot(S[k].x - S[k - 1].x, S[k].y - S[k - 1].y);
      const wMax = Math.max(...S.map(p => p.w)), wEnd = S[S.length - 1].w;
      if (dry && !tiny && L > 34 && (wEnd < wMax * 0.6 || L > 62)) {
        sx.globalCompositeOperation = 'destination-out';
        const n = big ? 7 : 4, f0 = wEnd < wMax * 0.6 ? 0.5 : 0.72;
        for (let q = 0; q < n; q++) {
          const o = (R() * 2 - 1) * 0.78, start = Math.floor(S.length * (f0 + R() * 0.22)), a = (big ? 0.55 : 0.4) * (0.5 + R() * 0.5);
          sx.lineWidth = Math.max(0.35, (big ? 0.55 : 0.75) * (0.5 + R())); sx.strokeStyle = `rgba(0,0,0,${a.toFixed(2)})`;
          sx.setLineDash([2 + R() * 9, 0.6 + R() * 2.5]); sx.beginPath();
          for (let k = start; k < S.length; k++) {
            const a0 = S[Math.max(0, k - 1)], a1 = S[Math.min(S.length - 1, k + 1)];
            let tx = a1.x - a0.x, ty = a1.y - a0.y; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
            const px2 = S[k].x - ty * S[k].w * o, py2 = S[k].y + tx * S[k].w * o;
            k === start ? sx.moveTo(px2, py2) : sx.lineTo(px2, py2);
          }
          sx.stroke();
        }
        sx.setLineDash([]); sx.globalCompositeOperation = 'source-over';
      }
      // 4) 叠到成字上：每笔墨色略有浓淡
      x.globalAlpha = tone && !tiny ? 0.84 + R() * 0.12 : 1;
      x.drawImage(scratch, 0, 0, px, px, 0, 0, px, px);
      // 5) 起笔顿处墨重一些
      if (tone && !tiny) {
        x.save(); x.setTransform(sc, 0, 0, sc, 4 * sc, 4 * sc); x.globalAlpha = 0.28; x.fillStyle = '#000';
        const p0 = S[0]; x.beginPath(); x.arc(p0.x, p0.y, p0.w * 1.05, 0, Math.PI * 2); x.fill();
        x.restore();
      }
    });
    x.globalAlpha = 1;
    if (!bleed || tiny) return out;
    // 6) 洇：底下垫一层模糊的淡墨
    if (canFilter === null) { canFilter = 'filter' in x; }
    const fin = canvas(px, px), f = fin.getContext('2d');
    if (canFilter) { f.filter = `blur(${Math.max(0.6, px * 0.011).toFixed(2)}px)`; f.globalAlpha = 0.42; f.drawImage(out, 0, 0); f.filter = 'none'; f.globalAlpha = 1; }
    f.drawImage(out, 0, 0);
    // 7) 纸纹：大字上撒一点极细的透白
    if (big) {
      f.globalCompositeOperation = 'destination-out'; const N = px * px / 90;
      for (let k = 0; k < N; k++) { f.globalAlpha = 0.05 + R() * 0.12; f.fillRect(R() * px, R() * px, 1, 1); }
      f.globalAlpha = 1; f.globalCompositeOperation = 'source-over';
    }
    return fin;
  }

  const urls = new Map();
  function url(ch, size = 32) {
    const px = bucket(Math.ceil(size * Math.min(3, devicePixelRatio || 1)));
    const cb = size <= 18 ? 18 : size <= 26 ? 26 : size <= 40 ? 40 : size <= 56 ? 56 : 99;
    const key = ch + '|' + px + '|' + cb;
    let u = urls.get(key);
    if (u === undefined) { const c = paint(ch, px, { css: cb }); u = c ? c.toDataURL('image/png') : null; urls.set(key, u); }
    return u;
  }

  /** 一个墨字元素；没有骨架的字、或偏好为系统字体时退回文字 */
  function glyph(ch, size = 32, cls = '') {
    ch = [...String(ch || '')][0] || '';
    if (on() && has(ch)) {
      const u = url(ch, size);
      if (u) return h('i.ink' + cls, { 'aria-hidden': 'true', dataset: { ink: ch, isz: size }, style: { '--g': `url(${u})` } });
    }
    return h('span.inkf' + cls, { text: ch, dataset: { ink: ch, isz: size } });
  }
  /** 一串字：能写的写成墨字，其余仍用字体 */
  function word(text, size = 24, cls = '') {
    text = String(text || '');
    const w = h('span.inkw' + cls, { 'aria-label': text, dataset: { inkw: text, isz: size } });
    if (!on()) { w.textContent = text; w.classList.add('plain'); return w; }
    for (const ch of text) w.append(has(ch) ? glyph(ch, size) : h('span.inkf', { text: ch }));
    return w;
  }
  /** 换了偏好：把页面上所有墨字重写一遍 */
  function refresh(root = document) {
    root.querySelectorAll('[data-inkw]').forEach(e => { if (!e.parentNode) return; const n = word(e.dataset.inkw, +e.dataset.isz || 24, [...e.classList].filter(c => c !== 'inkw' && c !== 'plain').map(c => '.' + c).join('')); e.replaceWith(n); });
    root.querySelectorAll('[data-ink]').forEach(e => { if (!e.parentNode || e.closest('[data-inkw]')) return; const n = glyph(e.dataset.ink, +e.dataset.isz || 32, [...e.classList].filter(c => c !== 'ink' && c !== 'inkf').map(c => '.' + c).join('')); e.replaceWith(n); });
  }
  /** 印章里的字：.seal 元素 → 墨字 */
  function seal(el, ch, size) { el.replaceChildren(glyph(ch, size || 40)); el.dataset.g = ch; return el; }
  return { strokes, has, paint, url, glyph, word, refresh, seal, get on() { return on(); } };
})();

/* ── 14-inkart.js ── */
/* ================= 墨绘：仓廪四仓的水墨小品 =================
   不是图表，是画：柜、簿、砚、笺都按真实器物的样子用画布一笔笔画出来，
   数据就藏在画里——抽屉拉出多少、账上墨线多长、砚里墨有多少、笺上写了几个字。
   主题变了会重画；画布按设备像素比绘制，手机上同样清晰。 */
const InkArt = (() => {
  const hasFilter = (() => { try { return 'filter' in document.createElement('canvas').getContext('2d'); } catch { return false; } })();
  const dpr = () => Math.min(2, devicePixelRatio || 1);

/* ---------- 缩略图（内存 LRU） ---------- */
const Thumbs = (() => {
  const cache = new Map(), MAX = 300, pending = new Map();
  async function make(n) {
    if (kindOf(n) === 'ink') { const j = JSON.parse(await FS.read(n, 'text')); return j.thumb ? URL.createObjectURL(await (await fetch(j.thumb)).blob()) : null; }
    const b = await FS.read(n);
    if (/svg/.test(n.mime || '')) return URL.createObjectURL(b);
    const bmp = await createImageBitmap(b).catch(() => null); if (!bmp) return null;
    const s = 200 / Math.max(bmp.width, bmp.height), w = Math.max(1, Math.round(bmp.width * Math.min(1, s))), hh = Math.max(1, Math.round(bmp.height * Math.min(1, s)));
    const c = new OffscreenCanvas(w, hh); c.getContext('2d').drawImage(bmp, 0, 0, w, hh); bmp.close();
    return URL.createObjectURL(await c.convertToBlob({ type: 'image/webp', quality: 0.82 }));
  }
  function can(n) { const k = kindOf(n); return (k === 'image' && n.size < 25 * 1024 * 1024) || (k === 'ink' && n.size < 40 * 1024 * 1024); }
  function get(n) {
    const key = n.id + ':' + n.blob;
    if (cache.has(key)) { const v = cache.get(key); cache.delete(key); cache.set(key, v); return Promise.resolve(v); }
    if (pending.has(key)) return pending.get(key);
    const p = make(n).catch(() => null).then(u => { pending.delete(key); if (u) { cache.set(key, u); if (cache.size > MAX) { const [k, v] = cache.entries().next().value; URL.revokeObjectURL(v); cache.delete(k); } } return u; });
    pending.set(key, p); return p;
  }
  return { get, can };
})();

/* ---------- 时令：二十四节气与十二时辰 ---------- */
const Shiling = (() => {
  let el = null;
  function wheel() {
    const now = new Date(), j = jieqi(now), sc = shichen(now), lon = sunLongitude(now.getTime());
    const R1 = 132, R2 = 98, R3 = 62, C = 150; let s = `<svg class="wheel" viewBox="0 0 300 300">`;
    s += `<circle cx="${C}" cy="${C}" r="${R1 + 8}" fill="none" stroke="var(--line)" stroke-width=".8"/><circle cx="${C}" cy="${C}" r="${R2 + 10}" fill="none" stroke="var(--line)" stroke-width=".6"/><circle cx="${C}" cy="${C}" r="${R3 + 8}" fill="none" stroke="var(--line)" stroke-width=".6"/>`;
    // 节气环：春分在右（0°），按黄经逆时针
    JIEQI.forEach((name, i) => {
      const a = -(i * 15) * Math.PI / 180, x = C + Math.cos(a) * R1, y = C + Math.sin(a) * R1, cur = name === j.name;
      const season = SEASON_OF(i), col = { 春: 'var(--willow-deep)', 夏: 'var(--jade)', 秋: 'var(--rust)', 冬: 'var(--ink3)' }[season];

      const tx = C + Math.cos(a) * (R2 + 10), ty = C + Math.sin(a) * (R2 + 10); s += `<circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="1.4" fill="var(--ink3)" opacity=".5"/>`;
    });

    });

    s += `<circle cx="${C}" cy="${C}" r="26" fill="var(--paper3)" stroke="var(--line)"/><text x="${C}" y="${C - 3}" text-anchor="middle" dominant-baseline="central" font-size="20" fill="var(--ink)" style="font-family:var(--font-kai)">${sc.name}</text><text x="${C}" y="${C + 15}" text-anchor="middle" font-size="7.5" fill="var(--ink3)" style="font-family:var(--font-kai)">${sc.note}</text>`;
    return s + '</svg>';
  }

      <div class="sl-sub">星期${WEEK[d.getDay()]} · ${sc.label} · ${j.name}${j.days === 0 ? '交节' : '第' + cnNum(j.days + 1) + '日'} · 距${j.next}${cnNum(j.untilNext)}日</div>

/* ---------- 导入：选文件 / 拖入（含文件夹） / 解压 ---------- */
const Importer = (() => {
  async function entriesFromDT(dt) {
    const items = [], roots = [...(dt.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
    if (!roots.length) { for (const f of dt.files || []) items.push({ path: f.name, data: f, mtime: f.lastModified }); return items; }
    async function walk(entry, pre) {
      if (entry.isFile) { const f = await new Promise((res, rej) => entry.file(res, rej)); items.push({ path: pre + entry.name, data: f, mtime: f.lastModified }); }
      else if (entry.isDirectory) {
        items.push({ path: pre + entry.name, dir: true });
        const rd = entry.createReader(); let batch;
        do { batch = await new Promise((res, rej) => rd.readEntries(res, rej)); for (const e of batch) await walk(e, pre + entry.name + '/'); } while (batch.length);
      }
    }
    for (const r of roots) await walk(r, '');
    return items;
  }
  /** 预检同名：只问一次（替换 / 跳过 / 取消） */
  async function run(destId, items, title = '放入') {
    if (!items.length) return;
    const base = FS.pathOf(destId).replace(/\/$/, '');
    const dup = items.filter(it => !it.dir && FS.exists(base + '/' + it.path));
    let conflict = 'replace';
    if (dup.length) {
      const r = await UI.choose({ title: '有同名文件', glyph: '同', html: `有 <b>${dup.length}</b> 个文件在目标位置已经存在：<div class="dlg-files">${dup.slice(0, 30).map(d => esc(d.path)).join('<br>')}${dup.length > 30 ? '<br>…' : ''}</div>`, options: [{ label: '取消', value: 'cancel', cls: 'ghost' }, { label: '跳过这些', value: 'skip' }, { label: '替换目标文件', value: 'replace', cls: 'primary', primary: 1 }] });
      if (!r || r === 'cancel') return;
      conflict = r;
    }
    const files = items.filter(i => !i.dir), bytes = files.reduce((s, i) => s + (i.data.size || 0), 0);
    const jb = files.length > 3 || bytes > 8 << 20 ? UI.job(title + ' ' + files.length + ' 个文件') : null;
    try {
      const res = await FS.importItems(destId, items, { conflict, onProgress: (i, n, p) => jb && jb.set(i, n, p) });
      const msg = `已放入 ${res.ok} 个文件` + (res.skipped ? `，跳过 ${res.skipped} 个` : '') + (res.failed.length ? `，${res.failed.length} 个失败` : '');
      jb ? jb.done(msg, res.failed.length ? 'warn' : undefined) : UI.toast(msg, { type: res.failed.length ? 'warn' : 'info' });
      if (res.failed.length) console.warn('[导入失败]', res.failed);
      FS.requestPersist();
      return res;
    } catch (e) { jb && jb.done(); UI.toast(e.message || String(e), { type: 'err' }); }
  }
  async function fromDataTransfer(dt, destId) { return run(destId, await entriesFromDT(dt)); }
  async function pick(destId, { dir = false } = {}) {
    const files = await pickFiles({ multiple: true, dir }); if (!files || !files.length) return;
    return run(destId, [...files].map(f => ({ path: (dir && f.webkitRelativePath) || f.name, data: f, mtime: f.lastModified })));
  }
  async function unzip(node, destId = node.parent) {
    const jb = UI.job('解开 ' + node.name);
    try {
      const es = (await Archive.read(await FS.read(node), node.name)).entries;
      const folder = FS.uniqueName(destId, node.name.replace(/\.(tar\.gz|tgz|tar|zip|gz)$/i, '') || baseOf(node.name));
      const items = [{ path: folder, dir: true }];
      let i = 0;
      for (const e of es) {

})();

/* ---------- 备份：全部文件 + 设置 → 一个 ZIP；从 ZIP 还原 ---------- */
const Backup = (() => {
  const MANIFEST = '.qingsi/manifest.json';
  async function zipNodes(ids, onProgress, isCancelled, { manifest } = {}) {
    const w = new ZIP.Writer(), all = [];
    for (const id of ids) {
      const n = FS.get(id); if (!n) continue;
      if (FS.isMount(id) && n.kind === 'dir') await FS.scanDeep(id);   /* 挂载文件夹先整棵读一遍 */
      const rootPath = FS.pathOf(n.parent === FS.ROOT ? FS.ROOT : n.parent).replace(/\/$/, '');
      for (const d of FS.descendants(id)) { const x = FS.get(d); if (x && !x.partial) all.push([x, FS.pathOf(d).slice(rootPath.length + 1)]); }
    }
    let i = 0;
    for (const [x, rel] of all) {
      if (isCancelled && isCancelled()) return null;
      if (x.kind === 'dir') await w.add(rel, null, { dir: true, mtime: x.mtime });
      else { try { await w.add(rel, await FS.read(x), { mtime: x.mtime }); } catch (e) { console.warn('[打包] 跳过', rel, e); } }
      onProgress && onProgress(++i, all.length, rel);
    }
    if (manifest) await w.add(MANIFEST, new Blob([JSON.stringify(manifest, null, 1)], { type: 'application/json' }));
    return w.finish();
  }
  async function exportAll({ withPrefs = true } = {}) {
    const top = FS.list(FS.ROOT).filter(n => !n.mount).map(n => n.id);   /* 挂载的本地文件夹不进备份 */
    const files = {}; for (const id of top) for (const d of FS.descendants(id)) { const x = FS.get(d); if (x && (x.star || x.kind === 'dir')) files[FS.pathOf(d)] = { star: !!x.star, mtime: x.mtime }; }
    const manifest = { app: '青丝 OS', version: 4, at: Date.now(), count: FS.count, prefs: withPrefs ? LS.get('prefs', {}) : null, deskOrder: null, files };
    const name = '青丝备份-' + fmtTime(Date.now()).replace(/[-: ]/g, '').slice(0, 12) + '.zip';
    const jb = UI.job('导出备份');
    try { const z = await zipNodes(top, (i, n, l) => jb.set(i, n, l), () => jb.cancelled, { manifest }); if (!z) return jb.done('已取消'); jb.done(`备份已生成 · ${fmtSize(z.size)}`); downloadBlob(z, name); return z; }
    catch (e) { jb.done(); UI.toast('导出失败：' + (e.message || e), { type: 'err' }); }
  }
  async function importAll(file) {
    if (!file) { const fs = await pickFiles({ multiple: false, accept: '.zip,application/zip' }); file = fs && fs[0]; if (!file) return; }
    let es; try { es = await ZIP.read(file); } catch (e) { return UI.toast('读不了这个压缩包：' + e.message, { type: 'err' }); }
    const me = es.find(e => e.name === MANIFEST); let manifest = null;
    if (me) { try { manifest = JSON.parse(await (await me.blob()).text()); } catch (e) { } }
    const fileEs = es.filter(e => e.name !== MANIFEST && !e.name.startsWith('__MACOSX/'));
    const box = h('div', { style: { marginTop: '10px' } });
    const cbP = h('input.switch', { type: 'checkbox', checked: !!(manifest && manifest.prefs) }); if (!(manifest && manifest.prefs)) cbP.disabled = true;
    box.append(h('label.dlg-check', {}, cbP, h('span', { text: '同时还原设置（主题、壁纸、程序坞…）' })));
    const r = await UI.choose({
      title: '从备份还原', glyph: '卷', extra: box,
      html: manifest ? `这是 <b>${fmtTime(manifest.at)}</b> 的青丝备份，含 <b>${fileEs.filter(e => !e.dir).length}</b> 个文件。<br>还原会与现有文件合并，同名的怎么办？` : `这个压缩包含 <b>${fileEs.filter(e => !e.dir).length}</b> 个文件（不是青丝生成的备份，会按目录结构放进根目录）。<br>同名的怎么办？`,
      options: [{ label: '取消', value: null, cls: 'ghost' }, { label: '跳过同名', value: 'skip' }, { label: '替换同名', value: 'replace', cls: 'primary', primary: 1 }]
    });
    if (!r) return;
    const jb = UI.job('读取备份');
    const items = []; let i = 0;
    for (const e of fileEs) {
      if (jb.cancelled) return jb.done('已取消');
      const p = e.name.replace(/\/$/, ''); if (!p) continue;
      const meta = manifest && manifest.files && manifest.files['/' + p];
      if (e.dir) items.push({ path: p, dir: true });
      else items.push({ path: p, data: await e.blob(mimeOf(p)), mtime: e.mtime, star: meta && meta.star });
      jb.set(++i, fileEs.length, p);
    }
    jb.done();
    const jb2 = UI.job('还原文件');
    const res = await FS.importItems(FS.ROOT, items, { conflict: r, onProgress: (k, n, p) => jb2.set(k, n, p) }).catch(e => { UI.toast(e.message, { type: 'err' }); return null; });
    jb2.done(res ? `已还原 ${res.ok} 个文件${res.skipped ? `，跳过 ${res.skipped} 个` : ''}${res.failed.length ? `，${res.failed.length} 个失败` : ''}` : null);
    if (cbP.checked && manifest && manifest.prefs) { LS.set('prefs', manifest.prefs); Prefs.load(); BUS.emit('pref', '*'); UI.toast('设置已还原'); }
  }
  return { zipNodes, exportAll, importAll, MANIFEST };
})();

/* ---------- 速览（空格） ---------- */
const QuickLook = (() => {
  let el = null, list = [], idx = 0, url = null;
  async function show(n, ctx = []) {
    list = ctx.filter(x => x.kind !== 'dir'); idx = Math.max(0, list.findIndex(x => x.id === n.id)); if (!list.length) list = [n];
    if (!el) {
      el = h('div.ql', { role: 'dialog', 'aria-label': '速览' }); document.body.append(el);
      el.addEventListener('pointerdown', e => { if (e.target === el) close(); });
      document.addEventListener('keydown', key, true);

  }

    const n = list[idx]; if (url) { URL.revokeObjectURL(url); url = null; }
    const k = kindOf(n), body = h('div.ql-body');
    el.replaceChildren(h('div.ql-card', {}, h('div.ql-head', {}, h('b', { text: n.name }), h('span.muted', { text: `${fmtSize(n.size)} · ${fmtRel(n.mtime)}　${idx + 1}/${list.length}` }), h('div.spacer'), h('button.btn.sm', { text: '打开', on: { click: () => { close(); WM.openFile(n); } } }), h('button.ibtn', { html: icon('x'), on: { click: close } })), body));

      else if (isTextKind(k) || n.size < 512 * 1024) { const t = await FS.read(n, 'text'); body.append(h('pre.selectable', { text: t.slice(0, 200000) })); }
      else body.append(h('div.empty', {}, Shell.fileSeal(n, 96), h('div', { text: '这种文件没法速览' })));
    } catch (e) { body.append(h('div.empty', { text: e.message })); }
  }
  const key = e => {
    if (e.key === 'Escape' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); close(); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); e.stopPropagation(); idx = (idx + 1) % list.length; render(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); idx = (idx - 1 + list.length) % list.length; render(); }
  };

})();
